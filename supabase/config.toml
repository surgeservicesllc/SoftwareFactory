project_id = "softwarefactory"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://softwarefactory-tan.vercel.app"
additional_redirect_urls = [
  # www.theagoras.com serves the application on its custom domain. A sign-up
  # started there builds its confirmation link against that origin, and an
  # origin missing from this list is silently replaced by site_url — sending
  # the person to a different hostname than the one they signed up on.
  "https://www.theagoras.com/auth/callback",
  "https://theagoras.com/auth/callback",
  "https://softwarefactory-tan.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8

# Custom SMTP. Confirmations are required (`enable_confirmations` above), and
# Supabase's built-in mail service cannot satisfy that: it is capped at a few
# messages per hour and is not intended to reach end users. Without a real
# provider here, sign-up succeeds and the account can then never be confirmed
# or signed in to.
#
# Every value is read from the environment. No credential belongs in this file
# — it is source-controlled, and `pass` is a live secret.
#
# `supabase config push` fails if any of these are unset, which is deliberate:
# a partially configured mailer would be pushed as a broken one.
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_AUTH_SMTP_HOST)"
port = "env(SUPABASE_AUTH_SMTP_PORT)"
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
# The From address. Its domain must be verified with the provider, or mail is
# accepted and then silently dropped.
sender_name = "env(SUPABASE_AUTH_SMTP_SENDER_NAME)"
admin_email = "env(SUPABASE_AUTH_SMTP_ADMIN_EMAIL)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
