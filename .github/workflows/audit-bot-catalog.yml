name: Audit bot catalog

# Read-only production diagnosis for the bot-account-binding cutover. This
# workflow exists separately from the migration applier so a failed preflight
# can be investigated without retrying DDL or sharing any mutation step.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "audit" to run the read-only production catalog report'
        required: true
      project_ref:
        description: 'Exact Supabase project reference being audited'
        required: true
        default: qpuofpmagrmyamahqwxw

permissions:
  contents: read

concurrency:
  group: audit-bot-catalog
  cancel-in-progress: false

jobs:
  audit:
    name: Report exact legacy bot catalog state
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          inputs.confirm == 'audit' &&
          inputs.project_ref == 'qpuofpmagrmyamahqwxw' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: qpuofpmagrmyamahqwxw
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # PostgreSQL rejects every write in every transaction in this session,
      # independently of the SQL text below.
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=30000

    steps:
      - name: Require the existing protected database credential
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required for this read-only catalog audit."
            exit 1
          fi

      - name: Choose a read-only database connection
        run: |
          ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$ENC"
          FOUND=""
          for HOST in aws-0-us-west-2.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com; do
            URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${HOST}:5432/postgres"
            echo "::add-mask::$URL"
            if [ "$(psql "$URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select current_database() = 'postgres'
                 and current_user = 'postgres'
                 and current_setting('transaction_read_only') = 'on';
            ")" = "t" ]; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              echo "Reached the exact project through ${HOST} with transaction writes disabled."
              FOUND="yes"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Could not establish the read-only production catalog connection."
            exit 1
          fi

      - name: Report the server, ledger, and exact legacy routine fingerprints
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off -c "
            select current_setting('server_version') as server_version,
                   current_setting('server_version_num') as server_version_num;
          "

          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off -c "
            select version, count(*) as ledger_rows
              from supabase_migrations.schema_migrations
             where version in (
               '20260822000100',
               '20260822000150',
               '20260822000200',
               '20260822000300'
             )
             group by version
             order by version;
          "

          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off -c "
            set search_path = pg_catalog;
            with expected(signature, expected_source_md5) as (values
              ('public.register_bot(uuid,text,public.bot_provider,text,text,text,text)', '87f577c2ecba24836e54b4ad5e7f383a'),
              ('public.assign_bot(uuid,uuid,uuid,uuid)', '9e5dea25195823492e3326ed96fa0535'),
              ('public.assign_bots_to_project(uuid,uuid,jsonb)', '742fea5b0e8655f19399f2a3944ce2c9'),
              ('public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)', '81788757faa428efebfc8a8ee7f9b6e6'),
              ('public.set_bot_assignment_execution(uuid,uuid,text,text)', 'cd33f17d969464665066854ff7692a1c'),
              ('public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)', '3637e0869520ee9eae89efd426b0b5c5'),
              ('public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)', 'b39a3820c504f9dda9e84f73e1e4f065')
            ), state as (
              select expected.*,
                     routine.oid,
                     routine.proowner,
                     routine.prokind,
                     routine.provolatile,
                     routine.prosecdef,
                     routine.proconfig,
                     routine.proacl,
                     routine_schema.nspname,
                     routine_language.lanname,
                     md5(routine.prosrc) as actual_source_md5
                from expected
                left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
                left join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
                left join pg_language routine_language on routine_language.oid = routine.prolang
            )
            select signature,
                   oid is not null as present,
                   expected_source_md5,
                   actual_source_md5,
                   actual_source_md5 = expected_source_md5 as source_matches,
                   nspname as schema_name,
                   lanname as language_name,
                   prokind as routine_kind,
                   provolatile as volatility,
                   prosecdef as security_definer,
                   proconfig = array['search_path=pg_catalog']::text[] as search_path_exact,
                   coalesce(cardinality(proconfig), 0) as config_count,
                   pg_get_userbyid(proowner) as owner_name,
                   proacl is null as acl_is_null,
                   coalesce((select count(*) from aclexplode(proacl)), 0) as acl_count,
                   coalesce((
                     select string_agg(
                       concat_ws(':',
                         pg_get_userbyid(acl.grantor),
                         case
                           when acl.grantee = 0 then 'PUBLIC'
                           else pg_get_userbyid(acl.grantee)
                         end,
                         acl.privilege_type,
                         acl.is_grantable::text
                       ),
                       ',' order by acl.grantee, acl.privilege_type
                     )
                       from aclexplode(proacl) acl
                   ), '<null>') as acl_posture,
                   case when oid is null then null else has_function_privilege('authenticated', oid, 'EXECUTE') end as authenticated_execute,
                   case when oid is null then null else has_function_privilege('anon', oid, 'EXECUTE') end as anon_execute,
                   case when oid is null then null else has_function_privilege('service_role', oid, 'EXECUTE') end as service_role_execute
              from state
             order by signature;
          "

          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -P pager=off -c "
            set search_path = pg_catalog;
            select routine.oid::regprocedure::text as live_signature
              from pg_proc routine
              join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
             where routine_schema.nspname = 'public'
               and routine.proname in (
                 'register_bot', 'assign_bot', 'assign_bots_to_project',
                 'record_bot_readiness', 'set_bot_assignment_execution',
                 'update_bot_assignment', 'update_bot_assignment_configuration'
               )
             order by 1;
          "
