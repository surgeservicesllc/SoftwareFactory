                  select pg_get_functiondef(routine_oid) into routine_definition;
                  if routine_oid is null
                    or has_function_privilege('anon',routine_oid,'EXECUTE')
                    or not has_function_privilege('authenticated',routine_oid,'EXECUTE')
                    or has_function_privilege('service_role',routine_oid,'EXECUTE')
                    or not exists (select 1 from pg_proc routine where routine.oid=routine_oid
                      and pg_get_userbyid(routine.proowner)='postgres'
                      and routine.prosecdef and routine.proconfig=array['search_path=pg_catalog']::text[])
                    or strpos(routine_definition,'full lifecycle release gates require evidence-bound approval')=0
                    or strpos(routine_definition,'owner or admin role is required to decide a gate')=0
                    or strpos(routine_definition,'automatic gate approval is worker-only and evidence-bound')=0
                    or exists (select 1 from pg_proc routine where routine.oid=routine_oid and (
                      routine.proacl is null or (select count(*) from aclexplode(routine.proacl))<>2
