              and not exists (select 1 from pg_locks held_lock
                where held_lock.pid<>pg_backend_pid() and held_lock.granted
                  and held_lock.relation in ('public.graphs'::regclass,'public.graph_runs'::regclass,
                    'public.agent_runs'::regclass,'public.node_runs'::regclass,'public.graph_gates'::regclass,
                    'public.graph_artifacts'::regclass,'public.graph_handoffs'::regclass,'public.graph_verifications'::regclass));")
