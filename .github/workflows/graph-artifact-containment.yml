            echo "::error::Production is outside the required stopped lineage state."
            exit 1
          fi

          STAGE_DIR=$(mktemp -d)
          trap 'rm -rf -- "$STAGE_DIR"' EXIT
          STAGED_FILE="$STAGE_DIR/20260827000200_graph_phase1c_release_lineage.sql"
          cp -- "$FILE" "$STAGED_FILE"
          if [ "$(sha256sum "$STAGED_FILE" | cut -d' ' -f1)" != "$EXPECTED_FILE_SHA256" ] \
            || [ "$(find "$STAGE_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::Exact lineage-file staging failed."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -X --single-transaction -q \
            -c "lock table public.organizations in share mode;
                lock table public.projects in share mode;
                lock table public.phase1c_workers in share mode;
                lock table public.graph_artifact_payload_containments in access exclusive mode;
                lock table public.graph_runs in exclusive mode;
                lock table public.graphs in exclusive mode;
                lock table public.node_runs in exclusive mode;
                lock table public.graph_gates in exclusive mode;
                lock table public.graph_artifacts in exclusive mode;
                lock table public.graph_handoffs in exclusive mode;
                lock table public.graph_verifications in exclusive mode;
                lock table public.agent_runs in exclusive mode;
                do \$lineage_guard\$
                begin
                  if (select
                    (select count(*) from supabase_migrations.schema_migrations where version='20260827000100')||'|'||
                    (select count(*) from supabase_migrations.schema_migrations where version='20260827000150')||'|'||
                    (select count(*) from supabase_migrations.schema_migrations where version='20260827000200')||'|'||
                    (select count(*) from supabase_migrations.schema_migrations where version='20260827000210')) <> '1|1|0|1' then
                    raise exception using errcode='55000',message='locked lineage ledger identity mismatch';
                  end if;
                  if exists (
                    with expected(signature) as (values
                      ('public.start_graph_run(uuid)'),('public.claim_planned_graph(text,text[])'),
                      ('public.claim_phase1c_run(text,text,text,integer)'),('public.decide_node_gate(uuid,boolean,text)'),
                      ('public.record_node_state(uuid,public.graph_node_state,text,text,text,integer)'),
                      ('public.complete_graph_run(uuid,public.graph_run_state,boolean,bigint,bigint,text)'),
                      ('public.record_handoff(uuid,uuid,jsonb,boolean,jsonb,uuid,jsonb,jsonb,jsonb,text)'),
                      ('public.record_graph_artifact(uuid,public.graph_artifact_kind,jsonb,uuid,integer,integer)'),
                      ('public.record_verification(uuid,public.verification_lens,public.verification_verdict,jsonb,uuid,text,boolean)')
                    ), routines as (select to_regprocedure(signature) routine from expected)
                    select 1 from routines expected_routine
                    join pg_proc routine_catalog on routine_catalog.oid=expected_routine.routine
                    where pg_get_userbyid(routine_catalog.proowner)<>'postgres'
                      or routine_catalog.proacl is null
                      or (select count(*) from aclexplode(routine_catalog.proacl))<>1
                      or not exists (select 1 from aclexplode(routine_catalog.proacl) privilege
                        where privilege.grantor=routine_catalog.proowner and privilege.grantee=routine_catalog.proowner
                          and privilege.privilege_type='EXECUTE' and not privilege.is_grantable)
                      or exists (select 1 from aclexplode(routine_catalog.proacl) privilege
                        where privilege.grantor<>routine_catalog.proowner or privilege.grantee<>routine_catalog.proowner
                          or privilege.privilege_type<>'EXECUTE' or privilege.is_grantable)
                  ) then
                    raise exception using errcode='55000',message='locked legacy function ACL has an unexpected grantee';
                  end if;
                  if exists (select 1 from public.organizations where autonomous_mode or not autonomy_kill_switch_active or auto_plan or auto_code or auto_test or auto_repair or auto_review or auto_approve or auto_merge or auto_deploy or auto_rollback)
                    or exists (select 1 from public.projects where autonomous_mode or auto_plan or auto_code or auto_test or auto_repair or auto_review or auto_approve or auto_merge or auto_deploy or auto_rollback)
                    or exists (select 1 from public.phase1c_workers where status in ('active','draining') and last_heartbeat_at>now()-interval '5 minutes')
                    or exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
                    or exists (select 1 from public.agent_runs where status='running'::public.run_status) then
                    raise exception using errcode='55000',message='locked lineage safety state is not stopped';
                  end if;
                  if exists (select 1 from public.graph_artifacts where public.jsonb_has_sensitive_keys(payload) or octet_length(payload::text)>1048576) then
                    raise exception using errcode='55000',message='locked legacy graph artifact containment is incomplete';
                  end if;
                  if not (select relrowsecurity and relforcerowsecurity and pg_get_userbyid(relowner)='postgres' from pg_class
                          where oid='public.graph_artifact_payload_containments'::regclass)
                    or has_table_privilege('anon','public.graph_artifact_payload_containments','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                    or has_table_privilege('authenticated','public.graph_artifact_payload_containments','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                    or has_table_privilege('service_role','public.graph_artifact_payload_containments','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                    or exists (select 1 from pg_class relation cross join lateral aclexplode(coalesce(relation.relacl,acldefault('r',relation.relowner))) privilege
                      where relation.oid='public.graph_artifact_payload_containments'::regclass and privilege.grantee<>relation.relowner)
                    or has_function_privilege('anon','public.enforce_graph_artifact_payload_containment_immutable()','EXECUTE')
                    or has_function_privilege('authenticated','public.enforce_graph_artifact_payload_containment_immutable()','EXECUTE')
                    or has_function_privilege('service_role','public.enforce_graph_artifact_payload_containment_immutable()','EXECUTE')
                    or exists (select 1 from pg_proc routine cross join lateral aclexplode(coalesce(routine.proacl,acldefault('f',routine.proowner))) privilege
                      where routine.oid=to_regprocedure('public.enforce_graph_artifact_payload_containment_immutable()') and privilege.grantee<>routine.proowner)
                    or not exists (select 1 from pg_proc routine join pg_language routine_language on routine_language.oid=routine.prolang
                      where routine.oid=to_regprocedure('public.enforce_graph_artifact_payload_containment_immutable()')
                        and routine_language.lanname='plpgsql' and pg_get_userbyid(routine.proowner)='postgres'
                        and routine.prokind='f' and routine.provolatile='v' and routine.prorettype='trigger'::regtype
                        and routine.prosecdef and routine.proconfig=array['search_path=pg_catalog']::text[]
                        and btrim(replace(replace(routine.prosrc,E'\r\n',E'\n'),E'\r',E'\n'),E' \n')=E'begin\n  raise exception using errcode = ''55000'',\n    message = ''graph artifact payload containment evidence is immutable'';\nend;'
                        and routine.proacl is not null and (select count(*) from aclexplode(routine.proacl))=1
                        and exists (select 1 from aclexplode(routine.proacl) privilege
                          where privilege.grantor=routine.proowner and privilege.grantee=routine.proowner
                            and privilege.privilege_type='EXECUTE' and not privilege.is_grantable))
                    or exists (select 1 from pg_constraint where conrelid='public.graph_artifact_payload_containments'::regclass and contype='f')
                    or not exists (select 1 from pg_trigger where tgrelid='public.graph_artifact_payload_containments'::regclass and tgname='graph_artifact_payload_containments_immutable' and not tgisinternal and tgenabled='O' and tgtype=58 and tgfoid=to_regprocedure('public.enforce_graph_artifact_payload_containment_immutable()'))
                    or not exists (select 1 from pg_trigger where tgrelid='public.graph_artifacts'::regclass and tgname='graph_artifacts_update_immutable' and not tgisinternal and tgenabled='O') then
                    raise exception using errcode='55000',message='locked containment RLS ACL or audit boundary is not exact';
                  end if;
                  if (select count(*) from public.graph_artifact_payload_containments)<>${EXPECTED_COUNT}
                    or (select encode(sha256(convert_to(coalesce(string_agg(
                      concat_ws('|',artifact_id::text,organization_id::text,graph_run_id::text,
                        coalesce(node_run_id::text,'-'),artifact_kind::text,original_payload_sha256,
                        original_payload_octets::text,sensitive_data_detected::text,size_limit_exceeded::text),
                      E'\\n' order by artifact_id::text),''),'UTF8')),'hex')
                      from public.graph_artifact_payload_containments)<>'${EXPECTED_MANIFEST_SHA256}'
                    or exists (select 1 from public.graph_artifact_payload_containments containment
                      left join public.graph_artifacts artifact on artifact.id=containment.artifact_id
                      where artifact.id is null or artifact.payload is distinct from jsonb_build_object(
                        'contained',true,'containmentEvidenceId',containment.id,'reason','legacy_artifact_policy_violation')) then
                    raise exception using errcode='55000',message='locked containment manifest or tombstone identity mismatch';
                  end if;
                end
                \$lineage_guard\$;" \
            -f "$STAGED_FILE" \
            -c "do \$lineage_acl_postflight\$
                declare
                  signature text;
                  routine_oid regprocedure;
                  authenticated_oid oid;
                  service_role_oid oid;
                  routine_definition text;
                begin
                  select oid into authenticated_oid from pg_roles where rolname='authenticated';
                  select oid into service_role_oid from pg_roles where rolname='service_role';
                  if authenticated_oid is null or service_role_oid is null then
                    raise exception using errcode='55000',message='lineage app-role identity is missing';
                  end if;

                  foreach signature in array array[
                    'start_graph_run(uuid)',
                    'claim_planned_graph(text,text[])',
                    'claim_planned_graph_internal(text,text[],text,jsonb)',
                    'claim_phase1c_run(text,text,text,integer)',
                    'record_node_state(uuid,public.graph_node_state,text,text,text,integer)',
                    'complete_graph_run(uuid,public.graph_run_state,boolean,bigint,bigint,text)',
                    'record_handoff(uuid,uuid,jsonb,boolean,jsonb,uuid,jsonb,jsonb,jsonb,text)',
                    'record_graph_artifact(uuid,public.graph_artifact_kind,jsonb,uuid,integer,integer)',
                    'record_verification(uuid,public.verification_lens,public.verification_verdict,jsonb,uuid,text,boolean)',
                    'read_prior_node_results_as_worker(text,uuid)',
                    'diagnose_graph_queue_as_worker(text)'
                  ] loop
                    routine_oid:=to_regprocedure('public.'||signature);
                    if routine_oid is null
                      or has_function_privilege('anon',routine_oid,'EXECUTE')
                      or has_function_privilege('authenticated',routine_oid,'EXECUTE')
                      or has_function_privilege('service_role',routine_oid,'EXECUTE')
                      or exists (select 1 from pg_proc routine where routine.oid=routine_oid and (
                        pg_get_userbyid(routine.proowner)<>'postgres' or routine.proacl is null
                        or (select count(*) from aclexplode(routine.proacl))<>1
                        or not exists (select 1 from aclexplode(routine.proacl) privilege
                          where privilege.grantor=routine.proowner and privilege.grantee=routine.proowner
                            and privilege.privilege_type='EXECUTE' and not privilege.is_grantable)
                        or exists (select 1 from aclexplode(routine.proacl) privilege
                          where privilege.grantor<>routine.proowner or privilege.grantee<>routine.proowner
                            or privilege.privilege_type<>'EXECUTE' or privilege.is_grantable))) then
                      raise exception using errcode='55000',message='private lineage function ACL is not owner-only';
                    end if;
