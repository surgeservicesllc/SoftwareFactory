name: Job Seeker live journey

# The whole /job-seeker surface, driven in a real browser against a real
# Supabase stack (supabase start: real Postgres carrying the full migration
# chain, real PostgREST, real GoTrue) with the production Next build in
# front — the JOB_SEEKER_E2E journey from tests/e2e/job-seeker-journey.spec.ts.
# This is the lane ADR-097 left open: the journey ran on demand in a
# sandbox; here it runs on a cadence, so live-wiring regressions (like the
# PostgREST one-to-one embed shape it originally caught) surface within a
# day instead of at the next manual run.
#
# No deployment, no production credentials, no provider usage: everything
# in this lane is local to the runner, and the only keys involved are the
# Supabase CLI's public local-development defaults.
#
# Remote mode (owner-directed): dispatching with base_url set skips the
# local stack entirely and drives the SAME journey against that deployed
# site with the named fake account. The account credentials here are a
# throwaway guarding synthetic data in the owner's own project — the fake
# journey identity, not a secret.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Remote target (e.g. https://www.theagoras.com). Empty = provision a local stack."
        required: false
        type: string
        default: ""
      email:
        description: "Fake journey account email (remote mode)"
        required: false
        type: string
        default: "jordan.seeker.prod1@example.org"
      password:
        description: "Fake journey account password (remote mode; throwaway test identity)"
        required: false
        type: string
        default: "fake-data-journey-2026x"
  schedule:
    # Daily, off the busy hours of every other scheduled lane.
    - cron: "41 7 * * *"

permissions:
  contents: read

concurrency:
  group: job-seeker-journey
  cancel-in-progress: false

jobs:
  journey:
    name: Full fake-data journey against a local stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        # Bounded and retried; same failure modes as ci.yml's install step
        # (stalled apt mirrors, orphaned dpkg locks between attempts).
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt ${attempt} failed or hung; clearing stale apt state and retrying."
            sudo killall -q apt-get apt dpkg 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            sudo dpkg --configure -a 2>/dev/null || true
          done
          echo "Chromium could not be installed after 3 bounded attempts."
          exit 1

      - name: Start the local Supabase stack
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        # The journey needs db, auth, rest, and kong; everything else is
        # excluded so the stack boots lean and fast. config.toml reads SMTP
        # settings through env(), so dummies must exist for auth to start —
        # confirmations never send because the journey's user is minted
        # pre-confirmed through the admin API.
        env:
          SUPABASE_AUTH_SMTP_HOST: localhost
          SUPABASE_AUTH_SMTP_USER: journey
          SUPABASE_AUTH_SMTP_PASS: journey
          SUPABASE_AUTH_SMTP_SENDER_NAME: journey
          SUPABASE_AUTH_SMTP_ADMIN_EMAIL: journey@example.com
        run: |
          npx --yes supabase@2 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Mint the journey user and point the app at the stack
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        # The local stack's keys are the Supabase CLI's public development
        # defaults — not secrets. The user is admin-created with
        # email_confirm so the flow never depends on receiving mail.
        run: |
          STATUS=$(npx supabase status -o json)
          SUPA_URL=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin)['API_URL'])")
          ANON=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ANON_KEY') or d.get('PUBLISHABLE_KEY',''))")
          SERVICE=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('SERVICE_ROLE_KEY') or d.get('SECRET_KEY',''))")
          curl -sf -X POST "$SUPA_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            -H "Content-Type: application/json" \
            -d '{"email":"jordan.seeker@example.com","password":"fake-data-journey-2026!","email_confirm":true,"user_metadata":{"full_name":"Jordan Seeker"}}' \
            > /dev/null
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPA_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
          } > .env.local

      - name: Build and serve the production app
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        run: |
          npm run build
          nohup npx next start > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "The app never answered on :3000."
          tail -50 next-start.log
          exit 1

      - name: Run the journey (local stack)
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        env:
          JOB_SEEKER_E2E: 1
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/job-seeker-journey.spec.ts --project=desktop-chromium --reporter=line

      - name: Run the journey (remote target)
        if: ${{ inputs.base_url != '' && inputs.base_url != null }}
        env:
          JOB_SEEKER_E2E: 1
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          JOB_SEEKER_E2E_EMAIL: ${{ inputs.email }}
          JOB_SEEKER_E2E_PASSWORD: ${{ inputs.password }}
        run: npx playwright test tests/e2e/job-seeker-journey.spec.ts --project=desktop-chromium --reporter=line
