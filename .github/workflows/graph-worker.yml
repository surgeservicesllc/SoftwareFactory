name: Graph executor worker

# Drains PLANNED graphs: claims each one, compiles it back through the
# engine, and executes its nodes — in parallel up to the graph's budget —
# through the subscription transport, persisting every node transition and
# artifact to hosted Supabase. Read-only analysis nodes only; work that
# writes files stays with the Phase 1C worker and its isolation discipline.
#
# Globally disabled by default: every event type stays inert unless the
# repository variable SOFTWAREFACTORY_GRAPH_WORKER_ENABLED is exactly
# "true". The separate SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED switch only
# admits scheduled draining after that global gate is enabled.

on:
  workflow_dispatch:
    inputs:
      graph_id:
        description: Exact graph UUID to execute once
        required: true
        type: string
  repository_dispatch:
    types:
      - softwarefactory_graph_planned
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read
  # The TEST anchor may read CI check-run verdicts when explicit produced-
  # change lineage is supplied; observation only, nothing on GitHub is written.
  checks: read
  # REVIEW verifies the exact Phase 1C PR head/base/state before accepting its
  # stored validation evidence.
  pull-requests: read
  # DEPLOY observes an existing exact-SHA Production deployment and status.
  # It never creates, updates, or approves a deployment.
  deployments: read

concurrency:
  group: graph-worker
  cancel-in-progress: false

jobs:
  drain:
    name: Drain planned graphs
    # Manual dispatch can select a ref in GitHub's UI. Never expose production
    # credentials to a manually selected non-main checkout.
    if: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED == 'true') }}
    runs-on: ubuntu-latest
    # Must exceed the graph duration budget, or the workflow kills a run the
    # budget still considers live — leaving it RUNNING until the two-hour
    # reclaim sweep. The ceiling is the *widest* template budget rather than
    # the default: templates declare what they need.
    # The full lifecycle asks for 220 minutes because thirteen sequential
    # stages at the measured eight-minute model envelope genuinely take that
    # in the worst case (the agentic SDLC's nine ask 150). This allows the
    # deepest plus setup; GitHub caps a hosted job at 360. The relationship
    # is pinned by tests/unit/graph-budget-fit.test.ts, which reads this
    # number and compares it against every template's own budget.
    timeout-minutes: 240
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # The TEST anchor's definition of "CI passed": the same required-check
      # names the Phase 1C worker waits for, pinned to ci.yml's job names by
      # tests/integration/required-checks-wiring.test.ts. Without this the
      # anchor would read every check, and an unrelated red integration check
      # would veto commits the repository itself considers verified.
      SOFTWAREFACTORY_REQUIRED_CHECKS: Lint, typecheck, test, and build|Browser and accessibility tests 1/3|Browser and accessibility tests 2/3|Browser and accessibility tests 3/3

    steps:
      - name: Check out the reviewed worker release
        # actions/checkout v4 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up supported Node.js
        # actions/setup-node v4 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install the locked worker runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Claude CLI
        # The subscription transport drives the real CLI; the version the
        # headless flow was probed against, pinned like the auth broker's.
        run: npm install -g @anthropic-ai/claude-code@2.1.233

      - name: Drain planned graphs
        env:
          SOFTWAREFACTORY_GRAPH_WORKER_ENABLED: "true"
          SOFTWAREFACTORY_WORKER_ID: graph-worker-${{ github.run_id }}-${{ github.run_attempt }}
          # Dispatch/manual wakes are exact-target and one-shot. The disabled-
          # by-default schedule remains the only global drain path.
          SOFTWAREFACTORY_TARGET_GRAPH_ID: ${{ github.event.client_payload.graph_id || inputs.graph_id || '' }}
          SOFTWAREFACTORY_TARGET_CLAIM_REQUIRED: ${{ github.event_name != 'schedule' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SOFTWAREFACTORY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOFTWAREFACTORY_SUPABASE_SERVICE_ROLE_KEY }}
          # The subscription credential; no ANTHROPIC_API_KEY is supplied, so
          # this cannot quietly become a billed run.
          SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN }}
          # Anchor instrument access only. Produced-change, merge, deployment,
          # and monitor URL identities come exclusively from the graph-scoped
          # Phase 1C bridge projection; GITHUB_SHA and workflow variables are
          # never substituted for that lineage.
          SOFTWAREFACTORY_CHECKS_TOKEN: ${{ github.token }}
          # The server-only marker protects Next.js client bundles; in a Node
          # worker it would simply throw. The shim maps that one specifier to
          # the empty module the package ships for server environments.
          NODE_OPTIONS: --import ./scripts/server-only-shim.mjs
        run: npx tsx scripts/graph-worker.mts ${{ github.event_name == 'schedule' && '--drain' || '--once' }}
