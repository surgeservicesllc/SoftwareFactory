name: Graph executor worker

# Runs one exact PLANNED graph: claims it, compiles it back through the engine,
# and executes its nodes — in parallel up to the graph's budget —
# through the subscription transport, persisting every node transition and
# artifact to hosted Supabase. Read-only analysis nodes only; work that
# writes files stays with the Phase 1C worker and its isolation discipline.
#
# Globally disabled by default. Dispatch/manual events must also carry one
# exact graph UUID. The retained schedule is deliberately inert until a future
# scheduler can establish an equally exact database target; it never drains an
# ambient repository queue.

on:
  workflow_dispatch:
    inputs:
      graph_id:
        description: Exact graph UUID to execute once
        required: true
        type: string
  repository_dispatch:
    types:
      - softwarefactory_graph_planned
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

concurrency:
  group: graph-worker
  cancel-in-progress: false

jobs:
  drain:
    name: Run exact planned graph
    # Manual dispatch can select a ref in GitHub's UI. Never expose production
    # credentials to a manually selected non-main checkout.
    if: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED == 'true' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') && (github.event.client_payload.graph_id != '' || inputs.graph_id != '') }}
    runs-on: ubuntu-latest
    # Must exceed the graph duration budget, or the workflow kills a run the
    # budget still considers live — leaving it RUNNING until the two-hour
    # reclaim sweep. The ceiling is the *widest* template budget rather than
    # the default: templates declare what they need.
    # The full lifecycle asks for 220 minutes because thirteen sequential
    # stages at the measured eight-minute model envelope genuinely take that
    # in the worst case (the agentic SDLC's nine ask 150). This allows the
    # deepest plus setup; GitHub caps a hosted job at 360. The relationship
    # is pinned by tests/unit/graph-budget-fit.test.ts, which reads this
    # number and compares it against every template's own budget.
    timeout-minutes: 240
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out the reviewed worker release
        # actions/checkout v4 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up supported Node.js
        # actions/setup-node v4 (reviewed immutable commit)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install the locked worker runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Claude CLI
        # The subscription transport drives the real CLI; the version the
        # headless flow was probed against, pinned like the auth broker's.
        run: npm install -g @anthropic-ai/claude-code@2.1.233

      - name: Drain planned graphs
        env:
          SOFTWAREFACTORY_GRAPH_WORKER_ENABLED: "true"
          SOFTWAREFACTORY_WORKER_ID: graph-worker-${{ github.run_id }}-${{ github.run_attempt }}
          SOFTWAREFACTORY_GRAPH_WORK_ROOT: ${{ runner.temp }}/softwarefactory-graph-worker
          SOFTWAREFACTORY_TARGET_GRAPH_ID: ${{ github.event.client_payload.graph_id || inputs.graph_id || '' }}
          # An owner Resume carries an exact, opaque durable intent identity.
          # GitHub accepting this event is not a wake; the claimed worker must
          # receipt this pair in Supabase before any provider node can start.
          SOFTWAREFACTORY_GROK_WAKE_INTENT_ID: ${{ github.event.client_payload.wake_intent_id || '' }}
          SOFTWAREFACTORY_GROK_CONTROL_REVISION: ${{ github.event.client_payload.control_revision || '' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SOFTWAREFACTORY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SOFTWAREFACTORY_SUPABASE_SERVICE_ROLE_KEY }}
          SOFTWAREFACTORY_CREDENTIAL_KEY: ${{ secrets.SOFTWAREFACTORY_CREDENTIAL_KEY }}
          GITHUB_APP_ID: ${{ secrets.SOFTWAREFACTORY_GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.SOFTWAREFACTORY_GITHUB_APP_PRIVATE_KEY_BASE64 }}
          GITHUB_CANDIDATE_APP_ID: ${{ secrets.SOFTWAREFACTORY_GITHUB_CANDIDATE_APP_ID }}
          GITHUB_CANDIDATE_APP_PRIVATE_KEY_BASE64: ${{ secrets.SOFTWAREFACTORY_GITHUB_CANDIDATE_APP_PRIVATE_KEY_BASE64 }}
          # The subscription credential; no ANTHROPIC_API_KEY is supplied, so
          # this cannot quietly become a billed run.
          SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN }}
          # The server-only marker protects Next.js client bundles; in a Node
          # worker it would simply throw. The shim maps that one specifier to
          # the empty module the package ships for server environments.
          NODE_OPTIONS: --import ./scripts/server-only-shim.mjs
        run: npx tsx scripts/graph-worker.mts --once
