name: Phase 2A Claude worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Verify Claude subscription authentication
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CI: true
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Verify Claude Code
        run: claude --version

      - name: Verify Claude OAuth authentication
        run: |
          claude -p "Reply with exactly: CLAUDE_OAUTH_OK"
