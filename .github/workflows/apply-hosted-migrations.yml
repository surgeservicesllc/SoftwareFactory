          fi

          AFTER=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260823001000';")
          if [ "$AFTER" != "1" ]; then
            echo "::error::The ledger still does not record 20260823001000."
            exit 1
          fi
          echo "Recorded: scope=all can no longer overwrite the cost read with the older one."

