                  coalesce(array_to_string(routine.proargmodes, ','), ''),
                  coalesce((
                    select string_agg(format_type(argument_type.type_oid, null), ',' order by argument_type.ordinality)
                    from unnest(routine.proallargtypes)
                      with ordinality argument_type(type_oid, ordinality)
                  ), ''),
                  coalesce(pg_get_expr(routine.proargdefaults, 0), ''),
                  routine.proisstrict, routine.proleakproof, routine.proparallel::text,
                  case when routine.provariadic = 0 then '' else format_type(routine.provariadic, null) end,
                  routine.procost::text, routine.prorows::text,
                  case when routine.prosupport = 0 then '' else routine.prosupport::regproc::text end,
                  coalesce(routine.probin, ''), routine.prosqlbody is null,
                  routine.protrftypes is null,
                  case when expected.signature in (
                    'public.claim_provider_connect_session(text,text)',
                    'public.normalize_bot_assignment_configuration(jsonb)',
                    'public.record_claim_anchoring(uuid,public.anchored_claim,uuid[])',
                    'public.validate_pipeline_template_areas(jsonb)'
                  ) then null else has_function_privilege('authenticated', expected.signature, 'EXECUTE') end,
                  case when expected.signature in (
                    'public.claim_provider_connect_session(text,text)',
                    'public.normalize_bot_assignment_configuration(jsonb)',
                    'public.record_claim_anchoring(uuid,public.anchored_claim,uuid[])',
                    'public.validate_pipeline_template_areas(jsonb)'
                  ) then null else has_function_privilege('anon', expected.signature, 'EXECUTE') end,
                  case when expected.signature in (
                    'public.claim_provider_connect_session(text,text)',
                    'public.normalize_bot_assignment_configuration(jsonb)',
                    'public.record_claim_anchoring(uuid,public.anchored_claim,uuid[])',
                    'public.validate_pipeline_template_areas(jsonb)'
                  ) then null else has_function_privilege('service_role', expected.signature, 'EXECUTE') end
                )::text), E'\n' order by expected.signature)
              from expected
              join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
              join pg_language routine_language on routine_language.oid = routine.prolang;"
          }
          FUNCTION_CONTRACT_BEFORE=$(function_contract)
          if [ -z "$FUNCTION_CONTRACT_BEFORE" ]; then
            echo "::error::Could not freeze the fourteen lint-target identities that 01000 must leave unchanged."
            exit 1
          fi

          assert_containment() {
            CONTAINMENT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              with expected_projects(organization_id, project_id, project_name) as (values
                ('2614f3b2-ac24-4353-bda6-320a8c254d3b'::uuid,
                 'b1f23696-437e-4d89-b55f-d7a949980e8f'::uuid, 'SoftwareFactory'),
                ('96be00cc-6bf9-42a3-9931-97f9595bda0b'::uuid,
                 'bd90348c-41f4-487c-9681-6b4a4ca911e4'::uuid, 'SoftwareFactory'),
                ('96be00cc-6bf9-42a3-9931-97f9595bda0b'::uuid,
                 'f8de941d-dc9e-4c66-9d3a-00cd61c2d794'::uuid, 'SoftwareFactory_08.17.2026'),
                ('96be00cc-6bf9-42a3-9931-97f9595bda0b'::uuid,
                 '34afd05b-6550-41ae-a397-913b9f44966a'::uuid, 'SoftwareFactory_08.21.2026')
              ), target_projects as (
                select p.*, o.autonomous_mode as org_autonomous_mode,
                       o.maximum_autonomous_risk as org_maximum_autonomous_risk,
                       o.auto_plan as org_auto_plan, o.auto_code as org_auto_code,
                       o.auto_test as org_auto_test, o.auto_repair as org_auto_repair,
                       o.auto_review as org_auto_review, o.auto_approve as org_auto_approve,
                       o.auto_merge as org_auto_merge, o.auto_deploy as org_auto_deploy,
                       o.auto_rollback as org_auto_rollback,
                       o.autonomy_kill_switch_active
                from expected_projects expected
                join public.projects p
                  on p.id = expected.project_id
                 and p.organization_id = expected.organization_id
                 and p.name = expected.project_name
                join public.organizations o on o.id = p.organization_id
              ), resolved as (
                select controls.*
                from target_projects project
                cross join lateral public.resolved_autonomy_controls(project.id) controls
              )
              select (select count(*) = 4 from target_projects)
                 and (select count(distinct organization_id) = 2 from target_projects)
                 and (select count(*) = 4 from public.projects project
                      where project.name in (
                        'SoftwareFactory', 'SoftwareFactory_08.17.2026',
                        'SoftwareFactory_08.21.2026'
                      ))
                 and (select bool_and(
                   org_autonomous_mode is false
                   and org_maximum_autonomous_risk is not distinct from 'green'::public.risk_level
                   and org_auto_plan is false and org_auto_code is false and org_auto_test is false
                   and org_auto_repair is false and org_auto_review is false and org_auto_approve is false
                   and org_auto_merge is false and org_auto_deploy is false and org_auto_rollback is false
                   and autonomy_kill_switch_active is true
                   and autonomous_mode is false
                   and maximum_autonomous_risk is not distinct from 'green'::public.risk_level
                   and auto_plan is false and auto_code is false and auto_test is false
                   and auto_repair is false and auto_review is false and auto_approve is false
                   and auto_merge is false and auto_deploy is false and auto_rollback is false
                 ) from target_projects)
                 and (select count(*) = 4 and bool_and(
                   autonomous_mode is false
                   and maximum_autonomous_risk is not distinct from 'green'::public.risk_level
                   and auto_plan is false and auto_code is false and auto_test is false
                   and auto_repair is false and auto_review is false and auto_approve is false
                   and auto_merge is false and auto_deploy is false and auto_rollback is false
                   and kill_switch_active is true and executor_connected is false
                 ) from resolved)
                 -- The audit trail must agree with the contained state: for each
                 -- org, the newest autonomy.kill_switch_changed event (if any)
                 -- must have engaged the switch. Requiring an engage event to
                 -- exist was unsatisfiable for a tenant whose switch has been ON
                 -- since creation, because set_autonomy_kill_switch only writes
                 -- an event on a real change; the state clause above still
                 -- requires the switch itself to be ON.
                 and not exists (
                   select 1
                   from (select distinct organization_id from expected_projects) expected_org
                   where exists (
                     select 1 from public.activity_events event
                     where event.organization_id = expected_org.organization_id
                       and event.event_type::text = 'autonomy.kill_switch_changed'
                       and event.entity_type = 'organization'
                       and event.entity_id = expected_org.organization_id
                   )
                   and (
                     select event.metadata ->> 'active'
                     from public.activity_events event
                     where event.organization_id = expected_org.organization_id
                       and event.event_type::text = 'autonomy.kill_switch_changed'
                       and event.entity_type = 'organization'
                       and event.entity_id = expected_org.organization_id
                     order by event.created_at desc, event.id desc
                     limit 1
                   ) is distinct from 'true'
                 )
                 -- Same trail-agreement shape per project. Requiring an
                 -- autonomy-off change event to exist was unsatisfiable by
                 -- design: project.autonomous_mode_changed only writes on a
                 -- real flip, and update_project_controls refuses ever turning
                 -- project autonomy ON (Phase 1D scaffold-only), so the flip
                 -- that would mint the event is forbidden by the platform. The
                 -- state clauses above still require every mode OFF; here the
                 -- newest autonomy-affecting event (if any) must not contradict
                 -- that.
                 and not exists (
                   select 1 from expected_projects expected
                   where (
                     select case
                       when event.event_type::text = 'project.autonomous_mode_changed'
                         then event.metadata ->> 'to'
                       else event.metadata ->> 'autonomousMode'
                     end
                     from public.activity_events event
                     where event.organization_id = expected.organization_id
                       and (event.project_id = expected.project_id or event.entity_id = expected.project_id)
                       and (
                         event.event_type::text = 'project.autonomous_mode_changed'
                         or event.event_type::text = 'autonomy.controls_changed'
                       )
                     order by event.created_at desc, event.id desc
                     limit 1
                   ) = 'true'
                 )
                 and (select relation.relrowsecurity and relation.relforcerowsecurity
                             and pg_get_userbyid(relation.relowner) = 'postgres'
                             and not has_table_privilege('anon', relation.oid, 'UPDATE,DELETE,TRUNCATE')
                             and not has_table_privilege('authenticated', relation.oid, 'UPDATE,DELETE,TRUNCATE')
                             and not has_table_privilege('service_role', relation.oid, 'UPDATE,DELETE,TRUNCATE')
                        from pg_class relation
                       where relation.oid = 'public.activity_events'::regclass)
                 and (select routine_language.lanname = 'plpgsql'
                             and routine.prokind = 'f' and routine.provolatile = 'v'
                             and routine.prorettype = 'trigger'::regtype
                             and not routine.prosecdef
                             and routine.proconfig = array['search_path=pg_catalog']::text[]
                             and pg_get_userbyid(routine.proowner) = 'postgres'
                             and btrim(replace(replace(routine.prosrc, E'\\r\\n', E'\\n'), E'\\r', E'\\n'), E' \\n') =
                               E'begin\\n  raise exception using errcode = ''55000'', message = ''activity events are append-only'';\\nend;'
                             and not has_function_privilege('anon', routine.oid, 'EXECUTE')
                             and not has_function_privilege('authenticated', routine.oid, 'EXECUTE')
                             and not has_function_privilege('service_role', routine.oid, 'EXECUTE')
                        from pg_proc routine
                        join pg_language routine_language on routine_language.oid = routine.prolang
                       where routine.oid = 'public.reject_activity_event_mutation()'::regprocedure)
                 and exists (
                   select 1 from pg_trigger trigger_row
                   where trigger_row.tgrelid = 'public.activity_events'::regclass
                     and trigger_row.tgname = 'activity_events_append_only'
                     and not trigger_row.tgisinternal and trigger_row.tgenabled = 'O'
                     and trigger_row.tgtype = 27
                     and trigger_row.tgfoid = 'public.reject_activity_event_mutation()'::regprocedure
                     and trigger_row.tgconstraint = 0 and trigger_row.tgparentid = 0
                     and trigger_row.tgqual is null
                 )
                 and not exists (
                   select 1 from public.phase1c_workers worker
                   where worker.last_heartbeat_at > now() + interval '1 minute'
                 )
                 and not exists (
                   select 1 from public.phase1c_workers worker
                   where worker.last_heartbeat_at > now() - interval '10 minutes'
                 )
                 and not exists (
                   select 1 from public.phase1c_workers worker
                   where worker.current_run_id is not null
                 );")
            if [ "$CONTAINMENT" != "t" ]; then
              echo "::error::Containment gate failed: autonomy/actions must remain OFF, kill switch ON, and executor/worker disconnected."
              exit 1
            fi
          }
          assert_containment

          EXTENSION_BASELINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select
              count(*) filter (where extension_row.oid is not null),
              count(*) filter (where routine.oid is not null)
            from (values (1)) seed(value)
            left join pg_extension extension_row on extension_row.extname = 'plpgsql_check'
            left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_BASELINE" != "0|0" ]; then
            echo "::error::plpgsql_check extension/function residue existed before the transactional lint; refusing to alter extension state."
            exit 1
          fi

          LINT_FINDINGS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -c "begin;" \
            -f "$CONTRACT_FILE" \
            -f "$HOSTED_FUNCTION_ACL_FILE" \
            -f "$REPAIR_FILE" \
            -f "$RECORD_ONLY_FILE" \
            -f "$FUNCTION_ACL_FILE" \
            -f "$CLEAR_FUNCTION_ACL_FILE" \
            -c "create extension if not exists plpgsql_check with schema extensions;" \
            -c "with expected(signature, trigger_relation) as (values
              ('public.agentos_resolved_agent_grants(uuid)', null),
              ('public.agentos_list_agent_grants(uuid,integer)', null),
              ('public.agentos_export_project_config(uuid,uuid)', null),
              ('public.agentos_apply_project_config(uuid,uuid,jsonb,boolean)', null),
              ('public.record_claim_anchoring(uuid,public.anchored_claim,uuid[])', null),
              ('public.claim_provider_connect_session(text,text)', null),
              ('public.normalize_bot_assignment_configuration(jsonb)', null),
              ('public.capture_improvement_baseline(uuid)', null),
              ('public.audit_factory_health(uuid)', null),
              ('public.validate_pipeline_template_areas(jsonb)', null),
              ('public.list_factory_command_routing_candidates(uuid,uuid,text)', null),
              ('public.list_factory_commands(uuid,integer,uuid)', null),
              ('public.submit_factory_command(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)', null),
              ('public.submit_factory_command_routing_internal(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)', null),
              ('public.submit_command(uuid,text,public.risk_level,jsonb,text)', null),
              ('public.submit_command_phase1c_normalized_internal(uuid,text,public.risk_level,jsonb,text)', null),
              ('public.normalize_phase1c_command()', 'public.commands'),
              ('public.plan_phase1c_task_and_run()', 'public.tasks'),
              ('public.queue_phase1c_run_for_task()', 'public.tasks'),
              ('public.record_provider_run(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', null),
              ('public.record_provider_run_phase1c_compatibility_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', null),
              ('public.record_provider_run_phase2a_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', null),
              ('public.assign_bots_to_project_checked(uuid,uuid,jsonb)', null),
              ('public.update_bot_assignment_configuration_checked(uuid,uuid,uuid,bigint,jsonb,uuid,public.bot_assignment_status)', null),
              ('public.update_bot_assignment_checked(uuid,uuid,uuid,bigint,public.bot_assignment_status)', null),
              ('public.set_bot_assignment_execution_checked(uuid,uuid,uuid,bigint,text,text)', null),
              ('public.agentos_record_trigger_delivery(uuid,text,jsonb,boolean)', null)
            )
            select 'LINTROW|' || expected.signature || '|' || coalesce(finding.lineno::text, '') || '|' || coalesce(finding.level, '') || '|' || coalesce(finding.sqlstate, '') || '|' || coalesce(finding.message, '')
            from expected
            cross join lateral extensions.plpgsql_check_function_tb(
              expected.signature::regprocedure,
              coalesce(expected.trigger_relation::regclass, 0::regclass),
              false, true, true, false, false, false
            ) finding
            where finding.level in ('error', 'warning', 'extra')
            order by expected.signature, finding.lineno, finding.position;" \
            -c "rollback;")
          if printf '%s\n' "$LINT_FINDINGS" | grep -q '^LINTROW|'; then
            echo "::error::Pre-commit linked database lint found error/warning/extra findings in a repaired, restored, record-only, or delegated function."
            printf '%s\n' "$LINT_FINDINGS" | grep '^LINTROW|'
            exit 1
          fi

          EXTENSION_RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select
              count(*) filter (where extension_row.oid is not null),
              count(*) filter (where routine.oid is not null)
            from (values (1)) seed(value)
            left join pg_extension extension_row on extension_row.extname = 'plpgsql_check'
            left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_RESIDUE" != "0|0" ]; then
            echo "::error::Pre-commit transactional lint left extension or function residue."
            exit 1
          fi

          echo "Applying exact 00300 -> 00850 -> 00900 -> 01000 -> 01100 -> 01200 protected chain in one production transaction."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -X --single-transaction -q \
            -f "$CONTRACT_FILE" \
            -f "$HOSTED_FUNCTION_ACL_FILE" \
            -f "$REPAIR_FILE" \
            -f "$RECORD_ONLY_FILE" \
            -f "$FUNCTION_ACL_FILE" \
            -f "$CLEAR_FUNCTION_ACL_FILE" \
            -c "insert into supabase_migrations.schema_migrations (version) values
                  ('20260822000300'), ('20260822000850'), ('20260822000900'), ('20260822001000'), ('20260822001100'), ('20260822001200');"

          RECORDED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc \
            "select concat_ws('|',
               count(*) filter (where version = '20260822000300'),
               count(*) filter (where version = '20260822000850'),
               count(*) filter (where version = '20260822000900'),
               count(*) filter (where version = '20260822001000'),
               count(*) filter (where version = '20260822001100'),
               count(*) filter (where version = '20260822001200'))
             from supabase_migrations.schema_migrations
             where version in ('20260822000300','20260822000850','20260822000900','20260822001000','20260822001100','20260822001200');")
          if [ "$RECORDED" != "1|1|1|1|1|1" ]; then
            echo "::error::The exact protected 00300/00850/00900/01000/01100/01200 chain did not land once each in the ledger."
            exit 1
          fi
          if [ "$(job_seeker_ready post)" != "t" ]; then
            echo "::error::The 01100 postflight did not leave the exact owner/authenticated-only resume extraction function ACL."
            exit 1
          fi
          if [ "$(clear_controls_ready post)" != "t" ]; then
            echo "::error::The 01200 postflight did not leave the exact owner/authenticated-only clear-function ACLs."
            exit 1
          fi
          FUNCTION_CONTRACT_AFTER=$(function_contract)
          if [ "$FUNCTION_CONTRACT_AFTER" != "$FUNCTION_CONTRACT_BEFORE" ]; then
            echo "::error::The protected chain changed an OID, signature, owner, language, SECURITY DEFINER, search_path, ACL outside the exact 00850 targets, return/argument contract, or another guarded field."
            exit 1
          fi

          RECORD_ONLY_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            set search_path = pg_catalog;
            with expected(signature, source_md5, contract_md5, volatility, execute_role) as (values
              ('public.list_factory_command_routing_candidates(uuid,uuid,text)',
               '203f54d969fbc699304e780c1ad68a85', '17919dac57b41b75fe0793ad660063cc', 's', 'authenticated'),
              ('public.list_factory_commands(uuid,integer,uuid)',
               'ba62f4f5357cec647d3ff582107710a7', '162d47956f98e7b005c7abe1df680ee9', 's', 'authenticated'),
              ('public.normalize_phase1c_command()',
               'cd28d70a40e860660461700926e97830', '32b955c1d25380d6e075024ee98f8530', 'v', 'none'),
              ('public.plan_phase1c_task_and_run()',
               '2de7070bb9359ce7ad45516da2956a4b', '32b955c1d25380d6e075024ee98f8530', 'v', 'none'),
              ('public.queue_phase1c_run_for_task()',
               '4737eba3e8490632fdd89c6d06fece82', '32b955c1d25380d6e075024ee98f8530', 'v', 'none'),
              ('public.submit_command_phase1c_normalized_internal(uuid,text,public.risk_level,jsonb,text)',
               'adb50eb74e1721274f23d0d69b79e2e8', 'b725d8bc77d8d0b2f34a69c900c16d1f', 'v', 'none'),
              ('public.submit_command(uuid,text,public.risk_level,jsonb,text)',
               '024c3aa1f74d976fb7a8a6d7138cd9fb', 'b725d8bc77d8d0b2f34a69c900c16d1f', 'v', 'authenticated'),
              ('public.submit_factory_command_routing_internal(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)',
               '8418fd26e9b1783315a93ffbf4543838', 'b779f9c2f2c4d0cf086f6d67b85a457c', 'v', 'none'),
              ('public.submit_factory_command(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)',
               '6008476137a77db33d220be4b14a9c8d', 'b779f9c2f2c4d0cf086f6d67b85a457c', 'v', 'authenticated'),
              ('public.record_provider_run_phase1c_compatibility_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)',
               'c450eac6987cdd603d2d2511a9fa8833', 'cf7f54b49fe3d5eb87b32fe782e7641c', 'v', 'none'),
              ('public.record_provider_run(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)',
               '9dfdfc57f4f8b0965a89fefd927beb26', 'cf7f54b49fe3d5eb87b32fe782e7641c', 'v', 'authenticated'),
              ('public.record_provider_run_phase2a_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)',
               '46cee8bec5e12fd4f087ecbeea0c9844', 'cf7f54b49fe3d5eb87b32fe782e7641c', 'v', 'none')
            ), state as (
              select expected.*, routine.oid, routine.proowner, routine.proacl,
                     routine.provolatile, routine.prosecdef, routine.proconfig,
                     routine_schema.nspname, routine_language.lanname,
                     md5(replace(replace(routine.prosrc, E'\\r\\n', E'\\n'), E'\\r', E'\\n')) as actual_source_md5,
                     md5(jsonb_build_array(
                       routine_schema.nspname, routine_language.lanname,
                       pg_get_userbyid(routine.proowner), routine.prokind::text,
                       format_type(routine.prorettype, null), routine.proretset,
                       routine.pronargs, routine.pronargdefaults,
                       coalesce(array_to_string(routine.proargnames, ','), ''),
                       coalesce(array_to_string(routine.proargmodes, ','), ''),
                       coalesce((select string_agg(format_type(arg.type_oid, null), ',' order by arg.ordinality)
                                 from unnest(routine.proallargtypes) with ordinality arg(type_oid, ordinality)), ''),
                       coalesce(pg_get_expr(routine.proargdefaults, 0), ''),
                       routine.proisstrict, routine.proleakproof, routine.prosecdef,
                       routine.proparallel::text, routine.provariadic = 0,
                       routine.procost::text, routine.prorows::text,
                       routine.prosupport = 0, routine.probin is null,
                       routine.prosqlbody is null, routine.protrftypes is null,
                       routine.proconfig, routine.proacl is null
                     )::text) as actual_contract_md5
              from expected
              left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
              left join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
              left join pg_language routine_language on routine_language.oid = routine.prolang
            )
            select count(oid) = 12 and count(distinct oid) = 12
               and bool_and(
                 nspname = 'public' and lanname = 'plpgsql'
                 and proowner = (select relowner from pg_class where oid = 'public.projects'::regclass)
                 and actual_source_md5 = source_md5
                 and actual_contract_md5 = contract_md5
                 and provolatile::text = volatility and prosecdef
                 and proconfig = array['search_path=pg_catalog']::text[]
                 and proacl is not null
                 and (select count(*) from aclexplode(proacl)) =
                       case when execute_role = 'authenticated' then 2 else 1 end
                 and exists (select 1 from aclexplode(proacl) acl where acl.grantor = proowner and acl.grantee = proowner and acl.privilege_type = 'EXECUTE' and not acl.is_grantable)
                 and (execute_role = 'none' or exists (select 1 from aclexplode(proacl) acl where acl.grantor = proowner and acl.grantee = to_regrole('authenticated')::oid and acl.privilege_type = 'EXECUTE' and not acl.is_grantable))
                 and not exists (select 1 from aclexplode(proacl) acl where acl.grantor <> proowner or acl.privilege_type <> 'EXECUTE' or acl.is_grantable or acl.grantee not in (proowner, case when execute_role = 'authenticated' then to_regrole('authenticated')::oid else proowner end))
                 and not has_function_privilege('anon', signature, 'EXECUTE')
                 and not has_function_privilege('service_role', signature, 'EXECUTE')
