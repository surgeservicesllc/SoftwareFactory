          FNS_ROW=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000800';")
          if [ "$TYPES_ROW" != "0" ] || [ "$FNS_ROW" != "0" ]; then
            echo "::error::Ledger already records one of these versions (types=$TYPES_ROW functions=$FNS_ROW; want 0/0)."
            exit 1
          fi

          READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'tasks')
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'commands')
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'agent_runs')
              and exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                       where n.nspname = 'public' and p.proname = 'can_manage_organization')
            );")
          if [ "$READY" != "t" ]; then
            echo "::error::A table or function these clears depend on is missing."
            exit 1
          fi

