          PROTECTED_CLEAR_FUNCTIONS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000800';")
          PROTECTED_REPAIR=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
