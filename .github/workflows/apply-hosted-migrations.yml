name: Apply hosted migrations

# The runbook (AI/HOSTED_APPLY_RUNBOOK.md), executable: repairs the one
# renamed ledger row, then pushes every outstanding migration to the hosted
# Supabase project — exactly the steps the owner would type, with the ledger
# listed before and after so the run's log is its own evidence.
#
# Owner-triggered only, and it refuses to run without the typed confirmation,
# because this writes DDL to production. Secrets (Settings → Secrets and
# variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — a personal access token (looks like sbp_0102…)
#   SUPABASE_DB_PASSWORD   — the project database password
# A valid token selects the linked project flow; a missing or malformed token
# falls back to a direct database connection through the IPv4 pooler. Surgical
# scopes that verify live catalog identity with psql also require the database
# password even in token mode (the direct project hostname is IPv6-only, which
# GitHub-hosted runners cannot reach).
# Never paste either secret into a chat, an issue, or a commit.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "apply" to run against the production project'
        required: true
      scope:
        description: >-
          "all" pushes outstanding ordinary migrations only after protected
          20260822000150, 20260822000200, and 20260822000300 are each recorded by their dedicated
          scopes; "broker-functions"
          applies only the idempotent broker migrations
          (20260816000400 through 20260820000300, plus 20260821000300) and
          records them in history;
          "project-controls" applies the 20260815 range plus the two run-review
          files, which is what the project detail page and the Runs page need;
          "executable-model-repair" applies only 20260822000600, which moves
          bots already provisioned with a model the Codex worker cannot claim
          onto the one it can, so Issue a Command stops refusing every
          submission;
          "pipeline-selection" applies only 20260821000300, which is what makes
          the AI Factory's Use button record a project's pipelines;
          "bot-legacy-acl-normalization" applies only 20260822000150, which
          removes the exact Supabase-default service_role overgrant from the
          seven frozen legacy bot routines;
          "bot-account-binding" applies only 20260822000200, which binds a
          subscription bot to its exact tenant-scoped AI account;
          "bot-account-binding-contract" applies only 20260822000300, which
          revokes the six legacy bot-mutator execute grants after exact-app
          deployment and signed-in production acceptance;
          "lifecycle" applies only the two Agentic SDLC files
          (20260821000100 and 20260821000200) and records them in history;
          "probe" changes nothing at all and just reports which objects already
          exist, because the ledger has proven to understate the live schema.
        required: false
        default: probe
        type: choice
        options:
          - all
          - broker-functions
          - project-controls
          - pipeline-selection
          - executable-model-repair
          - agent-selection
          - bot-legacy-acl-normalization
          - bot-account-binding
          - bot-account-binding-contract
          - lifecycle
          - job-seeker-resume
          - job-seeker-grant-contract
          - clear-controls
          - probe
      contract_app_sha:
        description: >-
          CONTRACT only: exact 40-character application SHA on main, exposed by
          the latest successful Vercel-bot Production deployment and accepted by an owner
        required: false
      contract_acceptance:
        description: >-
          CONTRACT only: type "exact-app-vercel-accepted" after verifying the
          named SHA is healthy on Vercel project prj_pAsrhftaVWI4SyaqstgRVSWHJkdD
        required: false

permissions:
  contents: read
  deployments: read

concurrency:
  group: apply-hosted-migrations
  cancel-in-progress: false

jobs:
  apply:
    name: Repair ledger and push migrations
    if: ${{ inputs.confirm == 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qpuofpmagrmyamahqwxw
    steps:
      - name: Check out the migrations
        # actions/checkout v4 (reviewed immutable commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact application acceptance before CONTRACT preflight
        if: ${{ inputs.scope == 'bot-account-binding-contract' }}
        env:
          CONTRACT_APP_SHA: ${{ inputs.contract_app_sha }}
          CONTRACT_ACCEPTANCE: ${{ inputs.contract_acceptance }}
          GH_API_URL: ${{ github.api_url }}
          GH_REF: ${{ github.ref }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [ "$GH_REF" != "refs/heads/main" ]; then
            echo "::error::CONTRACT may be dispatched only from refs/heads/main."
            exit 1
          fi
          if [[ ! "$CONTRACT_APP_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$CONTRACT_APP_SHA" != "$CHECKED_OUT_SHA" ]; then
            echo "::error::CONTRACT requires the exact checked-out 40-character application SHA already accepted in Vercel production."
            exit 1
          fi
          if [ "$CONTRACT_ACCEPTANCE" != "exact-app-vercel-accepted" ]; then
            echo "::error::CONTRACT requires the exact-app-vercel-accepted attestation after signed-in production acceptance."
            exit 1
          fi
          DEPLOYMENTS=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GH_API_URL}/repos/${GH_REPOSITORY}/deployments?environment=Production&per_page=100")
          LATEST_VERCEL_DEPLOYMENT=$(jq -c '[
            .[] | select(
              .environment == "Production"
              and .task == "deploy"
              and .creator.login == "vercel[bot]"
            )
          ][0] // empty' <<<"$DEPLOYMENTS")
          if [ -z "$LATEST_VERCEL_DEPLOYMENT" ] || ! jq -e --arg sha "$CONTRACT_APP_SHA" '
            .sha == $sha and .ref == $sha
          ' <<<"$LATEST_VERCEL_DEPLOYMENT" >/dev/null; then
            echo "::error::The latest Vercel-bot Production deployment is not the exact checked-out main SHA/ref."
            exit 1
          fi

          STATUS_URL=$(jq -r '.statuses_url' <<<"$LATEST_VERCEL_DEPLOYMENT")
          LATEST_STATUS=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}?per_page=1")
          if ! jq -e '
            length == 1
            and .[0].state == "success"
            and .[0].creator.login == "vercel[bot]"
            and (.[0].environment_url | type == "string")
            and (.[0].environment_url | test("^https://[^/]+\\.vercel\\.app(/|$)"))
          ' <<<"$LATEST_STATUS" >/dev/null; then
            echo "::error::The exact-SHA Vercel Production deployment has no latest successful Vercel-bot status."
            exit 1
          fi
          VERCEL_DEPLOYMENT_URL=$(jq -r '.[0].environment_url' <<<"$LATEST_STATUS")
          echo "::notice::Exact main SHA ${CONTRACT_APP_SHA} has a successful Vercel Production deployment at ${VERCEL_DEPLOYMENT_URL}; the operator also attests signed-in owner acceptance."

      - name: Choose the connection
        # Decides MODE=token (valid sbp_ token, linked flow) or MODE=dburl
        # (password-only, through the IPv4 session pooler). The URL-encoded
        # password and the full URL are masked explicitly: only the raw
        # secret value is masked automatically, and this repository is
        # public.
        run: |
          if [[ "$SUPABASE_ACCESS_TOKEN" =~ ^sbp_[A-Za-z0-9]{16,}$ ]]; then
            echo "MODE=token" >> "$GITHUB_ENV"
            echo "Using the personal access token (linked project flow)."
          elif [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_ACCESS_TOKEN is missing or not shaped like a personal access token (they look like sbp_0102...1920; generate one at supabase.com -> Account -> Access Tokens)."
            echo "Falling back to the direct database connection using SUPABASE_DB_PASSWORD only."
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            FOUND=""
            for HOST in aws-0-us-west-2.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com; do
              URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${HOST}:5432/postgres"
              echo "::add-mask::$URL"
              if npx --yes supabase@2 migration list --db-url "$URL" >/dev/null 2>&1; then
                echo "Reached the database through ${HOST}."
                echo "MODE=dburl" >> "$GITHUB_ENV"
                echo "DB_URL=$URL" >> "$GITHUB_ENV"
                FOUND="yes"
                break
              fi
            done
            if [ -z "$FOUND" ]; then
              echo "::error::Could not reach the database through the pooler (tried aws-0/aws-1 us-west-2). Either SUPABASE_DB_PASSWORD is wrong, or the project lives elsewhere — set a valid SUPABASE_ACCESS_TOKEN (sbp_...) to use the linked flow instead."
              exit 1
            fi
          else
            echo "::error::Neither a valid SUPABASE_ACCESS_TOKEN (sbp_...) nor SUPABASE_DB_PASSWORD is set. Add at least the database password as an Actions secret."
            exit 1
          fi

      - name: Link the production project (token mode only)
        if: ${{ env.MODE == 'token' }}
        run: npx --yes supabase@2 link --project-ref "$PROJECT_REF"

      - name: List the remote ledger before touching anything
        run: |
          if [ "$MODE" = "token" ]; then
            npx supabase migration list --linked
          else
            npx supabase migration list --db-url "$DB_URL"
          fi

      - name: Repair stale ledger rows (idempotent)
        # Never on a probe. `scope: probe` is documented as changing nothing at
        # all, and it is the step an operator reaches for precisely when they
        # do not yet trust the ledger -- but this step sits above the scope
        # branch, so a probe could still rewrite history rows. A read-only
        # question must not be able to edit the thing being questioned.
        if: ${{ inputs.scope != 'probe' && inputs.scope != 'bot-legacy-acl-normalization' && inputs.scope != 'bot-account-binding' && inputs.scope != 'bot-account-binding-contract' }}
        # Two known history-only repairs, each applied only when the live
        # listing shows the stale row. 20260814002000 was renamed to
        # 20260814000100; remote-only 20260814000200 is the pre-split name
        # of 20260814000210/000220/000250, all three of which the remote
        # ledger already records — reverting the stale row is bookkeeping,
        # not DDL. If neither row is present, this is a no-op.
        run: |
          if [ "$MODE" = "token" ]; then
            LIST=$(npx supabase migration list --linked)
          else
            LIST=$(npx supabase migration list --db-url "$DB_URL")
          fi
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status "$1" "$2"
            else
              npx supabase migration repair --status "$1" "$2" --db-url "$DB_URL"
            fi
          }
          if echo "$LIST" | grep -q "20260814002000"; then
            echo "Repairing: 20260814002000 -> 20260814000100 (history only, no DDL)"
            repair reverted 20260814002000
            repair applied 20260814000100
          else
            echo "No 20260814002000 row found; that repair is not needed."
          fi
          if echo "$LIST" | grep -q '` `.*20260814000200'; then
            echo "Reverting stale remote-only row 20260814000200 (its DDL lives on as 000210/000220/000250, all recorded)"
            repair reverted 20260814000200
          else
            echo "No remote-only 20260814000200 row found; that repair is not needed."
          fi

      - name: Apply the broker function migrations surgically (scope=broker-functions)
        # Every file here is idempotent by construction — `create or replace
        # function`, `create table if not exists`, `create index if not
        # exists`, `alter type ... add value if not exists`, and grants — so
        # applying them directly cannot disturb existing schema. psql runs
        # each statement autocommitted, which is what lets an enum label be
        # added and then referenced from a function body defined below it. psql is preinstalled on the runner, and
        # Supabase's DDL event trigger reloads the PostgREST schema cache
        # so the functions become callable immediately. History rows are
        # recorded so the ledger stays truthful.
        if: ${{ inputs.scope == 'broker-functions' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          for FILE in \
            supabase/migrations/20260816000400_inspect_ai_auth_sessions.sql \
            supabase/migrations/20260816000500_remove_ai_account.sql \
            supabase/migrations/20260816000600_ai_account_identity.sql \
            supabase/migrations/20260816000700_rename_bot.sql \
            supabase/migrations/20260816000800_cancel_discards_pending_account.sql \
            supabase/migrations/20260816000900_read_session_status.sql \
            supabase/migrations/20260816001000_reapply_vault_read.sql \
            supabase/migrations/20260816001100_vault_envelope_size.sql \
            supabase/migrations/20260816001200_device_flow_verifying.sql \
            supabase/migrations/20260816001300_replan_never_started_run.sql \
            supabase/migrations/20260816001400_project_repository_picker.sql \
            supabase/migrations/20260816001500_ai_account_usage_observations.sql \
            supabase/migrations/20260817000100_project_edit_details.sql \
            supabase/migrations/20260817000200_run_review_activity_types.sql \
            supabase/migrations/20260817000300_run_review_and_deletion.sql \
            supabase/migrations/20260817000400_task_work_lock_leases.sql \
            supabase/migrations/20260817000500_clear_all_finished_runs.sql \
            supabase/migrations/20260817000600_owner_operated_safety_controls.sql \
            supabase/migrations/20260817000700_bot_assignment_configuration.sql \
            supabase/migrations/20260817000800_custom_pipeline_templates.sql \
            supabase/migrations/20260817000900_run_and_report_lifecycle_types.sql \
            supabase/migrations/20260817001000_archive_runs_and_clear_reports.sql \
            supabase/migrations/20260817001100_assignment_model_and_effort.sql \
            supabase/migrations/20260818000100_removable_accounts_keep_usage_evidence.sql \
            supabase/migrations/20260818000200_seed_standard_model_catalogue.sql \
            supabase/migrations/20260819000100_graph_worker_execution.sql \
            supabase/migrations/20260819000200_replant_exhausted_graph.sql \
            supabase/migrations/20260819000300_tolerant_fan_in.sql \
            supabase/migrations/20260819000400_list_graph_runs.sql \
            supabase/migrations/20260819000500_replant_with_room_to_work.sql \
            supabase/migrations/20260819000600_tolerant_fan_ins_for_planted_copy.sql \
            supabase/migrations/20260819000700_bot_credential_ref_privileged_parity.sql \
            supabase/migrations/20260819000800_list_graph_run_verifications.sql \
            supabase/migrations/20260819000900_record_verification_as_worker.sql \
            supabase/migrations/20260819001000_claim_by_executor_capability.sql \
            supabase/migrations/20260819001100_usage_survives_a_rate_limited_probe.sql \
            supabase/migrations/20260819001200_replant_for_the_complete_run.sql \
            supabase/migrations/20260820000100_job_seeker_activity_types.sql \
            supabase/migrations/20260820000200_job_seeker_foundation.sql \
            supabase/migrations/20260820000300_job_seeker_resume_upload.sql \
            supabase/migrations/20260821000300_project_pipeline_selection.sql
          do
            echo "Applying ${FILE}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          done
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          repair 20260816000400
          repair 20260816000500
          repair 20260816000600
          repair 20260816000700
          repair 20260816000800
          repair 20260816000900
          repair 20260816001000
          repair 20260816001100
          repair 20260816001200
          repair 20260816001300
          repair 20260816001400
          repair 20260816001500
          repair 20260817000100
          repair 20260817000200
          repair 20260817000300
          repair 20260817000400
          repair 20260817000500
          repair 20260817000600
          repair 20260817000700
          repair 20260817000800
          repair 20260817000900
          repair 20260817001000
          repair 20260817001100
          repair 20260818000100
          repair 20260818000200
          repair 20260819000100
          repair 20260819000200
          repair 20260819000300
          repair 20260819000400
          repair 20260819000500
          repair 20260819000600
          repair 20260819000700
          repair 20260819000800
          repair 20260819000900
          repair 20260819001000
          repair 20260819001100
          repair 20260819001200
          repair 20260820000100
          repair 20260820000200
          repair 20260820000300
          repair 20260821000300
          # Supabase's DDL event trigger reloads the PostgREST schema cache
          # on its own; this explicit reload is insurance, so a browser that
          # saw PGRST202 seconds ago cannot keep seeing it.
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo "Broker function migrations applied, recorded, and the API schema cache reloaded."

      - name: Report what the database already has (scope=probe)
        # Read-only, and the only honest basis for an apply decision.
        #
        # Run 32068091179 proved the ledger understates production: it listed
        # the whole 20260815 range as unapplied, and applying it found the enum
        # labels and organizations.maximum_concurrent_runs already present —
        # live DDL with no history row. Run 32103778884 then proved the ledger
        # is not even a contiguous prefix: it is missing 19 versions in the
        # middle while carrying every row of the 20260817 range above them.
        #
        # The first query is the one that decides what to do. It names the
        # marker object each ledger-absent migration introduces and prints a
        # `present` boolean per version, so an absent object is visible as `f`
        # rather than as a row that simply never appears — the flaw in the
        # older query, which listed only what existed and so could not tell
        # "missing" apart from "not asked about".
        #
        # present = t  ->  the DDL is live; repair the history row, do not re-run the file.
        # present = f  ->  the file has genuinely not run; applying it is real DDL.
        #
        # Two of the nineteen only replace an existing function, so existence
        # proves nothing about them. Those are probed by a substring of the
        # function body that the migration introduced.
        if: ${{ inputs.scope == 'probe' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            with expected(version, kind, object, marker) as (values
              ('20260814002500', 'table',    'provider_credentials',                 null),
              ('20260814002600', 'function', 'store_provider_credential',            null),
              ('20260815000200', 'table',    'scheduling_decisions',                 null),
              ('20260815000300', 'function', 'portfolio_capacity_verdict',           null),
              ('20260815000400', 'body',     'plan_phase1c_task_and_run',            'agent.project_id = new.project_id'),
              ('20260815000500', 'function', 'breaker_cooldown_seconds',             null),
              ('20260815000600', 'function', 'portfolio_scheduling_queue',           null),
              ('20260815000800', 'body',     'generate_operations_report',           'phase1e-operations-v2'),
              ('20260815000900', 'function', 'refuse_project_deletion',              null),
              ('20260815001000', 'function', 'declare_cross_project_dependency',     null),
              ('20260815001100', 'table',    'connection_routing_decisions',         null),
              ('20260815001200', 'table',    'improvement_ledger',                   null),
              ('20260815001300', 'function', 'capture_improvement_baseline',         null),
              ('20260815001400', 'function', 'audit_factory_health',                 null),
              ('20260815001500', 'function', 'detect_factory_improvements',          null),
              ('20260815001600', 'function', 'propose_improvements_from_detections', null),
              ('20260816000100', 'table',    'ai_accounts',                          null),
              ('20260816000200', 'function', 'list_ai_accounts_for_verification',    null),
              ('20260816000300', 'function', 'find_open_ai_auth_session',            null)
            )
            select expected.version,
                   expected.kind,
                   expected.object,
                   case expected.kind
                     when 'table' then exists (
                       select 1 from pg_class relation
                         join pg_namespace space on space.oid = relation.relnamespace
                        where space.nspname = 'public'
                          and relation.relkind = 'r'
                          and relation.relname = expected.object)
                     when 'function' then exists (
                       select 1 from pg_proc routine
                         join pg_namespace space on space.oid = routine.pronamespace
                        where space.nspname = 'public'
                          and routine.proname = expected.object)
                     else exists (
                       select 1 from pg_proc routine
                         join pg_namespace space on space.oid = routine.pronamespace
                        where space.nspname = 'public'
                          and routine.proname = expected.object
                          and strpos(pg_get_functiondef(routine.oid), expected.marker) > 0)
                   end as present
              from expected
             order by expected.version;"
          echo "present = t: the DDL is live, so repair the history row rather than re-running the file."
          echo "present = f: that migration has genuinely not run."
          echo ""
          echo "Frozen pre-EXPAND register_bot identity (read-only catalog evidence)."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            set search_path = pg_catalog;
            select routine.oid::regprocedure::text as signature,
                   md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')) as source_md5,
                   pg_get_userbyid(routine.proowner) as owner,
                   routine_language.lanname as language,
                   routine.prokind,
                   routine.provolatile,
                   routine.prosecdef as security_definer,
                   routine.proconfig,
                   routine.proacl
              from (values (
                'public.register_bot(uuid,text,public.bot_provider,text,text,text,text)'
              )) expected(signature)
              left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
              left join pg_language routine_language on routine_language.oid = routine.prolang;"
          echo "Expected source_md5 before EXPAND: 797dcd842e22e5f0ae6b8299f744b0b4."
          echo ""
          echo "The ADR-036 credential denylist, checked directly rather than through the ledger."
          echo "Version 20260819000700 was recorded once while a DIFFERENT file's DDL ran under"
          echo "that number (see AI/HOSTED_APPLY_RUNBOOK.md), so its history row proves nothing."
          echo "This asks the constraint itself, and names every privileged reference it covers."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select conname,
                   (strpos(pg_get_constraintdef(oid), 'SUPABASE_SECRET_KEY') > 0
                    and strpos(pg_get_constraintdef(oid), 'SUPABASE_ACCESS_TOKEN') > 0
                    and strpos(pg_get_constraintdef(oid), 'VERCEL_OIDC_TOKEN') > 0
                    and strpos(pg_get_constraintdef(oid), 'POSTGRES_URL') > 0
                    and strpos(pg_get_constraintdef(oid), 'GITHUB_CLIENT_ID') > 0) as covers_all_five_added
              from pg_constraint
             where conname = 'bots_credential_ref_not_privileged';"
          echo "no row = the constraint is absent; covers_all_five_added = f means the parity fix has not run."
          echo ""
          echo "The last five usage observations, newest first — the measured evidence behind"
          echo "the Bot Manager's usage line. The detail column is constraint-guaranteed"
          echo "secret-free (<=400 chars, text_has_likely_secret refused), so printing it in a"
          echo "log is safe, and it is the only way to read WHY a probe failed without a"
          echo "database console: the counts in the auth-broker log say only that it failed."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select observed_at, status, left(coalesce(detail, ''), 200) as detail
              from public.ai_account_usage_observations
             order by observed_at desc
             limit 5;" || echo "usage observations table absent: migration 20260816001500 has not run here."
          echo ""
          echo "Ownership and grants for the AI-account section, which is where a 42501 comes from."
          echo "A SECURITY DEFINER function runs as its owner: if the function and the tables it"
          echo "writes were applied by different roles, the function can lack privileges on them"
          echo "and the console reports 'permission denied for table ...' as a bare 42501."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select 'function' as kind,
                   routine.proname as name,
                   pg_get_userbyid(routine.proowner) as owner,
                   routine.prosecdef as security_definer,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as authenticated_may_execute
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
             where space.nspname = 'public'
               and routine.proname in (
                 'remove_ai_account','disconnect_ai_account','rename_ai_account',
                 'create_ai_account','can_manage_organization','has_organization_role')
            union all
            select 'table',
                   relation.relname,
                   pg_get_userbyid(relation.relowner),
                   relation.relrowsecurity and relation.relforcerowsecurity,
                   null
              from pg_class relation
              join pg_namespace space on space.oid = relation.relnamespace
             where space.nspname = 'public'
               and relation.relkind = 'r'
               and relation.relname in (
                 'ai_accounts','ai_auth_sessions','provider_credentials',
                 'activity_events','bots')
            order by 1, 2;"
          echo "For a table row the boolean column is FORCE row level security, not execute."
          echo "Every function above should share one owner with every table above."
          echo ""
          echo "Does the owner bypass RLS, and can a definer function write an audit row at all?"
          echo "FORCE row level security subjects the table owner to its own policies, and only a"
          echo "superuser or a BYPASSRLS role escapes that. activity_events carries exactly one"
          echo "policy and it is SELECT, so an owner that does not bypass cannot insert an audit"
          echo "row - which is the last statement of remove_ai_account, and a 42501."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select rolname, rolsuper, rolbypassrls
              from pg_roles
             where rolname in ('postgres', 'authenticated', 'service_role')
             order by rolname;"
          cat > /tmp/audit-write-probe.sql <<'PROBE_SQL'
          do $probe$
          declare
            v_org uuid;
          begin
            select id into v_org from public.organizations limit 1;
            if v_org is null then
              raise notice 'no organization to write a probe row against';
              return;
            end if;
            begin
              insert into public.activity_events
                (organization_id, event_type, entity_type, description)
              values (v_org, 'ai_account.changed', 'ai_account', 'probe row, deleted immediately');
              delete from public.activity_events where description = 'probe row, deleted immediately';
              raise notice 'activity_events insert as %: OK, probe row deleted', current_user;
            exception when others then
              raise notice 'activity_events insert as %: % %', current_user, sqlstate, sqlerrm;
            end;
          end
          $probe$;
          PROBE_SQL
          psql "$DB_URL" -q -f /tmp/audit-write-probe.sql
          echo ""
          echo "And the call itself, as the owner would make it, inside a transaction that is"
          echo "rolled back whatever happens. This reports the SQLSTATE and message the console"
          echo "receives, which is the one fact none of the queries above can produce."
          cat > /tmp/remove-account-probe.sql <<'REMOVE_SQL'
          begin;
          do $probe$
          declare
            v_org uuid;
            v_owner uuid;
            v_account uuid;
            v_result boolean;
            v_uid uuid;
            v_can boolean;
            v_member record;
          begin
            /*
             * The first attempt picked the earliest owner membership and found
             * an organization with no accounts at all — the definitive call
             * never ran. Start from the accounts instead: the organization that
             * holds one, joined to an owner OF THAT organization, is the exact
             * shape the console's failing request has.
             */
            select a.organization_id, m.user_id, a.id
              into v_org, v_owner, v_account
              from public.ai_accounts a
              join public.organization_members m
                on m.organization_id = a.organization_id and m.role = 'owner'
             order by a.created_at
             limit 1;
            if v_account is null then
              raise notice 'no AI account with an owner membership anywhere — nothing to test';
              return;
            end if;
            raise notice 'testing org % account % as user %', v_org, v_account, v_owner;

            for v_member in
              select m.user_id, m.role from public.organization_members m
               where m.organization_id = v_org order by m.created_at
            loop
              raise notice '  member % role %', v_member.user_id, v_member.role;
            end loop;

            perform set_config('request.jwt.claim.sub', v_owner::text, true);
            perform set_config('request.jwt.claims',
              json_build_object('sub', v_owner::text, 'role', 'authenticated')::text, true);
            set local role authenticated;

            /* Whether the identity plumbing itself resolves under this role is
               half the diagnosis: a NULL here means the probe's JWT emulation
               (not production) is what any refusal below is measuring. */
            begin
              select auth.uid() into v_uid;
              raise notice 'auth.uid() under authenticated: %', coalesce(v_uid::text, 'NULL');
            exception when others then
              raise notice 'auth.uid() raised: % %', sqlstate, sqlerrm;
            end;
            begin
              select public.can_manage_organization(v_org) into v_can;
              raise notice 'can_manage_organization: %', v_can;
            exception when others then
              raise notice 'can_manage_organization raised: % %', sqlstate, sqlerrm;
            end;

            begin
              select public.remove_ai_account(v_org, v_account) into v_result;
              raise notice 'remove_ai_account as owner: returned % (rolled back)', v_result;
            exception when others then
              raise notice 'remove_ai_account as owner: % %', sqlstate, sqlerrm;
            end;
            reset role;
          end
          $probe$;
          rollback;
          REMOVE_SQL
          psql "$DB_URL" -q -f /tmp/remove-account-probe.sql
          echo ""
          echo "Bot creation, the same way: the console's Create Bot ends at register_bot"
          echo "through ensureProviderBot, which swallows every database error into a"
          echo "'skipped' the route answers 200 for. This calls register_bot as the owner"
          echo "and reports what actually happens, rolled back either way."
          cat > /tmp/register-bot-probe.sql <<'BOT_SQL'
          begin;
          do $probe$
          declare
            v_org uuid;
            v_owner uuid;
            v_row record;
            v_count integer;
          begin
            select a.organization_id, m.user_id
              into v_org, v_owner
              from public.ai_accounts a
              join public.organization_members m
                on m.organization_id = a.organization_id and m.role = 'owner'
             order by a.created_at
             limit 1;
            if v_org is null then
              raise notice 'no organization with accounts to test bot creation in';
              return;
            end if;

            select count(*) into v_count from public.bots b where b.organization_id = v_org;
            raise notice 'org % holds % bot rows', v_org, v_count;

            perform set_config('request.jwt.claim.sub', v_owner::text, true);
            perform set_config('request.jwt.claims',
              json_build_object('sub', v_owner::text, 'role', 'authenticated')::text, true);
            set local role authenticated;

            begin
              select * into v_row from public.register_bot(
                v_org, 'Probe Bot', 'anthropic'::public.bot_provider, 'claude-opus-5',
                'SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN', null,
                'Probe row, rolled back with this transaction.'
              );
              raise notice 'register_bot as owner: created % (rolled back)', v_row.id;
            exception when others then
              raise notice 'register_bot as owner: % %', sqlstate, sqlerrm;
            end;
            reset role;
          end
          $probe$;
          rollback;
          BOT_SQL
          psql "$DB_URL" -q -f /tmp/register-bot-probe.sql
          echo ""
          echo "The Agents page's chain: per organization, how many logical agents and"
          echo "enabled model configurations exist, and whether assigning one to an agent"
          echo "works as the owner — rolled back either way."
          cat > /tmp/agent-assignment-probe.sql <<'AGENT_SQL'
          begin;
          do $probe$
          declare
            v_org uuid;
            v_owner uuid;
            v_agent uuid;
            v_model text;
            v_row record;
            v_counts record;
          begin
            for v_counts in
              select o.id,
                     (select count(*) from public.agents a where a.organization_id = o.id) as agents,
                     (select count(*) from public.provider_model_configurations c
                       where c.organization_id = o.id and c.enabled) as enabled_models
                from public.organizations o
               order by o.created_at
            loop
              raise notice 'org % holds % agents, % enabled model configurations',
                v_counts.id, v_counts.agents, v_counts.enabled_models;
            end loop;

            select a.organization_id, a.id, m.user_id
              into v_org, v_agent, v_owner
              from public.agents a
              join public.organization_members m
                on m.organization_id = a.organization_id and m.role = 'owner'
             order by a.created_at
             limit 1;
            if v_agent is null then
              raise notice 'no agent with an owner membership anywhere - nothing to test';
              return;
            end if;
            select c.model into v_model
              from public.provider_model_configurations c
             where c.organization_id = v_org
               and c.provider = 'anthropic'::public.connection_provider
               and c.enabled
             order by c.model
             limit 1;
            if v_model is null then
              raise notice 'org % has no enabled anthropic model to assign', v_org;
              return;
            end if;

            perform set_config('request.jwt.claim.sub', v_owner::text, true);
            perform set_config('request.jwt.claims',
              json_build_object('sub', v_owner::text, 'role', 'authenticated')::text, true);
            set local role authenticated;
            begin
              select * into v_row from public.set_agent_provider_assignment(v_agent, 'anthropic', v_model);
              raise notice 'set_agent_provider_assignment as owner: agent % now % / % (rolled back)',
                v_row.id, v_row.provider, v_row.model;
            exception when others then
              raise notice 'set_agent_provider_assignment as owner: % %', sqlstate, sqlerrm;
            end;
            reset role;
          end
          $probe$;
          rollback;
          AGENT_SQL
          psql "$DB_URL" -q -f /tmp/agent-assignment-probe.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select 'column' as kind, table_name || '.' || column_name as object
              from information_schema.columns
             where table_schema = 'public'
               and (table_name, column_name) in (
                 ('projects','engineering_priority'), ('projects','strategic_focus'),
                 ('projects','engineering_paused'), ('projects','engineering_pause_reason'),
                 ('projects','maximum_concurrent_runs'),
                 ('organizations','maximum_concurrent_runs'),
                 ('agent_runs','review_status'), ('agent_runs','review_note'))
            union all
            select 'table', c.relname from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname = 'public' and c.relkind = 'r'
               and c.relname in ('scheduling_decisions','provider_capacity_limits')
            union all
            select 'function', p.proname from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
             where n.nspname = 'public'
               and p.proname in (
                 'archive_project','unarchive_project','update_project_details',
                 'set_project_engineering_priority','set_project_engineering_pause',
                 'focus_portfolio_engineering','set_portfolio_capacity_limits',
                 'update_agent_run_review','delete_agent_run')
            order by 1, 2;"
          echo ""
          echo "The Agentic SDLC lifecycle (20260821000100 and 20260821000200), asked about"
          echo "directly. These two files are newer than the measured ledger table in"
          echo "AI/HOSTED_APPLY_RUNBOOK.md, so they are deliberately kept out of the query"
          echo "above: that one reports a measurement, and appending an unmeasured version"
          echo "to it would turn evidence into assertion. present = f for every row is the"
          echo "expected reading before scope=lifecycle runs, and t for every row after."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            with lifecycle(kind, object, marker) as (values
              ('enum',     'sdlc_stage',                  'MONITORING'),
              ('enum',     'gate_kind',                   'HUMAN'),
              ('enum',     'gate_state',                  'APPROVED'),
              ('enum',     'activity_event_type',         'lifecycle.gate_approved'),
              ('table',    'graph_gates',                 null),
              ('column',   'graph_nodes.lifecycle_stage', null),
              ('column',   'graphs.max_iterations',       null),
              ('column',   'graph_edges.is_feedback',     null),
              ('column',   'node_runs.confidence',        null),
              ('function', 'open_node_gate_as_worker',    null),
              ('function', 'decide_node_gate',            null),
              ('function', 'advance_graph_iteration',     null),
              ('body',     'claim_planned_graph',         'graph_gates'),
              ('body',     'list_graph_runs',             'gate_anchor_count')
            )
            select lifecycle.kind,
                   lifecycle.object,
                   case lifecycle.kind
                     when 'enum' then exists (
                       select 1 from pg_type kind_type
                         join pg_namespace space on space.oid = kind_type.typnamespace
                         join pg_enum label on label.enumtypid = kind_type.oid
                        where space.nspname = 'public'
                          and kind_type.typname = lifecycle.object
                          and label.enumlabel = lifecycle.marker)
                     when 'table' then exists (
                       select 1 from pg_class relation
                         join pg_namespace space on space.oid = relation.relnamespace
                        where space.nspname = 'public'
                          and relation.relkind = 'r'
                          and relation.relname = lifecycle.object)
                     when 'column' then exists (
                       select 1 from information_schema.columns
                        where table_schema = 'public'
                          and table_name = split_part(lifecycle.object, '.', 1)
                          and column_name = split_part(lifecycle.object, '.', 2))
                     when 'function' then exists (
                       select 1 from pg_proc routine
                         join pg_namespace space on space.oid = routine.pronamespace
                        where space.nspname = 'public'
                          and routine.proname = lifecycle.object)
                     else exists (
                       select 1 from pg_proc routine
                         join pg_namespace space on space.oid = routine.pronamespace
                        where space.nspname = 'public'
                          and routine.proname = lifecycle.object
                          and strpos(pg_get_functiondef(routine.oid), lifecycle.marker) > 0)
                   end as present
              from lifecycle;"
          echo "The last two rows matter most: both files only REPLACE claim_planned_graph and"
          echo "list_graph_runs, so their existence proves nothing. Those rows ask whether the"
          echo "replacement body is the lifecycle-aware one."
          echo ""
          echo "And whether graph_gates is protected, if it exists at all. A new table without"
          echo "row level security is an exposed table, and the ledger cannot say either way."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select relation.relname,
                   relation.relrowsecurity as rls_enabled,
                   relation.relforcerowsecurity as rls_forced,
                   (select count(*) from pg_policy where polrelid = relation.oid) as policies,
                   has_table_privilege('anon', relation.oid, 'SELECT') as anon_may_select,
                   has_table_privilege('service_role', relation.oid, 'INSERT') as service_role_may_insert
              from pg_class relation
              join pg_namespace space on space.oid = relation.relnamespace
             where space.nspname = 'public'
               and relation.relname = 'graph_gates';"
          echo "No row at all means the table is absent and 20260821000200 has not run here —"
          echo "this asks pg_class, so a missing table is zero rows rather than an error."
          echo "Expected once applied: rls_enabled t, rls_forced t, one SELECT policy,"
          echo "anon_may_select f, and service_role_may_insert f — the worker writes only"
          echo "through open_node_gate_as_worker, never through a table grant."

          echo ""
          echo "The job-seeker resume extraction table's actual privileges, clause by"
          echo "clause. The apply step asserts these as one AND, which tells you it"
          echo "failed but not which part — this prints each separately."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select
              (select c.relrowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relname = 'job_seeker_resume_extractions') as rls_enabled,
              (select c.relforcerowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relname = 'job_seeker_resume_extractions') as rls_forced,
              (select count(*) from pg_policy p join pg_class c on c.oid = p.polrelid
                where c.relname = 'job_seeker_resume_extractions') as policies,
              has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'SELECT') as auth_select,
              has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'UPDATE') as auth_update,
              has_table_privilege('anon', 'public.job_seeker_resume_extractions', 'SELECT') as anon_select,
              has_table_privilege('service_role', 'public.job_seeker_resume_extractions', 'UPDATE') as service_update,
              (select p.prosecdef from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public' and p.proname = 'apply_resume_extraction') as definer,
              has_function_privilege('authenticated', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE') as auth_execute,
              has_function_privilege('anon', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE') as anon_execute;" \
            || echo "the table does not exist yet"
          echo "Expected: rls t, forced t, policies 3, auth_select t, auth_update f,"
          echo "anon_select f, service_update f, definer t, auth_execute t, anon_execute f."
          echo "A true auth_update or service_update means Supabase default privileges"
          echo "granted the table to those roles at CREATE TABLE time and the migration"
          echo "revoked only anon — a hole PGlite cannot reproduce, because it has no"
          echo "default privileges configured for these roles."
          echo ""
          echo "The two clear controls, read from a fresh run rather than from the apply"
          echo "that installed them. An apply grading its own work is the weaker evidence:"
          echo "the same step that ran the DDL also decides whether the DDL is correct, so"
          echo "a mistake in the assertion and a mistake in the migration cancel out. This"
          echo "is the independent read, asking the catalogue the same questions."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select routine.proname,
                   routine.prosecdef as security_definer,
                   pg_get_userbyid(routine.proowner) as owner,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as member_may_execute,
                   has_function_privilege('anon', routine.oid, 'EXECUTE') as anon_may_execute,
                   has_function_privilege('service_role', routine.oid, 'EXECUTE') as service_may_execute
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
             where space.nspname = 'public'
               and routine.proname in ('clear_backlog_tasks', 'clear_all_pipelines')
             order by routine.proname;" \
            || echo "neither clear function exists yet"
          echo "Expected: two rows, security_definer t, member_may_execute t, anon_may_execute f."
          echo "No row for a name means scope=clear-controls has not run against this database."
          echo ""
          echo "The audit labels those functions write. A clear that cannot record itself is"
          echo "a silent deletion, so the enum values are as load-bearing as the functions."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select label
              from pg_enum
              join pg_type on pg_type.oid = pg_enum.enumtypid
             where pg_type.typname = 'activity_event_type'
               and label in ('task.backlog_cleared', 'command.pipelines_cleared')
             order by label;"
          echo "Expected: both labels present. A missing label means 20260822000700 has not run,"
          echo "and the function above would fail at its audit insert rather than at its delete."

      - name: Apply the project control migrations surgically (scope=project-controls)
        # The 20260815 range plus the two run-review files: everything the
        # project detail page's priority, focus, stop and cancel controls need,
        # and the Runs page's review and delete.
        #
        # Exactly the three files run 32068262957's probe showed missing, and
        # no others.
        #
        # The probe is why this list is short. The ledger says the whole
        # 20260815 range is outstanding; the database says otherwise — every
        # project scheduling column, and set_project_engineering_pause,
        # set_project_engineering_priority, focus_portfolio_engineering,
        # set_portfolio_capacity_limits and update_project_details, are already
        # live. Applying that range re-runs DDL for objects that exist, which
        # is exactly how run 32068091179 failed.
        #
        # Missing, and therefore here: archive_project and unarchive_project —
        # the project detail page's cancel and restore — the run review and
        # deletion pair, and run archiving with the report lifecycle. Every file
        # is idempotent: enum additions are `add value if not exists`, functions
        # are `create or replace`, and the two column-adding files use
        # `add column if not exists` with their constraints dropped before they
        # are added.
        #
        # 20260817001000 also drops and recreates list_agent_runs to add
        # p_include_archived. The parameter has a default, so the existing
        # two-argument call sites keep working through the swap.
        if: ${{ inputs.scope == 'project-controls' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          # Each file is applied and immediately recorded, so an interruption
          # leaves a ledger that is behind rather than one that lies.
          for FILE in \
            supabase/migrations/20260815000700_project_archive_operation.sql \
            supabase/migrations/20260817000200_run_review_activity_types.sql \
            supabase/migrations/20260817000300_run_review_and_deletion.sql \
            supabase/migrations/20260817000900_run_and_report_lifecycle_types.sql \
            supabase/migrations/20260817001000_archive_runs_and_clear_reports.sql
          do
            VERSION=$(basename "$FILE" | cut -d_ -f1)
            echo "Applying ${FILE}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
            repair "$VERSION"
          done

      - name: Apply the pipeline selection migration (scope=pipeline-selection)
        # One file, because one feature needs it. Running broker-functions to
        # reach it would re-run unrelated migrations, each idempotent but each
        # still a change to production nobody asked for in this run.
        #
        # 20260821000300 creates public.project_pipelines with RLS and FORCE
        # RLS, revokes every table privilege from anon, authenticated and
        # service_role, and adds select_project_pipeline,
        # deselect_project_pipeline and list_project_pipelines. It adds; it
        # alters nothing that exists. Every statement is idempotent —
        # `create table if not exists`, `create index if not exists`,
        # `alter type ... add value if not exists`, `create or replace
        # function` — and psql runs each autocommitted, which is what lets the
        # two new enum labels be added and then named from a function body
        # defined below them.
        if: ${{ inputs.scope == 'pipeline-selection' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          FILE=supabase/migrations/20260821000300_project_pipeline_selection.sql
          echo "Applying ${FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          if [ "$MODE" = "token" ]; then
            npx supabase migration repair --status applied 20260821000300
          else
            npx supabase migration repair --status applied 20260821000300 --db-url "$DB_URL"
          fi
          # Insurance: Supabase's DDL event trigger reloads the PostgREST
          # schema cache on its own, but a browser that saw PGRST202 seconds
          # ago must not keep seeing it.
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo "Pipeline selection applied and recorded; the API schema cache was reloaded."

      - name: Apply the agent selection surgically (scope=agent-selection)
        # Exactly one file — 20260822000100 — the project_agents mirror of the
        # pipeline-selection scope above, and replay-safe the same way: enum
        # labels are `add value if not exists`, the table is `create table if
        # not exists`, indexes are `if not exists`, and the three definer
        # functions are `create or replace`.
        if: ${{ inputs.scope == 'agent-selection' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
