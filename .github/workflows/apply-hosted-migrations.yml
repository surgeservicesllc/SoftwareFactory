      - name: Normalize exact legacy bot ACLs (scope=bot-legacy-acl-normalization)
        # Forward-only containment for Supabase's function default privileges.
        # This scope can remove only the direct service_role EXECUTE entry from
        # seven frozen routines; the migration itself repeats the full catalog
        # proof before and after inside one atomic DO statement.
        if: ${{ inputs.scope == 'bot-legacy-acl-normalization' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The protected bot-legacy-acl-normalization scope requires SUPABASE_DB_PASSWORD for live catalog verification."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          FILE=supabase/migrations/20260822000150_normalize_legacy_bot_function_acls.sql
          EXPECTED_SHA256=6b24b6ebb57e59b9c4398c3e439221c27c300663a7b6932ff192996ffe6bcd93
          ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Protected legacy bot ACL normalizer hash mismatch; refusing production DDL."
            exit 1
          fi

          HISTORY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select
              count(*) filter (where version = '20260822000100'),
              count(*) filter (where version = '20260822000150'),
              count(*) filter (where version = '20260822000200'),
              count(*) filter (where version = '20260822000300')
            from supabase_migrations.schema_migrations
            where version in (
              '20260822000100', '20260822000150',
              '20260822000200', '20260822000300'
            );")
          if [ "$HISTORY" != "1|0|0|0" ]; then
            echo "::error::Hosted migration history is not exact predecessor-once/normalizer-absent/EXPAND-absent/CONTRACT-absent state."
            exit 1
          fi

          LEGACY_OVERGRANT_EXACT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            set search_path = pg_catalog;
            with expected(signature, source_md5, contract_md5) as (values
              ('public.register_bot(uuid,text,public.bot_provider,text,text,text,text)', '797dcd842e22e5f0ae6b8299f744b0b4', '658e04bf56902695f8da49b0b62827d8'),
              ('public.assign_bot(uuid,uuid,uuid,uuid)', '80b547b7b722c57a9d2a262b67698be8', 'f6f66a20b1848121d45f08ffe716466e'),
              ('public.assign_bots_to_project(uuid,uuid,jsonb)', '23b260247a4be4f4a8d8aa2497e1b6a2', '509ff97d6dd6ccecfc6a0b559f6402ab'),
              ('public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)', 'daecfeb964d863373a2072cc62e1033e', 'f399bc01e734509765a9955d6ea12d3f'),
              ('public.set_bot_assignment_execution(uuid,uuid,text,text)', '55ec15132d903ace0300f2cbe32db6bd', '09868603f1251c9b3c0e714585c470a6'),
              ('public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)', '0aaec47295f86adbeec784d288f24400', '15df08b5f10d11f2eb75939bd24ff471'),
              ('public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)', '7f51999309b645832d471ccebea94a9c', '25a69b2727d3e8c038411fcdfa7f9ae3')
            ), function_state as (
              select expected.*,
                     routine.oid,
                     routine.proowner,
                     routine.prokind,
                     routine.provolatile,
                     routine.prosecdef,
                     routine.proconfig,
                     routine.proacl,
                     routine_schema.nspname,
                     routine_language.lanname,
                     md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')) as actual_source_md5,
                     md5(jsonb_build_array(
                       format_type(routine.prorettype, null),
                       routine.proretset,
                       routine.pronargs,
                       routine.pronargdefaults,
                       coalesce(array_to_string(routine.proargnames, ','), ''),
                       coalesce(array_to_string(routine.proargmodes, ','), ''),
                       coalesce((
                         select string_agg(format_type(argument_type.type_oid, null), ',' order by argument_type.ordinality)
                         from unnest(routine.proallargtypes)
                           with ordinality argument_type(type_oid, ordinality)
                       ), ''),
                       coalesce(pg_get_expr(routine.proargdefaults, 0), ''),
                       routine.proisstrict,
                       routine.proleakproof,
                       routine.proparallel::text,
                       case when routine.provariadic = 0 then '' else format_type(routine.provariadic, null) end,
                       routine.procost::text,
                       routine.prorows::text,
                       case when routine.prosupport = 0 then '' else routine.prosupport::regproc::text end,
                       coalesce(routine.probin, ''),
                       routine.prosqlbody is null,
                       coalesce((
                         select string_agg(format_type(transform_type.type_oid, null), ',' order by transform_type.ordinality)
                         from unnest(routine.protrftypes)
                           with ordinality transform_type(type_oid, ordinality)
                       ), '')
                     )::text) as actual_contract_md5
              from expected
              left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
              left join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
              left join pg_language routine_language on routine_language.oid = routine.prolang
            )
            select to_regrole('authenticated') is not null
               and to_regrole('anon') is not null
               and to_regrole('service_role') is not null
               and (
                 select count(oid) = 7
                    and bool_and(
                      nspname = 'public'
                      and lanname = 'plpgsql'
                      and prokind = 'f'
                      and provolatile = 'v'
                      and prosecdef
                      and proconfig = array['search_path=pg_catalog']::text[]
                      and pg_get_userbyid(proowner) = 'postgres'
                      and actual_source_md5 = source_md5
                      and actual_contract_md5 = contract_md5
                      and proacl is not null
                      and (select count(*) from aclexplode(proacl)) = 3
                      and exists (
                        select 1 from aclexplode(proacl) acl
                         where acl.grantor = proowner
