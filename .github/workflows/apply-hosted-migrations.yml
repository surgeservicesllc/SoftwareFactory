                     routine.prosecdef, routine.proconfig, routine.proacl,
                     routine_language.lanname
              from pg_proc routine
              join pg_language routine_language on routine_language.oid = routine.prolang
              where routine.oid in (
                to_regprocedure('public.agentos_hosts_are_bare_hostnames(text[])'),
                to_regprocedure('public.agentos_resolved_agent_grants(uuid)')
              )
            )
            select (select count(oid) = 3 and bool_and(actual_labels = labels) from type_state)
               and (select count(oid) = 9 and bool_and(
                 relkind = 'r' and relrowsecurity and relforcerowsecurity
                 and pg_get_userbyid(relowner) = 'postgres'
                 and policy_oid is not null and polcmd = 'r' and polpermissive
                 and polroles = array[to_regrole('authenticated')::oid]
                 and polqual is not null and polwithcheck is null
                 and has_table_privilege('authenticated', oid, 'SELECT')
                 and not has_table_privilege('authenticated', oid, 'INSERT')
                 and not has_table_privilege('authenticated', oid, 'UPDATE')
                 and not has_table_privilege('authenticated', oid, 'DELETE')
                 and not has_table_privilege('anon', oid, 'SELECT')
                 and not has_table_privilege('service_role', oid, 'SELECT')
                 and not exists (
                   select 1 from aclexplode(relacl) acl
                    where acl.grantor <> relowner
                       or acl.grantee not in (relowner, to_regrole('authenticated')::oid)
                       or acl.is_grantable
                       or (acl.grantee = to_regrole('authenticated')::oid and acl.privilege_type <> 'SELECT')
                 )
               ) from table_state)
               and (select count(*) = 9 from pg_policy policy
                    join pg_class relation on relation.oid = policy.polrelid
                    where relation.relnamespace = 'public'::regnamespace
                      and relation.relname in (
                        'agentos_environments', 'agentos_mcp_connections', 'agentos_skills',
                        'agentos_agent_grants', 'agentos_agent_mcp_grants',
                        'agentos_agent_skill_grants', 'agentos_agent_repo_grants',
                        'agentos_agent_filesystem_grants', 'agentos_agent_collaborators'
                      ))
               and (select count(oid) = 2 and bool_and(
                 pg_get_userbyid(proowner) = 'postgres' and prokind = 'f'
                 and proconfig = array['search_path=pg_catalog']::text[]
                 and (
                   (proname = 'agentos_hosts_are_bare_hostnames'
                    and lanname = 'sql' and provolatile = 'i' and not prosecdef)
                   or
                   (proname = 'agentos_resolved_agent_grants'
                    and lanname = 'plpgsql' and provolatile = 's' and prosecdef
                    and has_function_privilege('authenticated', oid, 'EXECUTE')
                    and not has_function_privilege('anon', oid, 'EXECUTE')
                    and not has_function_privilege('service_role', oid, 'EXECUTE'))
                 )
               ) from helper_state);")
          if [ "$FOUNDATION_READY" != "t" ]; then
            echo "::error::The restored three-enum/nine-table/two-helper AgentOS catalog, RLS, policy, or ACL posture is not exact."
            exit 1
          fi

          DATABASE_HEALTH=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc \
            "select current_database() = 'postgres' and not pg_is_in_recovery();")
          if [ "$DATABASE_HEALTH" != "t" ]; then
            echo "::error::Linked production database health check failed."
            exit 1
          fi
          curl --fail --silent --show-error --location --max-time 30 \
            --output /dev/null https://www.theagoras.com/
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo "Record-only chain postflights verified on the applied production database; PostgREST schema reload requested."

      - name: Apply the Agentic SDLC lifecycle surgically (scope=lifecycle)
        if: ${{ inputs.scope == 'lifecycle' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          CUTOVER_APPLIED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc \
            "select exists (select 1 from supabase_migrations.schema_migrations where version >= '20260827000150');")
          if [ "$CUTOVER_APPLIED" = "t" ]; then
            echo "::error::scope=lifecycle is retired after the versioned graph protocol cutover; replaying it would restore legacy worker authority."
            exit 1
          fi
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          for FILE in \
            supabase/migrations/20260821000100_agentic_sdlc_activity_types.sql \
            supabase/migrations/20260821000200_agentic_sdlc_lifecycle.sql
          do
            VERSION=$(basename "$FILE" | cut -d_ -f1)
            echo "Applying ${FILE}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
            repair "$VERSION"
          done
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo ""
          echo "What the run actually produced, read back rather than assumed."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select relation.relname,
                   relation.relrowsecurity as rls_enabled,
                   relation.relforcerowsecurity as rls_forced,
                   (select count(*) from pg_policy where polrelid = relation.oid) as policies,
                   has_table_privilege('anon', relation.oid, 'SELECT') as anon_may_select,
                   has_table_privilege('service_role', relation.oid, 'INSERT') as service_role_may_insert
              from pg_class relation
              join pg_namespace space on space.oid = relation.relnamespace
             where space.nspname = 'public'
               and relation.relname = 'graph_gates';"
          echo "rls_enabled and rls_forced must both be t, anon_may_select must be f, and"
          echo "service_role_may_insert must be f — the worker writes only through"
          echo "open_node_gate_as_worker, never through a table grant."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select routine.proname,
                   routine.prosecdef as security_definer,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as authenticated_may_execute,
                   has_function_privilege('service_role', routine.oid, 'EXECUTE') as service_role_may_execute
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
             where space.nspname = 'public'
               and routine.proname in (
                 'open_node_gate_as_worker', 'decide_node_gate', 'advance_graph_iteration')
             order by routine.proname;"
          echo "decide_node_gate is the member-facing one: authenticated must execute it."
          echo "open_node_gate_as_worker is the worker's: authenticated must NOT."
          echo "Exactly one claim_planned_graph overload should exist, and it must be the"
          echo "lifecycle-aware body — a second overload would mean the live claim is a"
          echo "resurrected older signature that reports no gates at all."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select pg_get_function_identity_arguments(routine.oid) as signature,
                   strpos(pg_get_functiondef(routine.oid), 'graph_gates') > 0 as knows_about_gates
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
              where space.nspname = 'public'
                and routine.proname = 'claim_planned_graph';"

