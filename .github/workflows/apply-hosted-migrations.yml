             )
             order by 1;")
          if [ "$(printf '%s\n' "$DEFINITIONS_BEFORE" | wc -l | tr -d ' ')" != "6" ]; then
            echo "::error::A legacy bot mutator identity is missing before CONTRACT."
            exit 1
          fi

          echo "Applying ${FILE} at frozen SHA-256 ${EXPECTED_SHA256} after exact-app acceptance"
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q \
            -f "$FILE" \
            -c "insert into supabase_migrations.schema_migrations (version) values ('20260822000300');"

          DEFINITIONS_AFTER=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -F '|' -c "
            set search_path = pg_catalog;
            select routine.oid::regprocedure::text,
                   md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')),
                   routine.prosecdef,
                   coalesce(array_to_string(routine.proconfig, ','), ''),
                   pg_get_userbyid(routine.proowner)
              from pg_proc routine
             where routine.oid in (
               'public.assign_bot(uuid,uuid,uuid,uuid)'::regprocedure,
               'public.assign_bots_to_project(uuid,uuid,jsonb)'::regprocedure,
