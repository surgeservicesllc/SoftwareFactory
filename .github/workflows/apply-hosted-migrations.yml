        # CONTRACT is deliberately separate from EXPAND. It is safe only after
        # the exact checked-RPC application SHA is the latest successful
        # Vercel-bot Production deployment. The pre-connection gate proves that
        # GitHub deployment identity; the operator separately verifies the exact
        # Vercel project and signed-in owner journey before attesting.
        if: ${{ inputs.scope == 'bot-account-binding-contract' }}
        env:
          CONTRACT_APP_SHA: ${{ inputs.contract_app_sha }}
          CONTRACT_ACCEPTANCE: ${{ inputs.contract_acceptance }}
        run: |
          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          if [[ ! "$CONTRACT_APP_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$CONTRACT_APP_SHA" != "$CHECKED_OUT_SHA" ]; then
            echo "::error::CONTRACT requires the exact checked-out 40-character application SHA already accepted in Vercel production."
            exit 1
          fi
          if [ "$CONTRACT_ACCEPTANCE" != "exact-app-vercel-accepted" ]; then
            echo "::error::CONTRACT requires the exact-app-vercel-accepted attestation after signed-in production acceptance."
            exit 1
          fi
          echo "::notice::Operator attests that exact application ${CONTRACT_APP_SHA} is the healthy Vercel production deployment and passed signed-in owner acceptance."

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::The protected bot-account-binding-contract scope requires SUPABASE_DB_PASSWORD for live catalog verification."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          FILE=supabase/migrations/20260822000300_contract_bot_mutator_acls.sql
          EXPECTED_SHA256=79914bc97660eef908b6a0fa0c90abfdd15da1683b383ad568e34bf3bd32c5f7
          ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Protected CONTRACT migration hash mismatch; refusing production DDL."
            exit 1
          fi

          NORMALIZER=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000150';")
          PREDECESSOR=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000200';")
          TARGET=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000300';")
          if [ "$NORMALIZER" != "1" ] || [ "$PREDECESSOR" != "1" ] || [ "$TARGET" != "0" ]; then
            echo "::error::Hosted migration history is not the exact normalizer-once/EXPAND-once/CONTRACT-absent state."
            exit 1
          fi

          CATALOG_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            set search_path = pg_catalog;
            with expected_functions(signature, source_md5, contract_md5, volatility, execute_role) as (values
              ('public.ai_account_bot_credential_ref(public.bot_provider,text)', 'afae78ba3750e372829dd50e1b48c5cb', '93243ca92614a4c2cd42045536de34cf', 'i', 'none'),
              ('public.assign_bot(uuid,uuid,uuid,uuid)', '80b547b7b722c57a9d2a262b67698be8', 'f6f66a20b1848121d45f08ffe716466e', 'v', 'authenticated'),
              ('public.assign_bots_to_project(uuid,uuid,jsonb)', '23b260247a4be4f4a8d8aa2497e1b6a2', '509ff97d6dd6ccecfc6a0b559f6402ab', 'v', 'authenticated'),
              ('public.assign_bots_to_project_checked(uuid,uuid,jsonb)', '5ff06f065e241ad2baf5d7d5f576743a', '509ff97d6dd6ccecfc6a0b559f6402ab', 'v', 'authenticated'),
              ('public.enforce_bot_ai_account_binding()', '885b6c63c7f0b761d3ae99bdb416d6f4', 'c76d49585995381de4cd050f453488a7', 'v', 'none'),
              ('public.ensure_ai_account_bot(uuid,uuid,public.bot_provider,text,text,boolean,text,text)', '3140ecd6b0d850732f96bdc5096b97e3', '3e616013f7f1aa22bc5b06c8babb29a6', 'v', 'authenticated'),
              ('public.increment_bot_assignment_revision()', '90320b19a6b41eb32b084a3b0db8ef21', 'c76d49585995381de4cd050f453488a7', 'v', 'none'),
              ('public.increment_bot_revision()', '154cf22e868e447c6f74aeb08508ad08', 'c76d49585995381de4cd050f453488a7', 'v', 'none'),
              ('public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)', 'daecfeb964d863373a2072cc62e1033e', 'f399bc01e734509765a9955d6ea12d3f', 'v', 'authenticated'),
              ('public.record_bot_readiness_preserving_disabled(uuid,uuid,uuid,bigint,uuid,public.bot_provider,text,text,text,public.bot_readiness,text)', '1132e6e0bed1697a7ccaa82006db35f5', '0fab1985ab6e7ca13e0c38d6302536f0', 'v', 'service_role'),
              ('public.set_bot_assignment_execution(uuid,uuid,text,text)', '55ec15132d903ace0300f2cbe32db6bd', '09868603f1251c9b3c0e714585c470a6', 'v', 'authenticated'),
              ('public.set_bot_assignment_execution_checked(uuid,uuid,uuid,bigint,text,text)', 'd0c11a5c1e57878c9b1b5d8753ecb1fd', '47ed878441dae8b7a4e4c5292e1260ae', 'v', 'authenticated'),
              ('public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)', '0aaec47295f86adbeec784d288f24400', '15df08b5f10d11f2eb75939bd24ff471', 'v', 'authenticated'),
              ('public.update_bot_assignment_checked(uuid,uuid,uuid,bigint,public.bot_assignment_status)', '5323b0adb327f3d3a19c9bdca220922e', 'caa9e8093054cac7ebb3571ee2a5ec98', 'v', 'authenticated'),
              ('public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)', '7f51999309b645832d471ccebea94a9c', '25a69b2727d3e8c038411fcdfa7f9ae3', 'v', 'authenticated'),
              ('public.update_bot_assignment_configuration_checked(uuid,uuid,uuid,bigint,jsonb,uuid,public.bot_assignment_status)', 'eabefae63edf3d957ed8a0ad5e10d1bd', 'a40abf44b52cd3bcaf55f6bad964626b', 'v', 'authenticated')
            ), function_state as (
              select expected.*,
                     routine.oid,
                     routine.proowner,
                     routine.prokind,
                     routine.provolatile,
                     routine.prosecdef,
                     routine.proconfig,
                     routine.proacl,
                     routine_schema.nspname,
                     routine_language.lanname,
                     md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')) as actual_source_md5,
                     md5(jsonb_build_array(
                       format_type(routine.prorettype, null), routine.proretset,
                       routine.pronargs, routine.pronargdefaults,
                       coalesce(array_to_string(routine.proargnames, ','), ''),
                       coalesce(array_to_string(routine.proargmodes, ','), ''),
                       coalesce((
                         select string_agg(format_type(argument_type.type_oid, null), ',' order by argument_type.ordinality)
                         from unnest(routine.proallargtypes)
                           with ordinality argument_type(type_oid, ordinality)
                       ), ''),
                       coalesce(pg_get_expr(routine.proargdefaults, 0), ''),
                       routine.proisstrict, routine.proleakproof, routine.proparallel::text,
                       case when routine.provariadic = 0 then '' else format_type(routine.provariadic, null) end,
                       routine.procost::text, routine.prorows::text,
                       case when routine.prosupport = 0 then '' else routine.prosupport::regproc::text end,
                       coalesce(routine.probin, ''), routine.prosqlbody is null,
                       coalesce((
                         select string_agg(format_type(transform_type.type_oid, null), ',' order by transform_type.ordinality)
                         from unnest(routine.protrftypes)
                           with ordinality transform_type(type_oid, ordinality)
                       ), '')
                     )::text) as actual_contract_md5
                from expected_functions expected
                left join pg_proc routine
                  on routine.oid = to_regprocedure(expected.signature)
                left join pg_namespace routine_schema
                  on routine_schema.oid = routine.pronamespace
                left join pg_language routine_language
                  on routine_language.oid = routine.prolang
            )
            select
              (select count(oid) = 16
                 and bool_and(
                   nspname = 'public'
                   and lanname = 'plpgsql'
                   and prokind = 'f'
                   and provolatile::text = volatility
                   and actual_source_md5 = source_md5
                   and actual_contract_md5 = contract_md5
                   and prosecdef
                   and proconfig = array['search_path=pg_catalog']::text[]
                   and pg_get_userbyid(proowner) = 'postgres'
                   and proacl is not null
                   and (select count(*) from aclexplode(proacl)) =
                     case when execute_role = 'none' then 1 else 2 end
                   and exists (
                     select 1 from aclexplode(proacl) acl
                      where acl.grantor = proowner
                        and acl.grantee = proowner
                        and acl.privilege_type = 'EXECUTE'
                        and not acl.is_grantable
                   )
                   and (
                     execute_role = 'none'
                     or exists (
                       select 1 from aclexplode(proacl) acl
                        where acl.grantor = proowner
                          and acl.grantee = to_regrole(execute_role)::oid
                          and acl.privilege_type = 'EXECUTE'
                          and not acl.is_grantable
                     )
                   )
                   and not exists (
                     select 1 from aclexplode(proacl) acl
                      where acl.grantee <> proowner
                        and (execute_role = 'none' or acl.grantee <> to_regrole(execute_role)::oid)
                   )
                   and not has_function_privilege('anon', signature, 'EXECUTE')
                   and has_function_privilege('authenticated', signature, 'EXECUTE') =
                     (execute_role = 'authenticated')
                   and has_function_privilege('service_role', signature, 'EXECUTE') =
                     (execute_role = 'service_role')
                   and not exists (
                     select 1 from aclexplode(proacl) acl
                      where acl.grantee = 0 and acl.privilege_type = 'EXECUTE'
                   )
                 )
               from function_state)
              and (
                select count(*) = 16
                  from pg_proc routine
                  join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
                 where routine_schema.nspname = 'public'
                   and routine.proname in (
                     'ai_account_bot_credential_ref', 'assign_bot',
                     'assign_bots_to_project', 'assign_bots_to_project_checked',
                     'enforce_bot_ai_account_binding', 'ensure_ai_account_bot',
                     'increment_bot_assignment_revision', 'increment_bot_revision',
                     'record_bot_readiness', 'record_bot_readiness_preserving_disabled',
                     'set_bot_assignment_execution', 'set_bot_assignment_execution_checked',
                     'update_bot_assignment', 'update_bot_assignment_checked',
                     'update_bot_assignment_configuration',
                     'update_bot_assignment_configuration_checked'
                   )
              )
              and (
                select count(column_row.attnum) = 2
                   and count(default_row.oid) = 2
                   and count(constraint_row.oid) = 2
                   and bool_and(
                     column_row.atttypid = 'int8'::regtype
                     and column_row.attnotnull
                     and column_row.attidentity = ''
                     and column_row.attgenerated = ''
                     and coalesce(
                       pg_get_expr(default_row.adbin, default_row.adrelid)
                         in ('1', '1::bigint', '''1''::bigint'),
                       false
                     )
                     and constraint_row.contype = 'c'
                     and constraint_row.convalidated
                     and not constraint_row.connoinherit
                     and pg_get_constraintdef(constraint_row.oid) = 'CHECK ((revision > 0))'
                   )
                  from (values
                    ('public.bot_assignments'::regclass, 'revision', 'bot_assignments_revision_positive'),
                    ('public.bots'::regclass, 'revision', 'bots_revision_positive')
                  ) expected(relation_id, column_name, constraint_name)
                  left join pg_attribute column_row
                    on column_row.attrelid = expected.relation_id
                   and column_row.attname = expected.column_name
                   and not column_row.attisdropped
                  left join pg_attrdef default_row
                    on default_row.adrelid = column_row.attrelid
                   and default_row.adnum = column_row.attnum
                  left join pg_constraint constraint_row
                    on constraint_row.conrelid = expected.relation_id
                   and constraint_row.conname = expected.constraint_name
              )
              and (
                select count(trigger_row.oid) = 3
                   and bool_and(
                     trigger_row.tgenabled = 'O'
                     and trigger_row.tgtype = expected.trigger_type
                     and trigger_row.tgfoid = expected.function_id
                     and trigger_row.tgconstraint = 0
                     and trigger_row.tgparentid = 0
                     and trigger_row.tgconstrrelid = 0
                     and trigger_row.tgconstrindid = 0
                     and not trigger_row.tgdeferrable
                     and not trigger_row.tginitdeferred
                     and trigger_row.tgqual is null
                     and trigger_row.tgoldtable is null
                     and trigger_row.tgnewtable is null
                     and octet_length(trigger_row.tgargs) = 0
                     and coalesce((
                       select string_agg(column_row.attname, ',' order by update_column.ordinality)
                         from unnest(trigger_row.tgattr::smallint[])
                           with ordinality update_column(attnum, ordinality)
                         join pg_attribute column_row
                           on column_row.attrelid = trigger_row.tgrelid
                          and column_row.attnum = update_column.attnum
                          and not column_row.attisdropped
                     ), '') = expected.update_columns
                   )
                  from (values
                    ('public.bot_assignments'::regclass, 'bot_assignments_increment_revision', 19::smallint,
                     'public.increment_bot_assignment_revision()'::regprocedure, ''),
                    ('public.bots'::regclass, 'bots_ai_account_binding_coherent', 23::smallint,
                     'public.enforce_bot_ai_account_binding()'::regprocedure,
                     'organization_id,ai_account_id,provider,credential_ref'),
                    ('public.bots'::regclass, 'bots_increment_revision', 19::smallint,
                     'public.increment_bot_revision()'::regprocedure, '')
                  ) expected(relation_id, trigger_name, trigger_type, function_id, update_columns)
                  left join pg_trigger trigger_row
                    on trigger_row.tgrelid = expected.relation_id
                   and trigger_row.tgname = expected.trigger_name
                   and not trigger_row.tgisinternal
              );")
          if [ "$CATALOG_READY" != "t" ]; then
            echo "::error::The live function/revision/constraint/trigger catalog is not the exact 20260822000200 EXPAND state."
            exit 1
          fi

          DEFINITIONS_BEFORE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -F '|' -c "
            set search_path = pg_catalog;
            select routine.oid::regprocedure::text,
                   md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')),
                   routine.prosecdef,
                   coalesce(array_to_string(routine.proconfig, ','), ''),
                   pg_get_userbyid(routine.proowner)
              from pg_proc routine
             where routine.oid in (
               'public.assign_bot(uuid,uuid,uuid,uuid)'::regprocedure,
               'public.assign_bots_to_project(uuid,uuid,jsonb)'::regprocedure,
               'public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)'::regprocedure,
               'public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)'::regprocedure,
               'public.set_bot_assignment_execution(uuid,uuid,text,text)'::regprocedure,
               'public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)'::regprocedure
             )
             order by 1;")
          if [ "$(printf '%s\n' "$DEFINITIONS_BEFORE" | wc -l | tr -d ' ')" != "6" ]; then
            echo "::error::A legacy bot mutator identity is missing before CONTRACT."
            exit 1
          fi

          echo "Applying ${FILE} at frozen SHA-256 ${EXPECTED_SHA256} after exact-app acceptance"
          psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -q \
            -f "$FILE" \
            -c "insert into supabase_migrations.schema_migrations (version) values ('20260822000300');"

          DEFINITIONS_AFTER=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atq -F '|' -c "
            set search_path = pg_catalog;
            select routine.oid::regprocedure::text,
                   md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')),
                   routine.prosecdef,
                   coalesce(array_to_string(routine.proconfig, ','), ''),
                   pg_get_userbyid(routine.proowner)
              from pg_proc routine
             where routine.oid in (
               'public.assign_bot(uuid,uuid,uuid,uuid)'::regprocedure,
               'public.assign_bots_to_project(uuid,uuid,jsonb)'::regprocedure,
               'public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)'::regprocedure,
               'public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)'::regprocedure,
               'public.set_bot_assignment_execution(uuid,uuid,text,text)'::regprocedure,
               'public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)'::regprocedure
             )
             order by 1;")
          if [ "$DEFINITIONS_AFTER" != "$DEFINITIONS_BEFORE" ]; then
            echo "::error::A legacy mutator definition/signature/owner/SECURITY DEFINER/search_path changed; stop and contain forward."
            exit 1
          fi

          ACLS_CLOSED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select not exists (
              select 1
                from (values
                  ('public.assign_bot(uuid,uuid,uuid,uuid)'),
                  ('public.assign_bots_to_project(uuid,uuid,jsonb)'),
                  ('public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)'),
                  ('public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)'),
                  ('public.set_bot_assignment_execution(uuid,uuid,text,text)'),
                  ('public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)')
                ) legacy(signature)
                join pg_proc routine on routine.oid = to_regprocedure(legacy.signature)
               where has_function_privilege('authenticated', legacy.signature, 'EXECUTE')
                  or has_function_privilege('anon', legacy.signature, 'EXECUTE')
                  or has_function_privilege('service_role', legacy.signature, 'EXECUTE')
                  or (select count(*) from aclexplode(routine.proacl)) <> 1
                  or exists (
                    select 1 from aclexplode(routine.proacl) acl
                     where acl.grantee = 0 and acl.privilege_type = 'EXECUTE'
                  )
            );")
          if [ "$ACLS_CLOSED" != "t" ]; then
            echo "::error::Legacy mutator authenticated/public/anon/service_role EXECUTE closure failed."
            exit 1
          fi

          RECORDED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000300';")
          if [ "$RECORDED" != "1" ]; then
            echo "::error::The exact CONTRACT migration did not land once in the hosted ledger."
            exit 1
          fi
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo "Exact bot mutator CONTRACT applied, verified, recorded once, and the API schema cache was reloaded."

      - name: Apply the Agentic SDLC lifecycle surgically (scope=lifecycle)
        # Exactly two files — 20260821000100 and 20260821000200 — and no others.
        # Every other outstanding migration stays outstanding and separately
        # decidable, which is the whole reason this scope exists rather than a
        # `scope=all` that would sweep unrelated versions along with it.
        #
        # Replay-safe by construction, checked statement by statement: the three
        # new enum types are created inside DO blocks that first ask pg_type; the
        # activity labels are `add value if not exists`; every new column is
        # `add column if not exists`; the three graphs constraints are guarded by
        # DO blocks, because PostgreSQL has no `add constraint if not exists`;
        # graph_gates is `create table if not exists` with its policy dropped
        # before it is created; and the rest is `create or replace function`.
        # list_graph_runs is the one exception and it is explicit — its return
        # type changes, so the file drops it first with `drop function if exists`.
        #
        # The two files run as separate psql invocations on purpose. PostgreSQL
        # refuses to use an enum value in the transaction that added it, so the
        # labels in 20260821000100 must be committed before the function bodies
        # in 20260821000200 can write them.
        #
        # Prerequisites, confirmed by probe run 32531787440 rather than assumed:
        # 20260821000200 rebuilds claim_planned_graph and list_graph_runs from
        # 20260819001000 and 20260819000800, and that whole 20260819 range is
        # recorded on both sides of the hosted ledger.
        if: ${{ inputs.scope == 'lifecycle' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          # Applied and recorded one at a time, so an interruption leaves a
          # ledger that is behind rather than one that lies.
          for FILE in \
            supabase/migrations/20260821000100_agentic_sdlc_activity_types.sql \
            supabase/migrations/20260821000200_agentic_sdlc_lifecycle.sql
          do
            VERSION=$(basename "$FILE" | cut -d_ -f1)
            echo "Applying ${FILE}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
            repair "$VERSION"
          done
          # Supabase's DDL event trigger reloads the PostgREST schema cache on
          # its own; this is insurance, so a browser that saw PGRST202 seconds
          # ago cannot keep seeing it for decide_node_gate.
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo ""
          echo "What the run actually produced, read back rather than assumed."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select relation.relname,
                   relation.relrowsecurity as rls_enabled,
                   relation.relforcerowsecurity as rls_forced,
                   (select count(*) from pg_policy where polrelid = relation.oid) as policies,
                   has_table_privilege('anon', relation.oid, 'SELECT') as anon_may_select,
                   has_table_privilege('service_role', relation.oid, 'INSERT') as service_role_may_insert
              from pg_class relation
              join pg_namespace space on space.oid = relation.relnamespace
             where space.nspname = 'public'
               and relation.relname = 'graph_gates';"
          echo "rls_enabled and rls_forced must both be t, anon_may_select must be f, and"
          echo "service_role_may_insert must be f — the worker writes only through"
          echo "open_node_gate_as_worker, never through a table grant."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select routine.proname,
                   routine.prosecdef as security_definer,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as authenticated_may_execute,
                   has_function_privilege('service_role', routine.oid, 'EXECUTE') as service_role_may_execute
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
             where space.nspname = 'public'
               and routine.proname in (
                 'open_node_gate_as_worker', 'decide_node_gate', 'advance_graph_iteration')
             order by routine.proname;"
          echo "decide_node_gate is the member-facing one: authenticated must execute it."
          echo "open_node_gate_as_worker is the worker's: authenticated must NOT."
          echo "Exactly one claim_planned_graph overload should exist, and it must be the"
          echo "lifecycle-aware body — a second overload would mean the live claim is a"
          echo "resurrected older signature that reports no gates at all."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select pg_get_function_identity_arguments(routine.oid) as signature,
                   strpos(pg_get_functiondef(routine.oid), 'graph_gates') > 0 as knows_about_gates
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
              where space.nspname = 'public'
                and routine.proname = 'claim_planned_graph';"

      - name: Apply the job-seeker resume extraction migration (scope=job-seeker-resume)
        # Exactly one file — 20260822000400 — and no others. Every other
        # outstanding migration stays outstanding and separately decidable,
        # which is the point of a narrow scope rather than a scope=all that
        # would sweep unrelated versions along with it.
        #
        # Prerequisites are checked against the live ledger rather than
        # assumed. This file references job_seeker_uploads and
        # job_seeker_profiles (20260820000200/000300), the validator
        # job_seeker_text_list_valid (20260820000200), and the enum label
        # job_seeker.profile_updated (20260820000100). If any of those had not
        # run, this would create a table and a function referencing objects
        # that do not exist.
        #
        # Replay-safe by construction: create table if not exists, policies
        # dropped before they are created, indexes if not exists, and one
        # create or replace function. No other migration defines
        # apply_resume_extraction, so there is no shared-function ordering
        # hazard here.
        if: ${{ inputs.scope == 'job-seeker-resume' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::This scope requires SUPABASE_DB_PASSWORD for live ledger verification."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          FILE=supabase/migrations/20260822000400_job_seeker_resume_extraction.sql
          EXPECTED_SHA256=0faa6d4174f01a43abffda463d4dbe9dc60d82be54d9207011e4c064c4f0b465
          ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Migration hash mismatch; refusing production DDL."
            exit 1
          fi

          # The three prerequisites present, and the target genuinely absent.
          # Applying a migration whose version the ledger already records would
          # make the row lie about which DDL ran.
          FOUNDATION=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260820000200';")
          UPLOADS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260820000300';")
          VOCABULARY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260820000100';")
          TARGET=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000400';")
          if [ "$FOUNDATION" != "1" ] || [ "$UPLOADS" != "1" ] || [ "$VOCABULARY" != "1" ] || [ "$TARGET" != "0" ]; then
            echo "::error::Ledger is not in the expected state (foundation=$FOUNDATION uploads=$UPLOADS vocabulary=$VOCABULARY target=$TARGET; want 1/1/1/0)."
            exit 1
          fi

          # The objects themselves, not just their ledger rows — the ledger has
          # been proven to understate the live schema before.
          READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'job_seeker_uploads')
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'job_seeker_profiles')
              and exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                       where n.nspname = 'public' and p.proname = 'job_seeker_text_list_valid')
              and exists (select 1 from pg_type t join pg_enum e on e.enumtypid = t.oid
                       where t.typname = 'activity_event_type' and e.enumlabel = 'job_seeker.profile_updated')
            );")
          if [ "$READY" != "t" ]; then
            echo "::error::A prerequisite object is missing even though its ledger row is present."
            exit 1
          fi

          echo "Applying ${FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          if [ "$MODE" = "token" ]; then
            npx supabase migration repair --status applied 20260822000400
          else
            npx supabase migration repair --status applied 20260822000400 --db-url "$DB_URL"
          fi
          # Supabase's DDL event trigger reloads the PostgREST schema cache on
          # its own; this is insurance so a browser that saw PGRST202 seconds
          # ago cannot keep seeing it for apply_resume_extraction.
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"

          echo ""
          echo "What the run produced, read back rather than assumed."
          VERIFIED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              -- The table is protected exactly as every other job_seeker table is.
              (select c.relrowsecurity and c.relforcerowsecurity
                 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relname = 'job_seeker_resume_extractions')
              and (select count(*) = 3 from pg_policy p join pg_class c on c.oid = p.polrelid
                    where c.relname = 'job_seeker_resume_extractions')
              -- No UPDATE grant: applying is the definer function's job, so a
              -- client cannot mark an extraction applied without the profile
              -- ever changing.
              and not has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'UPDATE')
              and not has_table_privilege('anon', 'public.job_seeker_resume_extractions', 'SELECT')
              and has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'SELECT')
              -- The apply function is a definer the member may call and anon may not.
              and (select p.prosecdef from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                    where n.nspname = 'public' and p.proname = 'apply_resume_extraction')
              and has_function_privilege('authenticated', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE')
              and not has_function_privilege('anon', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE')
            );")
          if [ "$VERIFIED" != "t" ]; then
            echo "::error::Post-apply verification failed: RLS, policy count, table grants, or function ACLs are not as intended."
            exit 1
          fi
          echo "Applied, recorded, and verified: RLS forced, three policies, no UPDATE grant, definer function callable by members only."

      - name: Contract the resume extraction table's grants (scope=job-seeker-grant-contract)
        # Takes back the privileges Supabase's default grants handed to
        # authenticated and service_role when 20260822000400 created the table.
        # Its own post-apply readback measured auth_update = t and
        # service_update = t on production, which is the defect this closes.
        #
        # Pure REVOKE and GRANT — no schema change, replay-safe by definition,
        # and its effect is fully described by the readback below.
        if: ${{ inputs.scope == 'job-seeker-grant-contract' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::This scope requires SUPABASE_DB_PASSWORD for live verification."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          FILE=supabase/migrations/20260822000500_job_seeker_extraction_grant_contract.sql
          EXPECTED_SHA256=c5709783bdaa3919e65809493345b4cfbc527121c2bf44a3a7fe98e0e7e9b1ee
          ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Migration hash mismatch; refusing production DDL."
            exit 1
          fi

          # The table it contracts has to exist, which means 20260822000400 ran.
          PREDECESSOR=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000400';")
          if [ "$PREDECESSOR" != "1" ]; then
            echo "::error::20260822000400 is not recorded; there is no table to contract."
            exit 1
          fi

          echo "Applying ${FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          if [ "$MODE" = "token" ]; then
            npx supabase migration repair --status applied 20260822000500
          else
            npx supabase migration repair --status applied 20260822000500 --db-url "$DB_URL"
          fi
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"

          echo ""
          echo "Every role's privileges on the table, read back one by one."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select role_name as role,
                   has_table_privilege(role_name, 'public.job_seeker_resume_extractions', 'SELECT') as may_select,
                   has_table_privilege(role_name, 'public.job_seeker_resume_extractions', 'INSERT') as may_insert,
                   has_table_privilege(role_name, 'public.job_seeker_resume_extractions', 'UPDATE') as may_update,
                   has_table_privilege(role_name, 'public.job_seeker_resume_extractions', 'DELETE') as may_delete
              from (values ('anon'), ('authenticated'), ('service_role')) as roles(role_name)
             order by 1;"

          VERIFIED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
                  not has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'UPDATE')
              and not has_table_privilege('service_role', 'public.job_seeker_resume_extractions', 'UPDATE')
              and not has_table_privilege('service_role', 'public.job_seeker_resume_extractions', 'SELECT')
              and not has_table_privilege('anon', 'public.job_seeker_resume_extractions', 'SELECT')
              and has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'SELECT')
              and has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'INSERT')
              and has_table_privilege('authenticated', 'public.job_seeker_resume_extractions', 'DELETE')
              and has_function_privilege('authenticated', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE')
              and not has_function_privilege('anon', 'public.apply_resume_extraction(uuid,text[])', 'EXECUTE')
            );")
          if [ "$VERIFIED" != "t" ]; then
            echo "::error::Grant contraction did not produce the intended privileges."
            exit 1
          fi
          echo "Contracted: authenticated holds select/insert/delete only, service_role and anon hold nothing."

      - name: Apply the Backlog and Pipelines clear controls (scope=clear-controls)
        # Exactly two files — 20260822000700 and 20260822000800 — and no others.
        #
        # They run as separate psql invocations because PostgreSQL refuses to
        # use an enum value in the transaction that added it, and the functions
        # in 000800 write the two labels 000700 adds.
        #
        # Replay-safe: the labels are `add value if not exists` and the two
        # functions are `create or replace`. Nothing here deletes a row — the
        # DELETEs live inside the functions and only run when a person presses
        # the button and the function's own guards allow it.
        if: ${{ inputs.scope == 'clear-controls' }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::This scope requires SUPABASE_DB_PASSWORD for live verification."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          TYPES_FILE=supabase/migrations/20260822000700_clear_surface_activity_types.sql
          FNS_FILE=supabase/migrations/20260822000800_clear_backlog_and_pipelines.sql
          if [ "$(sha256sum "$TYPES_FILE" | cut -d' ' -f1)" != "184b942ef3511d1774ba6a26b9e93daf19326804d41e507ad6c48f1f6447b42b" ] \
            || [ "$(sha256sum "$FNS_FILE" | cut -d' ' -f1)" != "e85444206c1e9c290d305e60812d47f32e9342dfd920749116ab7df143532a5a" ]; then
            echo "::error::Migration hash mismatch; refusing production DDL."
            exit 1
          fi

          # Neither version already recorded. Applying under a version the
          # ledger holds is how this repository previously lost a migration.
          TYPES_ROW=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000700';")
          FNS_ROW=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000800';")
          if [ "$TYPES_ROW" != "0" ] || [ "$FNS_ROW" != "0" ]; then
            echo "::error::Ledger already records one of these versions (types=$TYPES_ROW functions=$FNS_ROW; want 0/0)."
            exit 1
          fi

          # The tables the functions read, checked as objects rather than rows.
          READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'tasks')
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'commands')
              and exists (select 1 from pg_class c join pg_namespace n on n.oid = c.relnamespace
                       where n.nspname = 'public' and c.relkind = 'r' and c.relname = 'agent_runs')
              and exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                       where n.nspname = 'public' and p.proname = 'can_manage_organization')
            );")
          if [ "$READY" != "t" ]; then
            echo "::error::A table or function these clears depend on is missing."
            exit 1
          fi

          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          echo "Applying ${TYPES_FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$TYPES_FILE"
          repair 20260822000700
          echo "Applying ${FNS_FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FNS_FILE"
          repair 20260822000800
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"

          echo ""
          echo "What the run produced, read back rather than assumed."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select routine.proname,
                   routine.prosecdef as security_definer,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as member_may_execute,
                   has_function_privilege('anon', routine.oid, 'EXECUTE') as anon_may_execute
              from pg_proc routine
              join pg_namespace space on space.oid = routine.pronamespace
             where space.nspname = 'public'
               and routine.proname in ('clear_backlog_tasks', 'clear_all_pipelines')
             order by 1;"

          VERIFIED=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc "
            select (
              (select count(*) = 2 from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public'
                  and p.proname in ('clear_backlog_tasks', 'clear_all_pipelines')
                  and p.prosecdef)
              and has_function_privilege('authenticated', 'public.clear_backlog_tasks(uuid,text,boolean)', 'EXECUTE')
              and has_function_privilege('authenticated', 'public.clear_all_pipelines(uuid,text,boolean)', 'EXECUTE')
              and not has_function_privilege('anon', 'public.clear_backlog_tasks(uuid,text,boolean)', 'EXECUTE')
              and not has_function_privilege('anon', 'public.clear_all_pipelines(uuid,text,boolean)', 'EXECUTE')
              -- The audit vocabulary the functions write.
              and exists (select 1 from pg_type t join pg_enum e on e.enumtypid = t.oid
                           where t.typname = 'activity_event_type' and e.enumlabel = 'task.backlog_cleared')
              and exists (select 1 from pg_type t join pg_enum e on e.enumtypid = t.oid
                           where t.typname = 'activity_event_type' and e.enumlabel = 'command.pipelines_cleared')
            );")
          if [ "$VERIFIED" != "t" ]; then
            echo "::error::Post-apply verification failed: definer flag, ACLs, or activity labels are not as intended."
            exit 1
          fi
          echo "Applied and verified: both clears are SECURITY DEFINER, callable by members only, with their audit labels present."

      - name: Repair bots onto the executable model (scope=executable-model-repair)
        # One file, and it rewrites data rather than schema: bots whose model
        # came from the catalog's openai list move onto the model the Codex
        # worker actually claims, and posting overrides naming one are cleared.
        #
        # Replay-safe by construction — after the first run nothing matches the
        # stale set, so a second run writes no rows and no events. Every repair
        # is an activity event carrying the previous model, so the change is
        # visible to the person whose bot moved rather than silent. A model this
        # console never offered is deliberately out of scope: it was typed by a
        # person, and rewriting a deliberate choice is worse than refusing it.
        if: ${{ inputs.scope == 'executable-model-repair' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi

          FILE=supabase/migrations/20260822000600_route_bots_onto_the_executable_model.sql
          EXPECTED_SHA256=c76448dfb29a60dfcc792d00a7853bebbe97acfb2002b440f12565b93fde78f0
          ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Migration hash mismatch; refusing production write."
            exit 1
          fi

          echo "Before:"
          psql "$DB_URL" -q -c "select model, count(*) from public.bots where provider = 'openai' group by model order by 2 desc;"

          echo "Applying ${FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          if [ "$MODE" = "token" ]; then
            npx supabase migration repair --status applied 20260822000600
          else
            npx supabase migration repair --status applied 20260822000600 --db-url "$DB_URL"
          fi

          echo "After, and what moved:"
          psql "$DB_URL" -q -c "select model, count(*) from public.bots where provider = 'openai' group by model order by 2 desc;"
          psql "$DB_URL" -q -c "select entity_type, metadata ->> 'previous_model' as was, coalesce(metadata ->> 'model', '(cleared)') as now from public.activity_events where metadata ->> 'reason' = 'provider_model_mismatch_repair' order by occurred_at desc limit 50;"

      - name: Push the outstanding migrations (scope=all)
        # The pipe answers the CLI's confirmation prompt when it asks one;
        # in a non-interactive shell it is simply unread.
        # Named rather than "everything except broker-functions". The negative
        # form meant every scope added later fell through into a full
        # production push: run 32068262957 asked only for a read-only probe and
        # reached this step anyway. `db push` refused to act — it stops rather
        # than insert migrations before the remote's last one — so nothing was
        # applied, but the guard was one CLI safety check away from mattering.
        if: ${{ inputs.scope == 'all' }}
        run: |
          # `db push` has no per-file exclusion. Refuse the broad path until the
          # protected ACL normalizer, EXPAND, and CONTRACT migrations have each already passed
          # their dedicated hash, predecessor, catalog, ACL, app-acceptance,
          # and ledger checks above in separate runs.
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::scope=all requires SUPABASE_DB_PASSWORD to prove protected migrations 20260822000150, 20260822000200, and 20260822000300 are already recorded."
            exit 1
          fi
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          PROTECTED_NORMALIZER=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
