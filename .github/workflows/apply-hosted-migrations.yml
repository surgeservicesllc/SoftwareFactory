          PROTECTED_RESUME_FUNCTION_ACL=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822001100';")
          if [ "$PROTECTED_NORMALIZER" != "1" ]; then
