          PRECONTRACT_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            set search_path = pg_catalog;
            with expected(signature, source_md5, contract_md5) as (values
              ('public.assign_bot(uuid,uuid,uuid,uuid)',
               '80b547b7b722c57a9d2a262b67698be8', '4c3a0328e1fd387ec9ead279fafed804'),
              ('public.assign_bots_to_project(uuid,uuid,jsonb)',
