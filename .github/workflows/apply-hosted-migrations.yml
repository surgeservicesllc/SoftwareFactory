          CONTRACT_SHA256=79914bc97660eef908b6a0fa0c90abfdd15da1683b383ad568e34bf3bd32c5f7
          JOB_RESUME_SHA256=0faa6d4174f01a43abffda463d4dbe9dc60d82be54d9207011e4c064c4f0b465
          JOB_GRANTS_SHA256=c5709783bdaa3919e65809493345b4cfbc527121c2bf44a3a7fe98e0e7e9b1ee
          MODEL_REPAIR_SHA256=c76448dfb29a60dfcc792d00a7853bebbe97acfb2002b440f12565b93fde78f0
          CLEAR_TYPES_SHA256=184b942ef3511d1774ba6a26b9e93daf19326804d41e507ad6c48f1f6447b42b
          CLEAR_FUNCTIONS_SHA256=e85444206c1e9c290d305e60812d47f32e9342dfd920749116ab7df143532a5a
          HOSTED_FUNCTION_ACL_SHA256=8cb197e922294234035e8abfb6864bb695bd9dbef021c05464519054e2e5abce
          REPAIR_SHA256=512869badb309e99f9c58c6886ecd1af10e3b29ec636ed700b93b539f2f0f694
