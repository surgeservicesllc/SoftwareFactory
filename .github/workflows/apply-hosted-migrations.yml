              ('public.record_bot_readiness(uuid,uuid,public.bot_readiness,text)',
               'daecfeb964d863373a2072cc62e1033e', '1a47048cf178ec01fdc50ba54d5f1209'),
              ('public.set_bot_assignment_execution(uuid,uuid,text,text)',
               '55ec15132d903ace0300f2cbe32db6bd', '016c558c50ad586575c3702c44c8baf2'),
              ('public.update_bot_assignment(uuid,uuid,public.bot_assignment_status)',
               '0aaec47295f86adbeec784d288f24400', '6a2ece465f5c9a633cf1638c536840a1'),
              ('public.update_bot_assignment_configuration(uuid,uuid,jsonb,uuid,public.bot_assignment_status)',
               '7f51999309b645832d471ccebea94a9c', 'be712da901009204d10cc830be164a9f')
            ), state as (
              select expected.*, routine.oid, routine.proowner, routine.proacl,
                     routine.provolatile,
                     md5(replace(replace(routine.prosrc, E'\\r\\n', E'\\n'), E'\\r', E'\\n')) as actual_source_md5,
                     md5(jsonb_build_array(
                       routine_schema.nspname,
                       routine_language.lanname,
                       pg_get_userbyid(routine.proowner),
                       routine.prokind::text,
                       format_type(routine.prorettype, null),
                       routine.proretset,
                       routine.pronargs,
                       routine.pronargdefaults,
                       coalesce(array_to_string(routine.proargnames, ','), ''),
                       coalesce(array_to_string(routine.proargmodes, ','), ''),
                       coalesce((
                         select string_agg(
                           format_type(argument_type.type_oid, null),
                           ',' order by argument_type.ordinality
                         )
                         from unnest(routine.proallargtypes)
                           with ordinality argument_type(type_oid, ordinality)
                       ), ''),
                       coalesce(pg_get_expr(routine.proargdefaults, 0), ''),
                       routine.proisstrict, routine.proleakproof,
                       routine.prosecdef, routine.proparallel::text,
                       routine.provariadic = 0, routine.procost::text,
                       routine.prorows::text, routine.prosupport = 0,
                       routine.probin is null, routine.prosqlbody is null,
                       routine.protrftypes is null, routine.proconfig,
                       routine.proacl is null
                     )::text) as actual_contract_md5
              from expected
              left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
              left join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
              left join pg_language routine_language on routine_language.oid = routine.prolang
            )
            select count(oid) = 6
               and bool_and(
                 actual_source_md5 is not distinct from source_md5
                 and actual_contract_md5 is not distinct from contract_md5
                 and provolatile is not distinct from 'v'
                 and proacl is not null
                 and (select count(*) from aclexplode(proacl)) = 2
                 and exists (
                   select 1 from aclexplode(proacl) acl
                    where acl.grantor = proowner
                      and acl.grantee = proowner
                      and acl.privilege_type = 'EXECUTE'
                      and not acl.is_grantable
                 )
                 and exists (
                   select 1 from aclexplode(proacl) acl
                    where acl.grantor = proowner
                      and acl.grantee = to_regrole('authenticated')::oid
                      and acl.privilege_type = 'EXECUTE'
                      and not acl.is_grantable
                 )
                 and has_function_privilege('authenticated', signature, 'EXECUTE')
                 and not has_function_privilege('anon', signature, 'EXECUTE')
                 and not has_function_privilege('service_role', signature, 'EXECUTE')
                 and not exists (
                   select 1 from aclexplode(proacl) acl
                    where acl.grantor <> proowner
                       or acl.grantee not in (proowner, to_regrole('authenticated')::oid)
                       or acl.privilege_type <> 'EXECUTE'
                       or acl.is_grantable
                 )
               )
               and (
                 select count(*) = 6
                 from pg_proc routine
                 join pg_namespace routine_schema on routine_schema.oid = routine.pronamespace
                 where routine_schema.nspname = 'public'
                   and routine.proname in (
                     'assign_bot', 'assign_bots_to_project', 'record_bot_readiness',
                     'set_bot_assignment_execution', 'update_bot_assignment',
                     'update_bot_assignment_configuration'
                   )
               )
