              ('public.submit_factory_command_routing_internal(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)', '8418fd26e9b1783315a93ffbf4543838', 'none'),
              ('public.submit_factory_command(uuid,uuid,uuid,uuid,text,public.risk_level,jsonb,text)', '6008476137a77db33d220be4b14a9c8d', 'authenticated'),
              ('public.record_provider_run_phase1c_compatibility_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', 'c450eac6987cdd603d2d2511a9fa8833', 'none'),
              ('public.record_provider_run(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', '9dfdfc57f4f8b0965a89fefd927beb26', 'authenticated'),
              ('public.record_provider_run_phase2a_internal(uuid,uuid,uuid,uuid,text,public.risk_level,text,text,text,text,text,text,jsonb,jsonb,text,public.run_status,text,jsonb,jsonb,jsonb,integer,text,jsonb)', '46cee8bec5e12fd4f087ecbeea0c9844', 'none')
            )
            select left(expected.signature, 60) as wrapper,
                   expected.execute_role as want_role,
                   routine.oid is not null as present,
                   md5(replace(replace(routine.prosrc, E'\r\n', E'\n'), E'\r', E'\n')) = expected.source_md5 as source_ok,
                   routine.provolatile::text as vol, routine.prosecdef as secdef,
                   routine.proconfig = array['search_path=pg_catalog']::text[] as config_ok,
                   coalesce(routine.proacl::text, '<null>') as acl,
                   has_function_privilege('anon', routine.oid, 'EXECUTE') as anon_x,
                   has_function_privilege('service_role', routine.oid, 'EXECUTE') as service_x,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as auth_x
            from expected
            left join pg_proc routine on routine.oid = to_regprocedure(expected.signature)
            order by expected.signature;"
          echo ""
          echo "Guard table and AgentOS foundation posture the two later postflights pin."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            set search_path = pg_catalog;
            select relation.relname, relation.relrowsecurity as rls, relation.relforcerowsecurity as force_rls,
                   coalesce(relation.relacl::text, '<null>') as relacl,
                   has_table_privilege('anon', relation.oid, 'SELECT') as anon_sel,
                   has_table_privilege('service_role', relation.oid, 'SELECT') as service_sel,
                   has_table_privilege('authenticated', relation.oid, 'SELECT') as auth_sel,
                   has_table_privilege('authenticated', relation.oid, 'INSERT') as auth_ins
              from pg_class relation
             where relation.relnamespace = 'public'::regnamespace
               and relation.relname in (
                 'factory_record_only_submission_guards',
                 'agentos_environments', 'agentos_mcp_connections', 'agentos_skills',
                 'agentos_agent_grants', 'agentos_agent_mcp_grants',
                 'agentos_agent_skill_grants', 'agentos_agent_repo_grants',
                 'agentos_agent_filesystem_grants', 'agentos_agent_collaborators')
             order by relation.relname;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            set search_path = pg_catalog;
            select routine.proname, coalesce(routine.proacl::text, '<null>') as proacl,
                   has_function_privilege('anon', routine.oid, 'EXECUTE') as anon_x,
                   has_function_privilege('service_role', routine.oid, 'EXECUTE') as service_x,
                   has_function_privilege('authenticated', routine.oid, 'EXECUTE') as auth_x
              from pg_proc routine
             where routine.oid in (
               to_regprocedure('public.agentos_hosts_are_bare_hostnames(text[])'),
               to_regprocedure('public.agentos_resolved_agent_grants(uuid)'))
             order by routine.proname;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select count(*) as record_only_agent_runs
              from public.agent_runs run
              join public.tasks task on task.id = run.task_id
              join public.commands command on command.id = task.command_id
             where command.parameters ->> 'executionMode' = 'record_only';"
          echo "Expected: record_only_agent_runs 0 (the record-only boundary produced no run)."

          echo ""
          echo "20260814002500 provider credential vault: the exact object"
          echo "inventory. The ledger does not record this file, yet its table"
          echo "exists - which is why the Supabase Preview branch replays it and"
          echo "dies with 42P07. Finishing it needs to know precisely which"
          echo "pieces landed, because NOT VISIBLE is not absent."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select object_name, object_kind, present from (
              values
                ('provider_credentials', 'table', to_regclass('public.provider_credentials') is not null),
                ('provider_connect_sessions', 'table', to_regclass('public.provider_connect_sessions') is not null),
                ('provider_connect_sessions_expiry_idx', 'index', to_regclass('public.provider_connect_sessions_expiry_idx') is not null),
                ('list_provider_credentials', 'function', to_regprocedure('public.list_provider_credentials(uuid)') is not null),
                ('open_provider_connect_session', 'function', to_regprocedure('public.open_provider_connect_session(uuid,text,text,integer)') is not null),
                ('resolve_provider_connect_session', 'function', to_regprocedure('public.resolve_provider_connect_session(text)') is not null),
                ('claim_provider_connect_session', 'function', to_regprocedure('public.claim_provider_connect_session(text,text)') is not null),
                ('read_provider_credential', 'function', to_regprocedure('public.read_provider_credential(uuid,text)') is not null),
                ('forget_provider_credential', 'function', to_regprocedure('public.forget_provider_credential(uuid,text)') is not null)
            ) as inventory(object_name, object_kind, present)
            order by object_kind, object_name;"

          echo ""
          echo "And the columns those two tables actually carry, because a table"
          echo "that exists is not the same as a table that is complete."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select table_name, column_name, data_type, is_nullable
              from information_schema.columns
             where table_schema = 'public'
               and table_name in ('provider_credentials', 'provider_connect_sessions')
             order by table_name, ordinal_position;" || true

          echo ""
          echo "RLS posture and client grants on those tables - the part a"
          echo "migration that died before its grants would have skipped."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select relation.relname,
                   relation.relrowsecurity as rls,
                   relation.relforcerowsecurity as force_rls,
                   (select count(*) from pg_policy policy where policy.polrelid = relation.oid) as policies,
                   has_table_privilege('authenticated', relation.oid, 'SELECT') as authenticated_select,
                   has_table_privilege('service_role', relation.oid, 'SELECT') as service_role_select
              from pg_class relation
              join pg_namespace space on space.oid = relation.relnamespace
             where space.nspname = 'public'
               and relation.relname in ('provider_credentials', 'provider_connect_sessions')
             order by relation.relname;" || true

          echo ""
          echo "The Pipelines page's selection delete, as the database actually"
          echo "declares it: which output columns it returns tells you whether a"
          echo "selected pipeline is stopped before removal (stopped_count) or"
          echo "merely skipped (kept_running). Tolerant of either era."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select coalesce(
              (select array_to_string(proargnames, ', ')
                 from pg_proc
                where oid = to_regprocedure('public.delete_selected_pipelines(uuid,uuid[],text,boolean)')),
              'delete_selected_pipelines absent (pre-20260823000200 database)'
            ) as selection_delete_arguments;" || true

          echo ""
          echo "Analysis graphs and their command links - the record-only execution"
          echo "surface. Tolerant of a database that predates the link migration."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select graph.id, left(graph.goal, 60) as goal, graph.risk_level,
                   graph.requires_owner_approval, graph.created_at,
                   (select count(*) from public.graph_nodes node where node.graph_id = graph.id) as nodes,
                   (select count(*) from public.graph_runs run where run.graph_id = graph.id) as runs
              from public.graphs graph
             order by graph.created_at desc
             limit 5;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select case when to_regclass('public.command_analysis_graphs') is null
                        then 'link table absent (pre-20260823000100 database)'
                        else 'link rows: ' || (select count(*)::text from public.command_analysis_graphs)
                   end as command_analysis_links;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select link.command_id, link.graph_id, link.created_at
              from public.command_analysis_graphs link
             order by link.created_at desc
             limit 5;" || true
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select run.id, run.graph_id, run.state, run.started_at, run.completed_at,
                   (select count(*) from public.graph_artifacts artifact where artifact.graph_run_id = run.id) as artifacts
              from public.graph_runs run
             order by run.created_at desc
             limit 5;"

          echo ""
          echo "Execution-path readiness for a real manual Codex run: which bots carry"
          echo "the one executable identity, whether their accounts read connected,"
          echo "how their project assignments are configured, and what the recent"
          echo "commands, tasks, and runs actually did. Metadata only - never secrets."
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select bot.id, bot.name, bot.provider, bot.model, bot.readiness,
                   left(coalesce(bot.readiness_detail, ''), 60) as readiness_detail,
                   bot.ai_account_id is not null as has_account,
                   account.provider as account_provider, account.auth_method,
                   account.status as account_status, account.last_verified_at
              from public.bots bot
              left join public.ai_accounts account on account.id = bot.ai_account_id
             order by bot.created_at;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select assignment.id, project.name as project, bot.name as bot,
                   assignment.model as assignment_model, assignment.repository_access,
                   assignment.can_open_pull_request, assignment.pipeline_access,
                   assignment.requires_human_approval, assignment.max_concurrent_tasks,
                   assignment.work_effort
              from public.bot_assignments assignment
              join public.bots bot on bot.id = assignment.bot_id
              join public.projects project on project.id = assignment.project_id
             order by project.name, bot.name;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select command.id, command.status, command.requested_risk, command.command_type,
                   command.parameters ->> 'executionMode' as execution_mode,
                   command.parameters ->> 'provider' as provider,
                   command.parameters ->> 'model' as model,
                   command.created_at
              from public.commands command
             order by command.created_at desc
             limit 5;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select task.id, task.command_id, task.status, task.assigned_agent_id is not null as has_agent,
                   task.created_at
              from public.tasks task
             order by task.created_at desc
             limit 5;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select run.id, run.status, run.provider, run.model, run.attempt_number,
                   run.lease_worker_id, run.error_code, left(coalesce(run.error_message,''), 80) as error_message,
                   run.head_branch, run.created_at
              from public.agent_runs run
             order by run.created_at desc
             limit 5;"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "
            select project.name, project.github_repository, project.default_branch,
                   connection.status as connection_status, installation.status as installation_status,
                   repository.selected, repository.default_branch as repo_default_branch
              from public.projects project
              left join public.project_connections link on link.project_id = project.id and link.is_primary
              left join public.connections connection on connection.id = link.connection_id
              left join public.github_installations installation on installation.connection_id = connection.id
              left join public.github_repositories repository on repository.id = link.github_repository_id
             order by project.name;"

      - name: Apply the project control migrations surgically (scope=project-controls)
        # The 20260815 range plus the two run-review files: everything the
        # project detail page's priority, focus, stop and cancel controls need,
        # and the Runs page's review and delete.
        #
        # Exactly the three files run 32068262957's probe showed missing, and
        # no others.
        #
        # The probe is why this list is short. The ledger says the whole
        # 20260815 range is outstanding; the database says otherwise — every
        # project scheduling column, and set_project_engineering_pause,
        # set_project_engineering_priority, focus_portfolio_engineering,
        # set_portfolio_capacity_limits and update_project_details, are already
        # live. Applying that range re-runs DDL for objects that exist, which
        # is exactly how run 32068091179 failed.
        #
        # Missing, and therefore here: archive_project and unarchive_project —
        # the project detail page's cancel and restore — the run review and
        # deletion pair, and run archiving with the report lifecycle. Every file
        # is idempotent: enum additions are `add value if not exists`, functions
        # are `create or replace`, and the two column-adding files use
        # `add column if not exists` with their constraints dropped before they
        # are added.
        #
        # 20260817001000 also drops and recreates list_agent_runs to add
        # p_include_archived. The parameter has a default, so the existing
        # two-argument call sites keep working through the swap.
        if: ${{ inputs.scope == 'project-controls' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          repair() {
            if [ "$MODE" = "token" ]; then
              npx supabase migration repair --status applied "$1"
            else
              npx supabase migration repair --status applied "$1" --db-url "$DB_URL"
            fi
          }
          # Each file is applied and immediately recorded, so an interruption
          # leaves a ledger that is behind rather than one that lies.
          for FILE in \
            supabase/migrations/20260815000700_project_archive_operation.sql \
            supabase/migrations/20260817000200_run_review_activity_types.sql \
            supabase/migrations/20260817000300_run_review_and_deletion.sql \
            supabase/migrations/20260817000900_run_and_report_lifecycle_types.sql \
            supabase/migrations/20260817001000_archive_runs_and_clear_reports.sql
          do
            VERSION=$(basename "$FILE" | cut -d_ -f1)
            echo "Applying ${FILE}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
            repair "$VERSION"
          done

      - name: Apply the pipeline selection migration (scope=pipeline-selection)
        # One file, because one feature needs it. Running broker-functions to
        # reach it would re-run unrelated migrations, each idempotent but each
        # still a change to production nobody asked for in this run.
        #
        # 20260821000300 creates public.project_pipelines with RLS and FORCE
        # RLS, revokes every table privilege from anon, authenticated and
        # service_role, and adds select_project_pipeline,
        # deselect_project_pipeline and list_project_pipelines. It adds; it
        # alters nothing that exists. Every statement is idempotent —
        # `create table if not exists`, `create index if not exists`,
        # `alter type ... add value if not exists`, `create or replace
        # function` — and psql runs each autocommitted, which is what lets the
        # two new enum labels be added and then named from a function body
        # defined below them.
        if: ${{ inputs.scope == 'pipeline-selection' }}
        run: |
          if [ "$MODE" != "dburl" ]; then
            ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
            echo "::add-mask::$ENC"
            DB_URL="postgresql://postgres.${PROJECT_REF}:${ENC}@aws-0-us-west-2.pooler.supabase.com:5432/postgres"
            echo "::add-mask::$DB_URL"
          fi
          FILE=supabase/migrations/20260821000300_project_pipeline_selection.sql
          echo "Applying ${FILE}"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$FILE"
          if [ "$MODE" = "token" ]; then
            npx supabase migration repair --status applied 20260821000300
          else
            npx supabase migration repair --status applied 20260821000300 --db-url "$DB_URL"
          fi
          # Insurance: Supabase's DDL event trigger reloads the PostgREST
          # schema cache on its own, but a browser that saw PGRST202 seconds
          # ago must not keep seeing it.
          psql "$DB_URL" -q -c "NOTIFY pgrst, 'reload schema';"
          echo "Pipeline selection applied and recorded; the API schema cache was reloaded."

