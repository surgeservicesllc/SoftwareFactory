          PROTECTED_EXPAND=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000200';")
          PROTECTED_CONTRACT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
