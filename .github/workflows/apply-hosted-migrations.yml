          PROTECTED_EXPAND=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000200';")
          PROTECTED_CONTRACT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            "select count(*) from supabase_migrations.schema_migrations where version = '20260822000300';")
          if [ "$PROTECTED_NORMALIZER" != "1" ]; then
            echo "::error::Protected migration 20260822000150 is not recorded exactly once. Apply it only through scope=bot-legacy-acl-normalization; broad push is forbidden."
