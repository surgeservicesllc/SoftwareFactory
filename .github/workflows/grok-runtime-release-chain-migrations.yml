name: Grok runtime release chain protected migrations

# Manual and forward-only. Probe rehearses only the next absent file under
# rollback, apply-one persists only that same file and its ledger row, and
# verify requires the complete 01800 -> 01900 -> 02000 -> 02100 prefix.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Probe the next file, apply only the next file, or verify the completed Grok runtime chain."
        required: true
        type: choice
        options:
          - probe
          - apply-one
          - verify
      confirm:
        description: 'Type the exact "<operation>-grok-runtime-release-chain" confirmation.'
        required: true
        default: ""
        type: string
      release_sha:
        description: "Exact lowercase 40-character SoftwareFactory main SHA already fully green and READY in Production."
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: apply-hosted-migrations
  cancel-in-progress: false

jobs:
  release:
    name: Protected Grok runtime chain ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_REF: qpuofpmagrmyamahqwxw
      PRODUCTION_ORIGIN: https://www.theagoras.com
      PRODUCTION_HEALTH_URL: https://www.theagoras.com/api/health
      VERCEL_PROJECT_ID: prj_pAsrhftaVWI4SyaqstgRVSWHJkdD
      MIGRATION_018_FILE: supabase/migrations/20260831001800_grok_deploy_readiness_runtime.sql
      MIGRATION_018_SHA256: 7c401a943833bc2fd7fc505cf3692012077180a3198f00ec9760b3a46dcc4444
      MIGRATION_018_BYTES: "41937"
      MIGRATION_019_FILE: supabase/migrations/20260831001900_grok_admission_version_null_fence.sql
      MIGRATION_019_SHA256: a0dd4da859e5ed6cb65342f2e5b3962c07d672346bd06685052c6446e99c5221
      MIGRATION_019_BYTES: "8404"
      MIGRATION_020_FILE: supabase/migrations/20260831002000_exact_graph_repository_workspace.sql
      MIGRATION_020_SHA256: 6bdcbdaa5a0b6f512a53ed72c513da02ce2d8042d28157e70f497a6ded4f3057
      MIGRATION_020_BYTES: "19411"
      MIGRATION_021_FILE: supabase/migrations/20260831002100_grok_initial_wake_receipts.sql
      MIGRATION_021_SHA256: 838f300d25c6a44f6632ed883010066524da229e165598968c7cdd7dab583b16
      MIGRATION_021_BYTES: "37089"
    steps:
      - name: Authorize the exact protected operation
        env:
          AUTHORIZED_ACTOR: ${{ vars.PRODUCTION_RELEASE_ACTOR }}
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          case "$OPERATION:$CONFIRM" in
            probe:probe-grok-runtime-release-chain|apply-one:apply-one-grok-runtime-release-chain|verify:verify-grok-runtime-release-chain) ;;
            *) echo "::error::The exact operation-specific confirmation is required."; exit 1 ;;
          esac
          if [ -z "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_TRIGGERING_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::This first-attempt-only lane is restricted to the configured production release actor."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "surgeservicesllc/SoftwareFactory" ] \
            || [ "$GITHUB_REF" != "refs/heads/main" ] \
            || ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Repository, main ref, or release SHA identity is not exact."
            exit 1
          fi

      - name: Check out the exact release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Verify exact green READY production and stopped execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [ "$SHA" != "$RELEASE_SHA" ] || [ "$GITHUB_SHA" != "$SHA" ]; then
            echo "::error::Checked-out, requested, and workflow SHA identities differ."
            exit 1
          fi
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          if [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::Current main moved away from the exact requested release."
            exit 1
          fi

          CHECKS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
          for NAME in \
            "Lint, typecheck, test, and build" \
            "Browser and accessibility tests 1/3" \
            "Browser and accessibility tests 2/3" \
            "Browser and accessibility tests 3/3"; do
            STATE=$(jq -r --arg name "$NAME" --arg sha "$SHA" '
              [.check_runs[] | select(.name==$name and .head_sha==$sha and .app.slug=="github-actions")]
              | sort_by(.completed_at // .started_at // "") | last
              | if .==null then "missing|missing" else "\(.status)|\(.conclusion // "null")" end
            ' <<<"$CHECKS")
            if [ "$STATE" != "completed|success" ]; then
              echo "::error::Exact-head check '$NAME' is not green ($STATE)."
              exit 1
            fi
          done

          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ -z "$DEPLOYMENT" ] \
            || ! jq -e --arg sha "$SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Latest Vercel Production identity is not the exact checked-out SHA."
            exit 1
          fi
          GITHUB_DEPLOYMENT_ID=$(jq -r '.id | tostring' <<<"$DEPLOYMENT")
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$(jq -r '.statuses_url' <<<"$DEPLOYMENT")?per_page=1")
          if ! jq -e 'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | test("^https://softwarefactory-[a-z0-9]+-surgeservices-projects\\.vercel\\.app/?$"))' <<<"$STATUS" >/dev/null; then
            echo "::error::Exact-SHA Vercel Production is not READY."
            exit 1
          fi
          VERCEL_DEPLOYMENT_URL=$(jq -r '.[0].environment_url | rtrimstr("/")' <<<"$STATUS")
          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if ! jq -e \
            --arg sha "$SHA" --arg project "$PROJECT_REF" \
            --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
            --arg vercel_project "$VERCEL_PROJECT_ID" '
              .status=="ok" and .service=="SoftwareFactory"
              and .database=="reachable" and .databaseProject=="matched"
              and .databaseProjectRef==$project and .deployment=="matched"
              and .deploymentUrl==$deployment_url and .vercelProjectId==$vercel_project
              and (.vercelDeploymentId | type=="string" and test("^dpl_[A-Za-z0-9]+$"))
              and .release=="matched" and .releaseSha==$sha and .releaseRef=="main"
            ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Production health identity does not match Git, READY Vercel, and Supabase."
            exit 1
          fi
          VERCEL_DEPLOYMENT_ID=$(jq -r '.vercelDeploymentId' <<<"$HEALTH")
          {
            echo "GITHUB_DEPLOYMENT_ID=$GITHUB_DEPLOYMENT_ID"
            echo "VERCEL_DEPLOYMENT_URL=$VERCEL_DEPLOYMENT_URL"
            echo "VERCEL_DEPLOYMENT_ID=$VERCEL_DEPLOYMENT_ID"
          } >> "$GITHUB_ENV"

          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} has ${ACTIVE} active run(s)."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch, schedule, or auth broker is outside stopped containment."
            exit 1
          fi
      - name: Stage the four exact canonical LF files
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/grok-runtime-release-chain-${GITHUB_RUN_ID}"
          mkdir -p "$STAGE_DIR"
          if [ -n "$(find "$STAGE_DIR" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::The release-chain staging directory was not empty."
            exit 1
          fi
          for SLOT in 018 019 020 021; do
            FILE_VARIABLE="MIGRATION_${SLOT}_FILE"
            SHA_VARIABLE="MIGRATION_${SLOT}_SHA256"
            BYTES_VARIABLE="MIGRATION_${SLOT}_BYTES"
            SOURCE=${!FILE_VARIABLE}
            EXPECTED_SHA=${!SHA_VARIABLE}
            EXPECTED_BYTES=${!BYTES_VARIABLE}
            git ls-files --error-unmatch "$SOURCE" >/dev/null
            git diff --exit-code -- "$SOURCE"
            if [ -L "$SOURCE" ] || [ ! -f "$SOURCE" ]; then
              echo "::error::Migration ${SLOT} is missing, untracked, or a symbolic link."
              exit 1
            fi
            STAGED="$STAGE_DIR/$(basename "$SOURCE")"
            python3 - "$SOURCE" "$STAGED" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          pathlib.Path(sys.argv[2]).write_bytes(
              source.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          )
          PY
            ACTUAL_SHA=$(sha256sum "$STAGED" | cut -d' ' -f1)
            ACTUAL_BYTES=$(wc -c < "$STAGED" | tr -d ' ')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ] || [ "$ACTUAL_BYTES" != "$EXPECTED_BYTES" ]; then
              echo "::error::Canonical LF identity failed for migration ${SLOT}."
              exit 1
            fi
            echo "STAGED_${SLOT}=$STAGED" >> "$GITHUB_ENV"
          done
          if [ "$(find "$STAGE_DIR" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" != "4" ]; then
            echo "::error::The release-chain staging directory must contain exactly four files."
            exit 1
          fi

      - name: Connect to the exact Supabase project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required."
            exit 1
          fi
          ENC=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$ENC"
          for HOST in aws-0-us-west-2.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com; do
            URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${HOST}:5432/postgres"
            echo "::add-mask::$URL"
            if psql "$URL" -v ON_ERROR_STOP=1 -X -Atqc \
              "select current_database()='postgres' and current_user='postgres' and to_regnamespace('supabase_migrations') is not null" \
              | grep -qx t; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Could not connect to exact Supabase project ${PROJECT_REF}."
          exit 1

      - name: Resolve only the next eligible migration
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          UNRELATED_LEDGER_SHA256=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -c "
            select encode(sha256(convert_to(
              coalesce(jsonb_agg(to_jsonb(migration) order by migration.version), '[]'::jsonb)::text,
              'UTF8'
            )), 'hex')
              from supabase_migrations.schema_migrations migration
             where migration.version not in (
               '20260831001800','20260831001900','20260831002000','20260831002100'
             );")
          if ! [[ "$UNRELATED_LEDGER_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not establish the immutable unrelated-ledger baseline."
            exit 1
          fi

          RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -v operation="$OPERATION" -v expected_next_version="auto" \
            -v unrelated_ledger_sha256="$UNRELATED_LEDGER_SHA256" \
            -f .github/grok-release/grok-runtime-release-chain-preflight.sql)
          IFS='|' read -r MARKER BEFORE_PREFIX NEXT_VERSION <<<"$RESULT"
          if [ "$MARKER" != "grok-runtime-release-chain-preflight-ok" ] \
            || ! [[ "$BEFORE_PREFIX" =~ ^(0000|1000|1100|1110|1111)$ ]] \
            || ! [[ "$NEXT_VERSION" =~ ^(20260831001800|20260831001900|20260831002000|20260831002100|complete)$ ]]; then
            echo "::error::The exact forward prefix or next migration could not be resolved."
            exit 1
          fi
          if [ "$BEFORE_PREFIX" = "0000" ] || [ "$BEFORE_PREFIX" = "1000" ]; then
            PREREQUISITE_017_LEDGER_SHA256=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -c "
              select encode(sha256(convert_to(
                coalesce(jsonb_agg(to_jsonb(migration) order by migration.version), '[]'::jsonb)::text,
                'UTF8'
              )), 'hex')
                from supabase_migrations.schema_migrations migration
               where migration.version <> '20260831001700';")
            PREREQUISITE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -v operation="verify" \
              -v unrelated_ledger_sha256="$PREREQUISITE_017_LEDGER_SHA256" \
              -f .github/grok-release/grok-read-only-research-runtime-preflight.sql)
            if [ "$PREREQUISITE" != "grok-read-only-research-release-preflight-ok" ]; then
              echo "::error::The exact protected 017 predecessor is not installed and stopped."
              exit 1
            fi
          else
            echo "::notice::The chain-native predecessor fingerprint preserves 017 after 019 revokes its old service endpoint."
          fi
          case "$NEXT_VERSION" in
            20260831001800) STAGED_MIGRATION="$STAGED_018" ;;
            20260831001900) STAGED_MIGRATION="$STAGED_019" ;;
            20260831002000) STAGED_MIGRATION="$STAGED_020" ;;
            20260831002100) STAGED_MIGRATION="$STAGED_021" ;;
            complete) STAGED_MIGRATION="" ;;
            *) echo "::error::No allowlisted next migration was resolved."; exit 1 ;;
          esac
          {
            echo "UNRELATED_LEDGER_SHA256=$UNRELATED_LEDGER_SHA256"
            echo "BEFORE_PREFIX=$BEFORE_PREFIX"
            echo "NEXT_VERSION=$NEXT_VERSION"
            echo "STAGED_MIGRATION=$STAGED_MIGRATION"
          } >> "$GITHUB_ENV"

      - name: Preserve the exact dedicated 019 safeguards
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "$BEFORE_PREFIX" == 11* ]]; then
            DEDICATED_OPERATION=verify
          elif [ "$NEXT_VERSION" = "20260831001900" ]; then
            if [ "$OPERATION" = "apply-one" ]; then DEDICATED_OPERATION=apply; else DEDICATED_OPERATION=probe; fi
          else
            echo "::notice::The ordered prefix has not reached the 019 safeguard boundary."
            exit 0
          fi
          DEDICATED_019_LEDGER_SHA256=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -c "
            select encode(sha256(convert_to(
              coalesce(jsonb_agg(to_jsonb(migration) order by migration.version), '[]'::jsonb)::text,
              'UTF8'
            )), 'hex')
              from supabase_migrations.schema_migrations migration
             where migration.version <> '20260831001900';")
          RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -v operation="$DEDICATED_OPERATION" \
            -v unrelated_ledger_sha256="$DEDICATED_019_LEDGER_SHA256" \
            -f .github/grok-release/grok-admission-version-null-fence-preflight.sql)
          if [ "$RESULT" != "grok-admission-version-null-fence-release-preflight-ok" ]; then
            echo "::error::The unchanged dedicated 019 preflight failed."
            exit 1
          fi
          echo "DEDICATED_019_LEDGER_SHA256=$DEDICATED_019_LEDGER_SHA256" >> "$GITHUB_ENV"
          if [ "$DEDICATED_OPERATION" = "verify" ]; then
            RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -f .github/grok-release/grok-admission-version-null-fence-postflight.sql)
            if [ "$RESULT" != "grok-admission-version-null-fence-release-postflight-ok" ]; then
              echo "::error::The unchanged dedicated 019 catalog/runtime postflight failed."
              exit 1
            fi
          fi

      - name: Rehearse only the next migration and linked lint
        if: ${{ inputs.operation == 'probe' || inputs.operation == 'apply-one' }}
        run: |
          set -euo pipefail
          if [ "$NEXT_VERSION" = "complete" ]; then
            echo "::notice::The exact four-file prefix is already complete; probe is read-only verification."
            exit 0
          fi
          BASELINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$BASELINE" != "0|0" ]; then
            echo "::error::plpgsql_check residue existed before rehearsal."
            exit 1
          fi

          PSQL_ARGS=(
            -v ON_ERROR_STOP=1 -X -Atq
            -c "begin; set local lock_timeout='15s'; set local statement_timeout='10min';"
            -f "$STAGED_MIGRATION"
            -v next_version="$NEXT_VERSION"
            -c "insert into supabase_migrations.schema_migrations(version) values (:'next_version');"
          )
          if [ "$NEXT_VERSION" != "20260831001800" ]; then
            PSQL_ARGS+=(
              -c "create extension if not exists plpgsql_check with schema extensions;"
              -v installed_through="$NEXT_VERSION"
              -f .github/grok-release/grok-runtime-release-chain-lint.sql
            )
          fi
          PSQL_ARGS+=(
            -v installed_through="$NEXT_VERSION"
            -f .github/grok-release/grok-runtime-release-chain-postflight.sql
          )
          if [ "$NEXT_VERSION" = "20260831001900" ]; then
            PSQL_ARGS+=(-f .github/grok-release/grok-admission-version-null-fence-postflight.sql)
          else
            PSQL_ARGS+=(-c "rollback;")
          fi
          FINDINGS=$(psql "$DB_URL" "${PSQL_ARGS[@]}")
          if printf '%s\n' "$FINDINGS" | grep -q '^LINTROW|'; then
            echo "::error::Transactional linked-database lint found migration findings."
            printf '%s\n' "$FINDINGS" | grep '^LINTROW|'
            exit 1
          fi
          if ! printf '%s\n' "$FINDINGS" | grep -qx 'grok-runtime-release-chain-postflight-ok'; then
            echo "::error::The chain catalog/runtime rehearsal did not finish exactly."
            exit 1
          fi
          if [ "$NEXT_VERSION" = "20260831001900" ] \
            && ! printf '%s\n' "$FINDINGS" | grep -qx 'grok-admission-version-null-fence-release-postflight-ok'; then
            echo "::error::The unchanged dedicated 019 adverse/replay rehearsal did not finish exactly."
            exit 1
          fi
          RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$RESIDUE" != "0|0" ]; then
            echo "::error::Transactional rehearsal left linked-lint catalog residue."
            exit 1
          fi

      - name: Apply only the next ordered forward migration
        if: ${{ inputs.operation == 'apply-one' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if [ "$CURRENT_MAIN_SHA" != "$RELEASE_SHA" ] \
            || ! jq -e --arg sha "$RELEASE_SHA" --arg project "$PROJECT_REF" \
              --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
              --arg deployment_id "$VERCEL_DEPLOYMENT_ID" \
              --arg vercel_project "$VERCEL_PROJECT_ID" '
                .status=="ok" and .releaseSha==$sha and .releaseRef=="main"
                and .databaseProjectRef==$project and .deploymentUrl==$deployment_url
                and .vercelDeploymentId==$deployment_id and .vercelProjectId==$vercel_project
              ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Main or exact production identity changed before apply."
            exit 1
          fi
          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} became active immediately before apply."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch, schedule, or auth broker changed before apply."
            exit 1
          fi

          PSQL_ARGS=(
            -v ON_ERROR_STOP=1 -X --single-transaction -q
            -c "set local lock_timeout='15s'; set local statement_timeout='10min';
                lock table supabase_migrations.schema_migrations in share row exclusive mode;
                lock table public.organizations, public.projects, public.phase1c_workers,
                  public.graph_runs, public.agent_runs, public.grok_phase1c_submission_guards,
                  public.grok_sessions, public.grok_control_intents, public.grok_events,
                  public.grok_graph_launches, public.graph_nodes, public.node_contracts,
                  public.graph_gates, public.grok_specialist_admissions,
                  public.grok_execution_admissions in share mode;"
            -v operation="apply-one"
            -v expected_next_version="$NEXT_VERSION"
            -v unrelated_ledger_sha256="$UNRELATED_LEDGER_SHA256"
            -f .github/grok-release/grok-runtime-release-chain-preflight.sql
          )
          if [ "$NEXT_VERSION" = "20260831001900" ]; then
            PSQL_ARGS+=(
              -v operation="apply"
              -v unrelated_ledger_sha256="$DEDICATED_019_LEDGER_SHA256"
              -f .github/grok-release/grok-admission-version-null-fence-preflight.sql
            )
          fi
          PSQL_ARGS+=(
            -f "$STAGED_MIGRATION"
            -v next_version="$NEXT_VERSION"
            -c "insert into supabase_migrations.schema_migrations(version) values (:'next_version');"
            -v installed_through="$NEXT_VERSION"
            -f .github/grok-release/grok-runtime-release-chain-postflight.sql
            -c "select pg_catalog.pg_notify('pgrst','reload schema');"
          )
          psql "$DB_URL" "${PSQL_ARGS[@]}"

      - name: Verify exact prefix catalog ACL RLS audit runtime and lint
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION:$BEFORE_PREFIX" in
            probe:0000) EXPECTED_PREFIX=0000; EXPECTED_NEXT=20260831001800 ;;
            probe:1000) EXPECTED_PREFIX=1000; EXPECTED_NEXT=20260831001900 ;;
            probe:1100) EXPECTED_PREFIX=1100; EXPECTED_NEXT=20260831002000 ;;
            probe:1110) EXPECTED_PREFIX=1110; EXPECTED_NEXT=20260831002100 ;;
            probe:1111) EXPECTED_PREFIX=1111; EXPECTED_NEXT=complete ;;
            apply-one:0000) EXPECTED_PREFIX=1000; EXPECTED_NEXT=20260831001900 ;;
            apply-one:1000) EXPECTED_PREFIX=1100; EXPECTED_NEXT=20260831002000 ;;
            apply-one:1100) EXPECTED_PREFIX=1110; EXPECTED_NEXT=20260831002100 ;;
            apply-one:1110) EXPECTED_PREFIX=1111; EXPECTED_NEXT=complete ;;
            verify:1111) EXPECTED_PREFIX=1111; EXPECTED_NEXT=complete ;;
            *) echo "::error::Operation and exact starting prefix cannot produce one forward result."; exit 1 ;;
          esac
          POST_OPERATION=probe
          if [ "$EXPECTED_PREFIX" = "1111" ]; then POST_OPERATION=verify; fi
          RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -v operation="$POST_OPERATION" -v expected_next_version="$EXPECTED_NEXT" \
            -v unrelated_ledger_sha256="$UNRELATED_LEDGER_SHA256" \
            -f .github/grok-release/grok-runtime-release-chain-preflight.sql)
          if [ "$RESULT" != "grok-runtime-release-chain-preflight-ok|${EXPECTED_PREFIX}|${EXPECTED_NEXT}" ]; then
            echo "::error::The post-operation chain prefix is not exact."
            exit 1
          fi
          {
            echo "EXPECTED_PREFIX=$EXPECTED_PREFIX"
            echo "EXPECTED_NEXT=$EXPECTED_NEXT"
          } >> "$GITHUB_ENV"

          if [[ "$EXPECTED_PREFIX" == 11* ]]; then
            DEDICATED_019_LEDGER_SHA256=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -c "
              select encode(sha256(convert_to(
                coalesce(jsonb_agg(to_jsonb(migration) order by migration.version), '[]'::jsonb)::text,
                'UTF8'
              )), 'hex')
                from supabase_migrations.schema_migrations migration
               where migration.version <> '20260831001900';")
            RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -v operation="verify" \
              -v unrelated_ledger_sha256="$DEDICATED_019_LEDGER_SHA256" \
              -f .github/grok-release/grok-admission-version-null-fence-preflight.sql)
            if [ "$RESULT" != "grok-admission-version-null-fence-release-preflight-ok" ]; then
              echo "::error::The installed unchanged dedicated 019 preflight failed."
              exit 1
            fi
            RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -f .github/grok-release/grok-admission-version-null-fence-postflight.sql)
            if [ "$RESULT" != "grok-admission-version-null-fence-release-postflight-ok" ]; then
              echo "::error::The installed unchanged dedicated 019 postflight failed."
              exit 1
            fi
          fi

          case "$EXPECTED_PREFIX" in
            0000) INSTALLED_THROUGH="" ;;
            1000) INSTALLED_THROUGH=20260831001800 ;;
            1100) INSTALLED_THROUGH=20260831001900 ;;
            1110) INSTALLED_THROUGH=20260831002000 ;;
            1111) INSTALLED_THROUGH=20260831002100 ;;
            *) echo "::error::Unexpected post-operation prefix."; exit 1 ;;
          esac
          if [ -n "$INSTALLED_THROUGH" ]; then
            RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -c "begin; set local lock_timeout='15s'; set local statement_timeout='10min';" \
              -v installed_through="$INSTALLED_THROUGH" \
              -f .github/grok-release/grok-runtime-release-chain-postflight.sql \
              -c "rollback;")
            if ! printf '%s\n' "$RESULT" | grep -qx 'grok-runtime-release-chain-postflight-ok'; then
              echo "::error::Installed chain catalog/RLS/ACL/audit/runtime verification failed."
              exit 1
            fi
          fi

          if [[ "$EXPECTED_PREFIX" == 11* ]]; then
            BASELINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
              select count(*) filter (where extension_row.oid is not null),
                     count(*) filter (where routine.oid is not null)
                from (values (1)) seed(value)
                left join pg_extension extension_row on extension_row.extname='plpgsql_check'
                left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
            if [ "$BASELINE" != "0|0" ]; then
              echo "::error::plpgsql_check residue existed before installed lint."
              exit 1
            fi
            FINDINGS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
              -c "begin; create extension if not exists plpgsql_check with schema extensions;" \
              -v installed_through="$INSTALLED_THROUGH" \
              -f .github/grok-release/grok-runtime-release-chain-lint.sql \
              -c "rollback;")
            if printf '%s\n' "$FINDINGS" | grep -q '^LINTROW|'; then
              echo "::error::Installed linked-database lint found findings."
              printf '%s\n' "$FINDINGS" | grep '^LINTROW|'
              exit 1
            fi
            RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
              select count(*) filter (where extension_row.oid is not null),
                     count(*) filter (where routine.oid is not null)
                from (values (1)) seed(value)
                left join pg_extension extension_row on extension_row.extname='plpgsql_check'
                left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
            if [ "$RESIDUE" != "0|0" ]; then
              echo "::error::Installed-function lint left catalog residue."
              exit 1
            fi
          else
            echo "::notice::Linked lint is deferred until 019 installs the intentional 018 forward dependency."
          fi

      - name: Reverify exact identities ledger and stopped containment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          OPERATION: ${{ inputs.operation }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
        run: |
          set -euo pipefail
          for SLOT in 018 019 020 021; do
            STAGED_VARIABLE="STAGED_${SLOT}"
            SHA_VARIABLE="MIGRATION_${SLOT}_SHA256"
            BYTES_VARIABLE="MIGRATION_${SLOT}_BYTES"
            STAGED=${!STAGED_VARIABLE}
            if [ "$(sha256sum "$STAGED" | cut -d' ' -f1)" != "${!SHA_VARIABLE}" ] \
              || [ "$(wc -c < "$STAGED" | tr -d ' ')" != "${!BYTES_VARIABLE}" ]; then
              echo "::error::Staged migration ${SLOT} identity changed during the lane."
              exit 1
            fi
          done
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ "$CURRENT_MAIN_SHA" != "$RELEASE_SHA" ] \
            || [ "$(jq -r '.id | tostring' <<<"$DEPLOYMENT")" != "$GITHUB_DEPLOYMENT_ID" ] \
            || ! jq -e --arg sha "$RELEASE_SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Final main or exact GitHub deployment identity changed."
            exit 1
          fi
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$(jq -r '.statuses_url' <<<"$DEPLOYMENT")?per_page=1")
          if ! jq -e --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
            'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | rtrimstr("/"))==$deployment_url' \
            <<<"$STATUS" >/dev/null; then
            echo "::error::Final exact Vercel deployment is no longer READY."
            exit 1
          fi
          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if ! jq -e --arg sha "$RELEASE_SHA" --arg project "$PROJECT_REF" \
            --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
            --arg deployment_id "$VERCEL_DEPLOYMENT_ID" \
            --arg vercel_project "$VERCEL_PROJECT_ID" '
              .status=="ok" and .service=="SoftwareFactory"
              and .database=="reachable" and .databaseProject=="matched"
              and .databaseProjectRef==$project and .deployment=="matched"
              and .deploymentUrl==$deployment_url and .vercelDeploymentId==$deployment_id
              and .vercelProjectId==$vercel_project
              and .release=="matched" and .releaseSha==$sha and .releaseRef=="main"
            ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Final production health identity changed."
            exit 1
          fi
          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} became active during the release lane."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch, schedule, or auth broker changed during the lane."
            exit 1
          fi
          POST_OPERATION=probe
          if [ "$EXPECTED_PREFIX" = "1111" ]; then POST_OPERATION=verify; fi
          RESULT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -v operation="$POST_OPERATION" -v expected_next_version="$EXPECTED_NEXT" \
            -v unrelated_ledger_sha256="$UNRELATED_LEDGER_SHA256" \
            -f .github/grok-release/grok-runtime-release-chain-preflight.sql)
          if [ "$RESULT" != "grok-runtime-release-chain-preflight-ok|${EXPECTED_PREFIX}|${EXPECTED_NEXT}" ]; then
            echo "::error::Final unrelated-ledger, later-version, catalog, or stopped-state verification failed."
            exit 1
          fi
          echo "::notice::Grok runtime chain ${OPERATION} finished at prefix ${EXPECTED_PREFIX}; next=${EXPECTED_NEXT}; execution remained stopped."
