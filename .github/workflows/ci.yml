name: CI

on:
  pull_request:
  # The merge queue builds a candidate commit containing this pull request on
  # top of everything ahead of it, and waits for the required checks to report
  # against *that* commit. Without this trigger the checks never fire on a
  # queued candidate and every merge blocks forever, so this line is a
  # prerequisite for enabling the queue rather than an optimisation.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a queued candidate. Each entry has its own
  # `refs/heads/gh-readonly-queue/...` ref, so nothing should collide -- but a
  # cancelled check reads to the queue as a failed one, and it would eject the
  # pull request and look like flakiness rather than a cancellation.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    # The suite reached 1605 tests and was cancelled at test 1538 by the old
    # 20-minute ceiling (run 32213327241, attempt 2) — steady progress, not a
    # hang, ~96% done. The last green day's suite fit in 14 minutes; this is
    # growth, and the ceiling grows with it. If the job approaches THIS limit,
    # shard the Playwright projects instead of raising it again.
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
