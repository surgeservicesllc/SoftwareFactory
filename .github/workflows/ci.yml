name: CI

on:
  pull_request:
  # Required for the merge queue: it builds a candidate commit and waits for the
  # required checks to report against *that* commit, so without this trigger
  # every queued pull request blocks forever.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A push to main must never cancel the verification of the commit before it.
# Rapid merges repeatedly left main with a `cancelled` CI verdict (runs
# 32272713212, 32216103242) — merges landed with no completed full-suite proof
# behind them, which is indistinguishable from a suite that was never run.
# Pull-request refs keep the supersede behaviour: a newer push to the same
# branch makes the older run's answer worthless. Main pushes get a per-commit
# group so each commit is verified on its own and nothing pre-empts it.
concurrency:
  # Merge-queue safe as written: for a merge_group event the first condition is
  # false, so the group keys on `github.ref`, and a queued candidate runs on its
  # own `refs/heads/gh-readonly-queue/...` ref. It never shares a group with a
  # pull-request run or with another queue entry, so nothing can cancel it and
  # no extra condition is needed here.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

  e2e:
    # Sharded, as the 30-minute ceiling's own comment said to do when the job
    # reached it. Run 32273981419 was killed at test 1582 of 1605 — steady
    # progress at two seconds a test, roughly forty seconds from finishing.
    # Raising the ceiling a third time (14 min -> 20 -> 30) would buy one more
    # release of page growth and then cost another red main.
    #
    # Playwright splits the whole suite across the shards, so wall time is a
    # third of the total rather than the total, and stays that way as pages are
    # added. Each shard's own ceiling is generous on purpose: the number to
    # watch is a shard's real duration, and a shard that approaches twelve
    # minutes means it is time for a fourth shard, not a bigger number here.
    name: Browser and accessibility tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One slow shard must not hide a genuine failure in another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        # Bounded and retried, because this step hangs in the wild: on run
        # 32277635392 two of three shards sat 19 minutes inside `apt-get
        # update` against a stalled Ubuntu mirror and ate their whole job
        # budget without running one test. `timeout` kills a hung attempt
        # after four minutes (a healthy install takes ~2.5) and the retry
        # gets a fresh mirror connection; the step ceiling backstops the
        # loop so the job budget stays for the tests.
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt ${attempt} failed or hung; retrying."
          done
          echo "Chromium could not be installed after 3 bounded attempts."
          exit 1

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/3
