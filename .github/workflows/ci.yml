name: CI

on:
  pull_request:
  # Required for the merge queue: it builds a candidate commit and waits for the
  # required checks to report against *that* commit, so without this trigger
  # every queued pull request blocks forever.
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.ref` is what makes this safe for the merge queue without any extra
  # condition: a queued candidate runs on its own
  # `refs/heads/gh-readonly-queue/...` ref, so it never shares a group with a
  # pull-request run or with another queue entry, and nothing can cancel it.
  #
  # Do not add `cancel-in-progress: ${{ github.event_name != 'merge_group' }}`
  # here. It looks like a useful guard against a cancelled check ejecting a pull
  # request from the queue, but the ref already prevents that -- and GitHub
  # silently stops creating workflow runs for the branch when that expression is
  # present. No run object, no error, no annotation: the pull request simply
  # never gets checks. That cost an hour to find by bisection.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

  e2e:
    name: Browser and accessibility tests
    runs-on: ubuntu-latest
    # The suite reached 1605 tests and was cancelled at test 1538 by the old
    # 20-minute ceiling (run 32213327241, attempt 2) — steady progress, not a
    # hang, ~96% done. The last green day's suite fit in 14 minutes; this is
    # growth, and the ceiling grows with it. If the job approaches THIS limit,
    # shard the Playwright projects instead of raising it again.
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
