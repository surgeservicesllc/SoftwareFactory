name: Accept the exact Factory production URL

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact lowercase 40-character main SHA already green and READY in Production."
        required: true
        type: string
      confirm:
        description: 'Type "ACCEPT FACTORY PRODUCTION URL" exactly.'
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: apply-hosted-migrations
  cancel-in-progress: false

jobs:
  acceptance:
    name: Signed-in URL write, reload, audit, and no-op replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_REF: qpuofpmagrmyamahqwxw
      SITE_ORIGIN: https://www.theagoras.com
      TARGET_URL: https://www.theagoras.com
      VERCEL_PROJECT_ID: prj_pAsrhftaVWI4SyaqstgRVSWHJkdD

    steps:
      - name: Verify the immutable invocation identity
        env:
          AUTHORIZED_ACTOR: ${{ vars.PRODUCTION_RELEASE_ACTOR }}
          CONFIRM: ${{ inputs.confirm }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set +x
          if [ "$CONFIRM" != "ACCEPT FACTORY PRODUCTION URL" ] \
            || [ -z "$AUTHORIZED_ACTOR" ] \
            || [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$GITHUB_REPOSITORY" != "surgeservicesllc/SoftwareFactory" ] \
            || [ "$GITHUB_REF" != "refs/heads/main" ] \
            || [ "$GITHUB_SHA" != "$RELEASE_SHA" ] \
            || [ "$GITHUB_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_TRIGGERING_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_RUN_ATTEMPT" != "1" ] \
            || [ "$PROJECT_REF" != "qpuofpmagrmyamahqwxw" ] \
            || [ "$SITE_ORIGIN" != "https://www.theagoras.com" ] \
            || [ "$TARGET_URL" != "https://www.theagoras.com" ]; then
            echo "::error::Exact production acceptance invocation identity did not match."
            exit 1
          fi

      - name: Check out the exact release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact green READY release and stopped execution workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
        run: |
          set +x
          SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          if [ "$RELEASE_SHA" != "$SHA" ] || [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::Current repository main is not the exact requested release."
            exit 1
          fi

          CHECKS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
          for NAME in \
            "Lint, typecheck, test, and build" \
            "Browser and accessibility tests 1/3" \
            "Browser and accessibility tests 2/3" \
            "Browser and accessibility tests 3/3"; do
            STATE=$(jq -r --arg name "$NAME" --arg sha "$SHA" '
              [.check_runs[] | select(.name==$name and .head_sha==$sha and .app.slug=="github-actions")]
              | sort_by(.completed_at // .started_at // "") | last
              | if .==null then "missing|missing" else "\(.status)|\(.conclusion // "null")" end
            ' <<<"$CHECKS")
            if [ "$STATE" != "completed|success" ]; then
              echo "::error::Exact-head check '$NAME' is not green ($STATE)."
              exit 1
            fi
          done

          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ -z "$DEPLOYMENT" ] \
            || ! jq -e --arg sha "$SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Latest Vercel Production identity is not the exact release."
            exit 1
          fi
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$(jq -r '.statuses_url' <<<"$DEPLOYMENT")?per_page=1")
          if ! jq -e 'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | test("^https://softwarefactory-[a-z0-9]+-surgeservices-projects\\.vercel\\.app/?$"))' <<<"$STATUS" >/dev/null; then
            echo "::error::Exact-SHA Vercel Production is not READY."
            exit 1
          fi
          VERCEL_DEPLOYMENT_URL=$(jq -r '.[0].environment_url | rtrimstr("/")' <<<"$STATUS")
          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "${SITE_ORIGIN}/api/health")
          if ! jq -e \
            --arg sha "$SHA" \
            --arg project "$PROJECT_REF" \
            --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
            --arg vercel_project "$VERCEL_PROJECT_ID" '
              .status=="ok" and .service=="SoftwareFactory"
              and .database=="reachable" and .databaseProject=="matched"
              and .databaseProjectRef==$project
              and .deployment=="matched" and .deploymentUrl==$deployment_url
              and .vercelProjectId==$vercel_project
              and .release=="matched" and .releaseSha==$sha and .releaseRef=="main"
            ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Public health did not join the exact release, deployment, and Supabase project."
            exit 1
          fi

          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} has ${ACTIVE} active run(s)."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch or auth broker is outside stopped containment."
            exit 1
          fi

      - name: Connect to the exact Supabase project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set +x
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required."
            exit 1
          fi
          ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$ENC"
          for HOST in aws-0-us-west-2.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com; do
            URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${HOST}:5432/postgres"
            echo "::add-mask::$URL"
            if psql "$URL" -X -Atqc "select current_database()" >/dev/null 2>&1; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Could not connect to exact Supabase project ${PROJECT_REF}."
          exit 1

      - name: Exercise the signed-in production writer and immutable audit
        env:
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          OWNER_EMAIL: ${{ secrets.PRODUCTION_ACCEPTANCE_OWNER_EMAIL }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          PROJECT_NAME: ${{ secrets.PRODUCTION_ACCEPTANCE_PROJECT_NAME }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SERVICE_ROLE_KEY: ${{ secrets.SOFTWAREFACTORY_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +x
          fail() { echo "::error::$1"; exit 1; }
          cleanup() {
            rm -f "$RUNNER_TEMP/factory-login.json" "$RUNNER_TEMP/factory-cookies.txt" \
              "$RUNNER_TEMP/factory-callback.html" "$RUNNER_TEMP/factory-response.json"
          }
          trap cleanup EXIT

          if [ -z "$OWNER_EMAIL" ] || [ -z "$PROJECT_NAME" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            fail "The three protected acceptance values are required."
          fi
          echo "::add-mask::$OWNER_EMAIL"
          echo "::add-mask::$PROJECT_NAME"
          echo "::add-mask::$SERVICE_ROLE_KEY"

          verify_live_release_and_workflows() {
            local current_main checks name state deployment status deployment_url health active
            current_main=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              | jq -r '.object.sha // empty')
            [ "$current_main" = "$RELEASE_SHA" ] \
              || fail "Live main moved away from the accepted release."

            checks=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100")
            for name in \
              "Lint, typecheck, test, and build" \
              "Browser and accessibility tests 1/3" \
              "Browser and accessibility tests 2/3" \
              "Browser and accessibility tests 3/3"; do
              state=$(jq -r --arg name "$name" --arg sha "$RELEASE_SHA" '
                [.check_runs[] | select(.name==$name and .head_sha==$sha and .app.slug=="github-actions")]
                | sort_by(.completed_at // .started_at // "") | last
                | if .==null then "missing|missing" else "\(.status)|\(.conclusion // "null")" end
              ' <<<"$checks")
              [ "$state" = "completed|success" ] \
                || fail "An exact-head required check is no longer green."
            done

            deployment=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
              | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
            [ -n "$deployment" ] \
              && jq -e --arg sha "$RELEASE_SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' \
                <<<"$deployment" >/dev/null \
              || fail "Latest Vercel Production moved away from the accepted release."
            status=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$(jq -r '.statuses_url' <<<"$deployment")?per_page=1")
            jq -e 'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | test("^https://softwarefactory-[a-z0-9]+-surgeservices-projects\\.vercel\\.app/?$"))' \
              <<<"$status" >/dev/null \
              || fail "The exact production deployment is no longer READY."
            deployment_url=$(jq -r '.[0].environment_url | rtrimstr("/")' <<<"$status")
            health=$(curl --fail --silent --show-error --max-time 20 --retry 2 "${SITE_ORIGIN}/api/health")
            jq -e \
              --arg sha "$RELEASE_SHA" --arg project "$PROJECT_REF" \
              --arg deployment_url "$deployment_url" --arg vercel_project "$VERCEL_PROJECT_ID" '
                .status=="ok" and .service=="SoftwareFactory"
                and .database=="reachable" and .databaseProject=="matched"
                and .databaseProjectRef==$project
                and .deployment=="matched" and .deploymentUrl==$deployment_url
                and .vercelProjectId==$vercel_project
                and .release=="matched" and .releaseSha==$sha and .releaseRef=="main"
              ' <<<"$health" >/dev/null \
              || fail "Public health no longer joins the exact accepted release."

            for workflow in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
              active=$(curl --fail --silent --show-error \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?per_page=100" \
                | jq '[.workflow_runs[] | select(.status != "completed")] | length')
              [ "$active" = "0" ] || fail "An execution or authentication workflow became active."
            done
            [ "${PHASE1C_WORKER_ENABLED,,}" != "true" ] \
              && [ "${GRAPH_WORKER_ENABLED,,}" != "true" ] \
              && [ "${GRAPH_WORKER_SCHEDULED,,}" != "true" ] \
              && [ "${AUTH_BROKER_DISABLED,,}" = "true" ] \
              || fail "A worker switch or auth broker left stopped containment."
          }

          verify_database_containment_and_catalog() {
            local ledger safe catalog
            ledger=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select
                (select count(*) from supabase_migrations.schema_migrations where version='20260827000200')||'|'||
                (select count(*) from supabase_migrations.schema_migrations where version='20260827000210')||'|'||
                (select count(*) from supabase_migrations.schema_migrations where version='20260828000050')||'|'||
                (select count(*) from supabase_migrations.schema_migrations where version='20260828000100')||'|'||
                (select count(*) from supabase_migrations.schema_migrations where version='20260828000200')||'|'||
                (select count(*) from supabase_migrations.schema_migrations where version='20260828000300');")
            [ "$ledger" = "1|1|1|1|0|0" ] \
              || fail "Production URL acceptance requires the exact pre-target-claims ledger."

            safe=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select
                not exists (
                  select 1 from public.organizations
                  where coalesce(autonomous_mode,false)
                     or autonomy_kill_switch_active is distinct from true
                     or coalesce(auto_plan,false) or coalesce(auto_code,false)
                     or coalesce(auto_test,false) or coalesce(auto_repair,false)
                     or coalesce(auto_review,false) or coalesce(auto_approve,false)
                     or coalesce(auto_merge,false) or coalesce(auto_deploy,false)
                     or coalesce(auto_rollback,false)
                )
                and not exists (
                  select 1 from public.projects
                  where coalesce(autonomous_mode,false)
                     or coalesce(auto_plan,false) or coalesce(auto_code,false)
                     or coalesce(auto_test,false) or coalesce(auto_repair,false)
                     or coalesce(auto_review,false) or coalesce(auto_approve,false)
                     or coalesce(auto_merge,false) or coalesce(auto_deploy,false)
                     or coalesce(auto_rollback,false)
                )
                and not exists (select 1 from public.phase1c_workers where last_heartbeat_at > now()-interval '10 minutes')
                and not exists (select 1 from public.phase1c_workers where last_heartbeat_at > now()+interval '1 minute')
                and not exists (select 1 from public.phase1c_workers where current_run_id is not null)
                and not exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
                and not exists (select 1 from public.agent_runs where status='running'::public.run_status);")
            [ "$safe" = "t" ] || fail "Database containment is not fully stopped."

            catalog=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select
                exists (select 1 from pg_class where oid='public.projects'::regclass and relrowsecurity and relforcerowsecurity)
                and (select count(*) from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                  where space.nspname='public'
                    and routine.proname in ('project_production_url_is_safe','set_project_production_url'))=2
                and exists (select 1 from pg_constraint where conrelid='public.projects'::regclass
                  and conname='projects_production_url_public_https' and convalidated
                  and position('project_production_url_is_safe' in pg_get_constraintdef(oid))>0)
                and exists (select 1 from pg_trigger where tgrelid='public.projects'::regclass
                  and tgname='projects_audit_change' and not tgisinternal and tgenabled='O'
                  and tgfoid='public.audit_project_change()'::regprocedure and tgtype=21
                  and tgnargs=0 and tgconstraint=0 and tgparentid=0 and tgqual is null
                  and not tgdeferrable and not tginitdeferred)
                and exists (select 1 from pg_proc routine
                  where routine.oid='public.set_project_production_url(uuid,uuid,text)'::regprocedure
                    and pg_get_userbyid(routine.proowner)='postgres' and routine.prosecdef
                    and routine.proconfig=array['search_path=pg_catalog']::text[]
                    and md5(replace(replace(routine.prosrc,E'\\r\\n',E'\\n'),E'\\r',E'\\n'))='fc4caa46ffd956e981376579cc22eabe'
                    and routine.proacl is not null and (select count(*) from aclexplode(routine.proacl))=2
                    and not exists (select 1 from aclexplode(routine.proacl) acl
                      where acl.grantor<>routine.proowner or acl.privilege_type<>'EXECUTE' or acl.is_grantable
                        or acl.grantee not in (routine.proowner,to_regrole('authenticated')::oid)))
                and has_function_privilege('authenticated','public.set_project_production_url(uuid,uuid,text)','EXECUTE')
                and not has_function_privilege('anon','public.set_project_production_url(uuid,uuid,text)','EXECUTE')
                and not has_function_privilege('service_role','public.set_project_production_url(uuid,uuid,text)','EXECUTE')
                and exists (select 1 from pg_proc routine
                  where routine.oid='public.project_production_url_is_safe(text)'::regprocedure
                    and pg_get_userbyid(routine.proowner)='postgres' and not routine.prosecdef
                    and routine.provolatile='i' and routine.proconfig=array['search_path=pg_catalog']::text[]
                    and md5(replace(replace(routine.prosrc,E'\\r\\n',E'\\n'),E'\\r',E'\\n'))='8ce3a8b74159b3dd16c710a1e07b5191'
                    and routine.proacl is not null and (select count(*) from aclexplode(routine.proacl))=1
                    and not exists (select 1 from aclexplode(routine.proacl) acl
                      where acl.grantor<>routine.proowner or acl.grantee<>routine.proowner
                        or acl.privilege_type<>'EXECUTE' or acl.is_grantable))
                and not has_function_privilege('authenticated','public.project_production_url_is_safe(text)','EXECUTE')
                and not has_function_privilege('anon','public.project_production_url_is_safe(text)','EXECUTE')
                and not has_function_privilege('service_role','public.project_production_url_is_safe(text)','EXECUTE')
                and public.project_production_url_is_safe('https://www.theagoras.com')
                and not public.project_production_url_is_safe('http://www.theagoras.com')
                and not public.project_production_url_is_safe('https://user@example.com')
                and not public.project_production_url_is_safe('https://127.0.0.1')
                and not public.project_production_url_is_safe('https://www.theagoras.com/?secret=x')
                and exists (select 1 from pg_class relation where relation.oid='public.activity_events'::regclass
                  and relation.relrowsecurity and relation.relforcerowsecurity
                  and pg_get_userbyid(relation.relowner)='postgres'
                  and not has_table_privilege('anon',relation.oid,'UPDATE,DELETE,TRUNCATE')
                  and not has_table_privilege('authenticated',relation.oid,'UPDATE,DELETE,TRUNCATE')
                  and not has_table_privilege('service_role',relation.oid,'UPDATE,DELETE,TRUNCATE'))
                and exists (select 1 from pg_proc guard join pg_language language on language.oid=guard.prolang
                  where guard.oid='public.reject_activity_event_mutation()'::regprocedure
                    and language.lanname='plpgsql' and guard.prokind='f' and guard.provolatile='v'
                    and not guard.prosecdef and guard.prorettype='trigger'::regtype
                    and guard.proconfig=array['search_path=pg_catalog']::text[]
                    and pg_get_userbyid(guard.proowner)='postgres'
                    and btrim(replace(replace(guard.prosrc,E'\\r\\n',E'\\n'),E'\\r',E'\\n'),E' \\n')=
                      E'begin\\n  raise exception using errcode = ''55000'', message = ''activity events are append-only'';\\nend;'
                    and guard.proacl is not null and (select count(*) from aclexplode(guard.proacl))=1
                    and not exists (select 1 from aclexplode(guard.proacl) acl
                      where acl.grantor<>guard.proowner or acl.grantee<>guard.proowner
                        or acl.privilege_type<>'EXECUTE' or acl.is_grantable)
                    and not has_function_privilege('anon',guard.oid,'EXECUTE')
                    and not has_function_privilege('authenticated',guard.oid,'EXECUTE')
                    and not has_function_privilege('service_role',guard.oid,'EXECUTE'))
                and exists (select 1 from pg_trigger trigger_row
                  where trigger_row.tgrelid='public.activity_events'::regclass
                    and trigger_row.tgname='activity_events_append_only'
                    and not trigger_row.tgisinternal and trigger_row.tgenabled='O'
                    and trigger_row.tgtype=27
                    and trigger_row.tgfoid='public.reject_activity_event_mutation()'::regprocedure
                    and trigger_row.tgnargs=0 and trigger_row.tgconstraint=0
                    and trigger_row.tgparentid=0 and trigger_row.tgqual is null
                    and not trigger_row.tgdeferrable and not trigger_row.tginitdeferred);")
            [ "$catalog" = "t" ] || fail "Production URL or immutable-audit catalog drifted."
          }

          verify_live_release_and_workflows
          verify_database_containment_and_catalog

          ROWS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -AtF '|' \
            -v owner_email="$OWNER_EMAIL" -v project_name="$PROJECT_NAME" <<'SQL'
          select auth_user.id, membership.organization_id, project.id,
                 membership.role::text, coalesce(project.production_url,'')
          from auth.users auth_user
          join public.organization_members membership on membership.user_id=auth_user.id
          join public.projects project on project.organization_id=membership.organization_id
          where lower(auth_user.email)=lower(:'owner_email')
            and auth_user.email_confirmed_at is not null
            and project.name=:'project_name'
            and membership.role::text in ('owner','admin')
            and project.status::text<>'archived';
          SQL
          )
          [ "$(printf '%s\n' "$ROWS" | sed '/^$/d' | wc -l | tr -d ' ')" = "1" ] \
            || fail "The protected owner/admin and project target did not resolve uniquely."
          IFS='|' read -r OWNER_USER_ID ORGANIZATION_ID PROJECT_ID OWNER_ROLE CURRENT_URL <<<"$ROWS"
          UUID_RE='^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "$OWNER_USER_ID" =~ $UUID_RE && "$ORGANIZATION_ID" =~ $UUID_RE && "$PROJECT_ID" =~ $UUID_RE ]] \
            || fail "The protected acceptance target returned a non-canonical identity."
          [[ "$OWNER_ROLE" == "owner" || "$OWNER_ROLE" == "admin" ]] \
            || fail "The signed-in acceptance identity is not an owner or administrator."
          [ -z "$CURRENT_URL" ] \
            || fail "The one-shot acceptance requires an unset production URL."

          BEFORE_COUNT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select count(*) from public.activity_events
            where project_id='${PROJECT_ID}'::uuid and event_type='project.updated'::public.activity_event_type;")
          STARTED_AT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "select clock_timestamp();")

          curl --fail --silent --show-error --max-time 20 \
            -X POST "https://${PROJECT_REF}.supabase.co/auth/v1/admin/generate_link" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Cache-Control: no-store" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg email "$OWNER_EMAIL" --arg redirect "${SITE_ORIGIN}/auth/callback" \
              '{type:"magiclink",email:$email,redirect_to:$redirect}')" \
            > "$RUNNER_TEMP/factory-login.json"
          chmod 600 "$RUNNER_TEMP/factory-login.json"
          HASHED_TOKEN=$(jq -r '.hashed_token // empty' "$RUNNER_TEMP/factory-login.json")
          GENERATED_USER_ID=$(jq -r '.id // empty' "$RUNNER_TEMP/factory-login.json")
          [ "$GENERATED_USER_ID" = "$OWNER_USER_ID" ] || fail "GoTrue generated a session for a different identity."
          [ "${#HASHED_TOKEN}" -ge 8 ] || fail "GoTrue did not return a bounded magic-link token hash."
          echo "::add-mask::$HASHED_TOKEN"
          CALLBACK_URL="${SITE_ORIGIN}/auth/callback?token_hash=$(jq -rn --arg v "$HASHED_TOKEN" '$v|@uri')&type=magiclink"
          echo "::add-mask::$CALLBACK_URL"

          CALLBACK_STATUS=$(curl --silent --show-error --location --max-redirs 5 --max-time 30 \
            --cookie-jar "$RUNNER_TEMP/factory-cookies.txt" \
            --cookie "$RUNNER_TEMP/factory-cookies.txt" \
            --output "$RUNNER_TEMP/factory-callback.html" \
            --write-out '%{http_code}' "$CALLBACK_URL")
          [ "$CALLBACK_STATUS" = "200" ] || fail "The production auth callback did not establish a session."
          grep -q "sb-${PROJECT_REF}-auth-token" "$RUNNER_TEMP/factory-cookies.txt" \
            || fail "The production callback did not persist the exact Supabase session cookie."

          post_json() {
            local path=$1 payload=$2
            local status
            status=$(curl --silent --show-error --max-time 20 \
              --cookie "$RUNNER_TEMP/factory-cookies.txt" \
              --cookie-jar "$RUNNER_TEMP/factory-cookies.txt" \
              -H "Origin: ${SITE_ORIGIN}" -H "Content-Type: application/json" \
              -X POST --data "$payload" --output "$RUNNER_TEMP/factory-response.json" \
              --write-out '%{http_code}' "${SITE_ORIGIN}${path}")
            [ "$status" = "200" ] || fail "A signed-in production selection request failed closed."
          }
          patch_url() {
            local status
            status=$(curl --silent --show-error --max-time 20 \
              --cookie "$RUNNER_TEMP/factory-cookies.txt" \
              --cookie-jar "$RUNNER_TEMP/factory-cookies.txt" \
              -H "Origin: ${SITE_ORIGIN}" -H "Content-Type: application/json" \
              -X PATCH --data "$(jq -nc --arg url "$TARGET_URL" '{productionUrl:$url}')" \
              --output "$RUNNER_TEMP/factory-response.json" --write-out '%{http_code}' \
              "${SITE_ORIGIN}/api/projects/${PROJECT_ID}/production-url")
            [ "$status" = "200" ] \
              && jq -e --arg project "$PROJECT_ID" --arg url "$TARGET_URL" \
                '.project.id==$project and .project.productionUrl==$url and (.project.updatedAt|type=="string")' \
                "$RUNNER_TEMP/factory-response.json" >/dev/null \
              || fail "The signed-in production URL writer did not return the exact project value."
          }

          post_json "/api/organizations/active" \
            "$(jq -nc --arg id "$ORGANIZATION_ID" '{organizationId:$id}')"
          jq -e --arg id "$ORGANIZATION_ID" --arg role "$OWNER_ROLE" \
            '.activeOrganizationId==$id and .organization.id==$id and .organization.role==$role' \
            "$RUNNER_TEMP/factory-response.json" >/dev/null \
            || fail "The signed-in owner/admin organization selection did not read back exactly."

          verify_live_release_and_workflows
          verify_database_containment_and_catalog
          patch_url
          AFTER_FIRST_COUNT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select count(*) from public.activity_events
            where project_id='${PROJECT_ID}'::uuid and event_type='project.updated'::public.activity_event_type;")
          [ "$AFTER_FIRST_COUNT" = "$((BEFORE_COUNT + 1))" ] \
            || fail "The first production URL write did not append exactly one audit event."
          AUDIT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -AtF '|' -c "
            select actor_user_id, count(*)
            from public.activity_events
            where project_id='${PROJECT_ID}'::uuid
              and event_type='project.updated'::public.activity_event_type
              and occurred_at >= '${STARTED_AT}'::timestamptz
            group by actor_user_id;")
          [ "$AUDIT" = "${OWNER_USER_ID}|1" ] \
            || fail "The immutable audit event was not exact and owner-attributed."

          patch_url
          AFTER_REPLAY_COUNT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select count(*) from public.activity_events
            where project_id='${PROJECT_ID}'::uuid and event_type='project.updated'::public.activity_event_type;")
          [ "$AFTER_REPLAY_COUNT" = "$AFTER_FIRST_COUNT" ] \
            || fail "The exact no-op replay appended a duplicate audit event."

          PORTFOLIO_STATUS=$(curl --silent --show-error --max-time 20 \
            --cookie "$RUNNER_TEMP/factory-cookies.txt" \
            --output "$RUNNER_TEMP/factory-response.json" --write-out '%{http_code}' \
            "${SITE_ORIGIN}/api/portfolio")
          [ "$PORTFOLIO_STATUS" = "200" ] \
            && jq -e --arg id "$PROJECT_ID" --arg name "$PROJECT_NAME" --arg url "$TARGET_URL" '
              [.portfolio.projects[] | select(.id==$id and .name==$name and .productionUrl==$url)] | length==1
            ' "$RUNNER_TEMP/factory-response.json" >/dev/null \
            || fail "The signed-in production reload did not return the exact persisted URL."

          verify_live_release_and_workflows
          verify_database_containment_and_catalog
          FINAL=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -AtF '|' -c "
            select project.production_url,
              (select count(*) from pg_trigger
               where tgrelid='public.activity_events'::regclass
                 and tgname='activity_events_append_only' and not tgisinternal and tgenabled='O'),
              not exists (
                select 1 from public.organizations
                where coalesce(autonomous_mode,false) or autonomy_kill_switch_active is distinct from true
              ),
              not exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state),
              not exists (select 1 from public.agent_runs where status='running'::public.run_status)
            from public.projects project where project.id='${PROJECT_ID}'::uuid;")
          [ "$FINAL" = "${TARGET_URL}|1|t|t|t" ] \
            || fail "Final URL, immutable audit trigger, or stopped containment did not read back exactly."
          echo "::notice::Signed-in production URL write, immutable audit, no-op replay, reload, and stopped containment passed."
