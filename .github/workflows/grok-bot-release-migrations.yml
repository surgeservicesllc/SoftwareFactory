                      begin
                        perform public.apply_grok_graph_control_as_owner(
                          v_organization_id,v_session.id,v_graph_id,'pause','release verification',v_key || ':ambiguous-pause');
                        raise exception 'control-recovery requested replay after opposite direct action did not refuse';
                      exception when sqlstate '55000' then
                        get stacked diagnostics v_runtime_message=message_text;
                        if v_runtime_message is distinct from 'grok_control_recovery_ambiguous' then
                          raise exception 'control-recovery requested replay refusal identity changed';
                        end if;
                      end;
                      if v_requested.state is distinct from 'requested'
                        or coalesce((select graph.pause_requested_at is not null from public.graphs graph where graph.id=v_graph_id),true)
                        or (select count(*) from public.grok_control_intents intent where intent.session_id=v_session.id)<>3
                        or (select count(*) from public.grok_events event where event.session_id=v_session.id)<>6
                        or (select count(*) from public.activity_events event
                             where event.entity_type='graph' and event.entity_id=v_graph_id
                               and event.event_type='graph.pause_changed')<>4
                      then raise exception 'control-recovery requested replay refusal left state or audit residue'; end if;
                      perform public.withdraw_graph_as_member(v_organization_id,v_graph_id,'release verification withdrawal');
                      begin
                        perform public.apply_grok_graph_control_as_owner(
                          v_organization_id,v_session.id,v_graph_id,'pause','release verification',v_key || ':withdrawn-pause');
                        raise exception 'control-recovery pause after withdrawal did not refuse';
                      exception when sqlstate '55000' then
                        get stacked diagnostics v_runtime_message=message_text;
                        if v_runtime_message is distinct from 'grok_control_not_available' then
                          raise exception 'control-recovery pause after withdrawal refusal identity changed';
                        end if;
                      end;
                      if not coalesce((select graph.withdrawn_at is not null from public.graphs graph where graph.id=v_graph_id),false)
                        or (select count(*) from public.grok_control_intents intent where intent.session_id=v_session.id)<>3
                        or (select count(*) from public.grok_events event where event.session_id=v_session.id)<>6
                        or (select count(*) from public.activity_events event
                             where event.entity_type='graph' and event.entity_id=v_graph_id
                               and event.event_type in ('graph.pause_changed','graph.withdrawn'))<>5
                      then raise exception 'control-recovery pause after withdrawal left state or audit residue'; end if;
                      perform pg_catalog.set_config('request.jwt.claim.sub','',true);
                      begin
                        perform public.apply_grok_graph_control_as_owner(
                          v_organization_id,v_session.id,v_graph_id,'pause','release verification',v_key || ':anon');
                        raise exception 'control-recovery anonymous action did not refuse';
                      exception when sqlstate '42501' then null; end;
                      perform pg_catalog.set_config('request.jwt.claim.sub',pg_catalog.gen_random_uuid()::text,true);
                      begin
                        perform public.apply_grok_graph_control_as_owner(
                          v_organization_id,v_session.id,v_graph_id,'pause','release verification',v_key || ':nonowner');
                        raise exception 'control-recovery non-owner action did not refuse';
                      exception when sqlstate '42501' then null; end;
                      perform pg_catalog.set_config('request.jwt.claim.sub',v_owner_id::text,true);
                      if (select count(*) from public.grok_control_intents intent where intent.session_id=v_session.id)<>3
                        or (select count(*) from public.grok_events event where event.session_id=v_session.id)<>6
                      then raise exception 'control-recovery refused action left durable residue'; end if;
                    end;
                    \$control_recovery_runtime\$;" \
                -c "rollback;"
            fi

            GROK_EXECUTION_BOUNDARY_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              with authenticated_boundary(signature) as (values
                ('public.create_grok_session(uuid,uuid,text,text)'),
                ('public.list_grok_sessions(uuid,uuid,integer,timestamptz,uuid)'),
                ('public.read_grok_session(uuid,uuid,bigint,bigint,integer)'),
                ('public.append_grok_user_message(uuid,uuid,text,jsonb,text,bigint,uuid)'),
                ('public.request_grok_control_intent(uuid,uuid,text,uuid,text,text,text)')
              )
              select to_regprocedure('public.launch_grok_graph_for_session(uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb)') is null
                and not exists (select 1 from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                                 where space.nspname='public' and routine.proname='launch_grok_graph_for_session')
                and (select count(*) from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                       where space.nspname='public' and routine.proname like '%grok%'
                         and strpos(routine.prosrc,'public.create_graph_from_plan_with_release_identity_as_server')>0)=1
                and exists (select 1 from pg_proc routine
                              where routine.oid=to_regprocedure('public.launch_grok_full_lifecycle_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb)')
                                and strpos(routine.prosrc,'public.create_graph_from_plan_with_release_identity_as_server')>0
                                and strpos(routine.prosrc,'''full_lifecycle''')>0
                                and strpos(routine.prosrc,'perform public.set_graph_pause_as_member')>0
                                and strpos(routine.prosrc,'public.graph_runs')>0
                                and strpos(routine.prosrc,'''workerWoken'', false')>0
                                and strpos(routine.prosrc,'''executionStarted'', false')>0
                                and strpos(lower(routine.prosrc),'insert into public.graph_runs')=0
                                and strpos(lower(routine.prosrc),'insert into public.node_runs')=0
                                and strpos(lower(routine.prosrc),'insert into public.agent_runs')=0)
                and not exists (select 1 from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                                 where space.nspname='public' and routine.proname like '%grok%'
                                   and routine.oid<>to_regprocedure('public.launch_grok_full_lifecycle_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb)')
                                   and strpos(routine.prosrc,'public.create_graph_from_plan')>0)
                and (select count(*) from authenticated_boundary boundary
                      join pg_proc routine on routine.oid=to_regprocedure(boundary.signature)
                     where strpos(routine.prosrc,'public.has_organization_role')>0
                       and strpos(routine.prosrc,'''owner''::public.organization_member_role')>0)=5
                and not has_table_privilege('anon','public.grok_graph_launches','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                and not has_table_privilege('authenticated','public.grok_graph_launches','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                and not has_table_privilege('service_role','public.grok_graph_launches','SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER');")
            if [ "$GROK_EXECUTION_BOUNDARY_READY" != "t" ]; then
              echo "::error::Grok owner-only authenticated RPC or fail-closed execution boundary is not exact."
              exit 1
            fi

            GROK_AUDIT_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select
                (select count(*) from pg_trigger trigger_row
                  where trigger_row.tgrelid in (
                    'public.grok_sessions'::regclass,'public.grok_messages'::regclass,'public.grok_task_links'::regclass,
                    'public.grok_graph_launches'::regclass,'public.grok_events'::regclass,'public.grok_artifact_links'::regclass,
                    'public.grok_control_intents'::regclass)
                    and not trigger_row.tgisinternal)=16
                and (select count(*) from pg_trigger trigger_row
                  where trigger_row.tgfoid='public.reject_grok_evidence_mutation()'::regprocedure and not trigger_row.tgisinternal)=14
                and exists (select 1 from pg_constraint where conname='grok_sessions_title_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_messages_content_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_messages_metadata_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_events_payload_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_artifact_links_purpose_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_control_intents_reason_no_secret' and convalidated)
                and exists (select 1 from pg_constraint where conname='grok_control_intents_failure_no_secret' and convalidated);")
            if [ "$GROK_AUDIT_READY" != "t" ]; then
              echo "::error::Grok immutable-audit or secret-boundary catalog postflight failed."
              exit 1
            fi

            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q \
              -c "begin; set local role authenticated; select set_config('request.jwt.claim.sub','00000000-0000-4000-8000-000000000000',true);" \
              -c "do \$grok_runtime\$
                  declare runtime_message text; listed integer;
                  begin
                    select count(*) into listed from public.list_grok_sessions(
                      '00000000-0000-4000-8000-000000000000'::uuid,null,1,null,null
                    );
                    if listed<>0 then raise exception 'non-member Grok list leaked rows'; end if;
                    begin
                      perform public.read_grok_session(
                        '00000000-0000-4000-8000-000000000000'::uuid,
                        '00000000-0000-4000-8000-000000000000'::uuid,0,0,1
                      );
                      raise exception 'non-member Grok read did not refuse';
                    exception when sqlstate 'P0002' then
                      get stacked diagnostics runtime_message=message_text;
                      if runtime_message is distinct from 'grok_session_not_found' then
                        raise exception 'Grok read runtime refusal identity changed';
                      end if;
                    end;
                    begin
                      perform public.create_grok_session(
                        '00000000-0000-4000-8000-000000000000'::uuid,
                        '00000000-0000-4000-8000-000000000000'::uuid,
                        'Verify owner boundary','grok-release-owner-refusal'
                      );
                      raise exception 'non-owner Grok session create did not refuse';
                    exception when sqlstate '42501' then
                      get stacked diagnostics runtime_message=message_text;
                      if runtime_message is distinct from 'organization owner access is required' then
                        raise exception 'Grok session owner refusal identity changed';
                      end if;
                    end;
                  end;
                  \$grok_runtime\$;" \
              -c "rollback;"
          fi

          POST_LINT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -c "begin; create extension if not exists plpgsql_check with schema extensions;" \
            -c "with expected(signature,trigger_relation) as (values
                    ('public.create_graph_from_plan_with_release_identity_as_server(uuid,uuid,uuid,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,text,integer,uuid,text,text,jsonb)',null),
                    ('public.complete_graph_run_with_validated_release_as_worker(text,uuid,public.graph_run_state,boolean,bigint,bigint,text,text)',null),
                    ('public.reject_grok_evidence_mutation()','public.grok_messages'),
                    ('public.enforce_grok_session_update()','public.grok_sessions'),
                    ('public.enforce_grok_control_intent_update()','public.grok_control_intents'),
                    ('public.create_grok_session(uuid,uuid,text,text)',null),
                    ('public.list_grok_sessions(uuid,uuid,integer,timestamptz,uuid)',null),
                    ('public.read_grok_session(uuid,uuid,bigint,bigint,integer)',null),
                    ('public.append_grok_message_internal(uuid,uuid,text,text,jsonb,text,bigint,uuid,uuid)',null),
                    ('public.append_grok_user_message(uuid,uuid,text,jsonb,text,bigint,uuid)',null),
                    ('public.link_grok_task_as_server(uuid,uuid,uuid,uuid,uuid,uuid,uuid,text)',null),
                    ('public.record_grok_event_as_server(uuid,uuid,text,uuid,jsonb,bigint,uuid,uuid)',null),
                    ('public.launch_grok_full_lifecycle_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb)',null),
                    ('public.link_grok_artifact_as_server(uuid,uuid,uuid,uuid,uuid,uuid,text)',null),
                    ('public.request_grok_control_intent(uuid,uuid,text,uuid,text,text,text)',null),
                    ('public.resolve_grok_control_intent_as_server(uuid,uuid,text,text,text)',null),
                    ('public.set_grok_session_status_as_server(uuid,uuid,text,bigint)',null),
                    ('public.record_grok_planning_failure_as_server(uuid,uuid,uuid,text,text,bigint)',null),
                    ('public.apply_grok_graph_control_as_owner(uuid,uuid,uuid,text,text,text)',null)
                  ), available as (
                    select expected.signature,to_regprocedure(expected.signature) routine_oid,
                           to_regclass(expected.trigger_relation) trigger_relation_oid
                      from expected where to_regprocedure(expected.signature) is not null
                  )
                  select 'LINTROW|'||available.signature||'|'||coalesce(finding.lineno::text,'')||'|'||coalesce(finding.level,'')||'|'||coalesce(finding.sqlstate,'')||'|'||coalesce(finding.message,'')
                    from available
                    cross join lateral extensions.plpgsql_check_function_tb(
                      available.routine_oid::regprocedure,
                      coalesce(available.trigger_relation_oid,0::oid)::regclass,
                      false,true,true,false,false,false
                    ) finding
                   where finding.level in ('error','warning','extra')
                   order by available.signature,finding.lineno,finding.position;" \
            -c "rollback;")
          if printf '%s\n' "$POST_LINT" | grep -q '^LINTROW|'; then
            echo "::error::Postflight linked-database lint found Grok release findings."
            printf '%s\n' "$POST_LINT" | grep '^LINTROW|'
            exit 1
          fi
          EXTENSION_RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_RESIDUE" != "0|0" ]; then
            echo "::error::Postflight linked-database lint left extension residue."
            exit 1
          fi

          SAFE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select not exists (select 1 from public.organizations where coalesce(autonomous_mode,false)
                     or autonomy_kill_switch_active is distinct from true
                     or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                     or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                     or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
              and not exists (select 1 from public.projects where coalesce(autonomous_mode,false)
                     or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                     or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                     or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()-interval '10 minutes')
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()+interval '1 minute')
              and not exists (select 1 from public.phase1c_workers where current_run_id is not null)
              and not exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
              and not exists (select 1 from public.agent_runs where status='running'::public.run_status);")
          if [ "$SAFE" != "t" ]; then
            echo "::error::Stopped database containment changed during postflight."
            exit 1
          fi

          SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" | jq -r '.object.sha // empty')
          if [ "$RELEASE_SHA" != "$SHA" ] || [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::Current main changed during Grok release verification."
            exit 1
          fi
          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ -z "$DEPLOYMENT" ] || ! jq -e --arg sha "$SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Latest Vercel Production identity changed during postflight."
            exit 1
          fi
          STATUS_URL=$(jq -r '.statuses_url' <<<"$DEPLOYMENT")
          STATUS=$(curl --fail --silent --show-error -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}?per_page=1")
          if ! jq -e 'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | test("^https://softwarefactory-[a-z0-9]+-surgeservices-projects\\.vercel\\.app/?$"))' <<<"$STATUS" >/dev/null; then
            echo "::error::Exact-SHA Vercel Production changed during postflight."
            exit 1
          fi
          VERCEL_DEPLOYMENT_URL=$(jq -r '.[0].environment_url | rtrimstr("/")' <<<"$STATUS")
          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if ! jq -e --arg sha "$SHA" --arg project "$PROJECT_REF" --arg deployment_url "$VERCEL_DEPLOYMENT_URL" --arg vercel_project "$VERCEL_PROJECT_ID" '
            .status=="ok" and .service=="SoftwareFactory" and .database=="reachable"
            and .databaseProject=="matched" and .databaseProjectRef==$project
            and .deployment=="matched" and .deploymentUrl==$deployment_url
            and .vercelProjectId==$vercel_project and (.vercelDeploymentId|type=="string" and test("^dpl_[A-Za-z0-9]+$"))
            and .release=="matched" and .releaseSha==$sha and .releaseRef=="main"
          ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Production health identity changed during Grok release verification."
            exit 1
          fi

          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} became active during postflight."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch or auth broker changed during postflight."
            exit 1
          fi
          echo "::notice::Scope ${SCOPE} passed exact ledger, catalog, ACL, runtime, lint, health, and stopped-safety postflight."
