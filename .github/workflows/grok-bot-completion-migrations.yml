name: Apply Grok Bot completion migrations

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Probe, apply one exact ordered completion migration, or verify both."
        required: true
        default: probe
        type: choice
        options:
          - probe
          - claim-admission-fence
          - specialist-admission-planning
          - verify
      confirm:
        description: "Type apply for a mutation scope; probe and verify are read-only."
        required: false
        default: ""
        type: string
      release_sha:
        description: "Exact lowercase 40-character SoftwareFactory main SHA already green and READY in Production."
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

concurrency:
  group: apply-hosted-migrations
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: qpuofpmagrmyamahqwxw
      MIGRATION_PROVIDER_ADMISSION: supabase/migrations/20260831000100_grok_provider_admission.sql
      MIGRATION_PROVIDER_ADMISSION_SHA256: 37809d9b3d9bc760ffbee501fcca383f0daa5665fb047964734603ceed41aef7
      MIGRATION_TRANSACTIONAL_NOTICES: supabase/migrations/20260831000700_transactional_notices.sql
      MIGRATION_TRANSACTIONAL_NOTICES_SHA256: c4c562b06d61cdf67283cefa2b0ef12b35d64d33e22398d6c71b273d000b363b
      MIGRATION_AUTOPAY_AUTHORIZATION: supabase/migrations/20260831000800_autopay_authorization.sql
      MIGRATION_AUTOPAY_AUTHORIZATION_SHA256: 41875a16a58deb6945affa24ecf0adf6493875788ef8da3a1c7cd03f98afb4b2
      MIGRATION_CLAIM_ADMISSION: supabase/migrations/20260831000900_grok_claim_admission_fence.sql
      MIGRATION_CLAIM_ADMISSION_SHA256: 7f2dc3b80e466b3c06f589ac6383fd768df847d66e02ec0cab53b8d8431ab737
      MIGRATION_SPECIALIST_PLANNING: supabase/migrations/20260831001000_grok_specialist_admission_planning.sql
      MIGRATION_SPECIALIST_PLANNING_SHA256: 728628f0368e1f715d8c786ffb536d2d3fcc3a859a177a0665a00ea98a8386f1
      PRODUCTION_HEALTH_URL: https://www.theagoras.com/api/health
      VERCEL_PROJECT_ID: prj_pAsrhftaVWI4SyaqstgRVSWHJkdD
    steps:
      - name: Authorize the exact mutation scope
        env:
          AUTHORIZED_ACTOR: ${{ vars.PRODUCTION_RELEASE_ACTOR }}
          SCOPE: ${{ inputs.scope }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$SCOPE" in
            probe|verify) exit 0 ;;
            claim-admission-fence|specialist-admission-planning) ;;
            *) echo "::error::Unknown Grok completion release scope."; exit 1 ;;
          esac
          if [ "$CONFIRM" != "apply" ]; then
            echo "::error::A mutation scope requires confirm=apply."
            exit 1
          fi
          if [ -z "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_TRIGGERING_ACTOR" != "$AUTHORIZED_ACTOR" ] \
            || [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Production mutation requires a first-attempt run by the exact configured actor; reruns are refused."
            exit 1
          fi

      - name: Check out the exact release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify exact green production and stopped execution workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [ "$RELEASE_SHA" != "$SHA" ] \
            || [ "$GITHUB_REPOSITORY" != "surgeservicesllc/SoftwareFactory" ] \
            || [ "$GITHUB_REF" != "refs/heads/main" ] \
            || [ "$GITHUB_SHA" != "$SHA" ]; then
            echo "::error::Grok completion migration requires the requested exact lowercase SHA on SoftwareFactory main."
            exit 1
          fi

          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          if [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::Current main moved away from the requested release SHA."
            exit 1
          fi

          CHECKS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
          for NAME in \
            "Lint, typecheck, test, and build" \
            "Browser and accessibility tests 1/3" \
            "Browser and accessibility tests 2/3" \
            "Browser and accessibility tests 3/3"; do
            STATE=$(jq -r --arg name "$NAME" --arg sha "$SHA" '
              [.check_runs[] | select(.name==$name and .head_sha==$sha and .app.slug=="github-actions")]
              | sort_by(.completed_at // .started_at // "") | last
              | if .==null then "missing|missing" else "\(.status)|\(.conclusion // "null")" end
            ' <<<"$CHECKS")
            if [ "$STATE" != "completed|success" ]; then
              echo "::error::Exact-head check '$NAME' is not green ($STATE)."
              exit 1
            fi
          done

          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ -z "$DEPLOYMENT" ] \
            || ! jq -e --arg sha "$SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Latest Vercel Production identity is not the exact checked-out SHA."
            exit 1
          fi
          STATUS_URL=$(jq -r '.statuses_url' <<<"$DEPLOYMENT")
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}?per_page=1")
          if ! jq -e 'length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]" and (.[0].environment_url | test("^https://softwarefactory-[a-z0-9]+-surgeservices-projects\\.vercel\\.app/?$"))' <<<"$STATUS" >/dev/null; then
            echo "::error::Exact-SHA Vercel Production is not READY."
            exit 1
          fi
          VERCEL_DEPLOYMENT_URL=$(jq -r '.[0].environment_url | rtrimstr("/")' <<<"$STATUS")

          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if ! jq -e \
            --arg sha "$SHA" \
            --arg project "$PROJECT_REF" \
            --arg deployment_url "$VERCEL_DEPLOYMENT_URL" \
            --arg vercel_project "$VERCEL_PROJECT_ID" '
            .status=="ok"
            and .service=="SoftwareFactory"
            and .database=="reachable"
            and .databaseProject=="matched"
            and .databaseProjectRef==$project
            and .deployment=="matched"
            and .deploymentUrl==$deployment_url
            and .vercelProjectId==$vercel_project
            and (.vercelDeploymentId | type=="string" and test("^dpl_[A-Za-z0-9]+$"))
            and .release=="matched"
            and .releaseSha==$sha
            and .releaseRef=="main"
          ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Public production health is not the exact release, Vercel deployment, and Supabase project."
            exit 1
          fi
          echo "EXPECTED_VERCEL_DEPLOYMENT_URL=$VERCEL_DEPLOYMENT_URL" >> "$GITHUB_ENV"
          echo "EXPECTED_VERCEL_DEPLOYMENT_ID=$(jq -r '.vercelDeploymentId' <<<"$HEALTH")" >> "$GITHUB_ENV"

          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} has ${ACTIVE} active run(s)."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch, schedule, or the AI-account auth broker is outside stopped containment."
            exit 1
          fi
          echo "::notice::Exact main SHA ${SHA} is green and READY with execution workflows stopped."

      - name: Connect to the exact Supabase project
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is required."
            exit 1
          fi
          ENC=$(node -e 'console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))')
          echo "::add-mask::$ENC"
          for HOST in aws-0-us-west-2.pooler.supabase.com aws-1-us-west-2.pooler.supabase.com; do
            URL="postgresql://postgres.${PROJECT_REF}:${ENC}@${HOST}:5432/postgres"
            echo "::add-mask::$URL"
            if psql "$URL" -v ON_ERROR_STOP=1 -X -Atqc \
              "select current_database()='postgres' and current_user='postgres' and to_regnamespace('supabase_migrations') is not null" \
              | grep -qx t; then
              echo "DB_URL=$URL" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Could not connect to exact Supabase project ${PROJECT_REF}."
          exit 1

      - name: Verify the five exact LF-normalized forward files
        run: |
          set -euo pipefail
          verify_file() {
            FILE=$1
            EXPECTED=$2
            ACTUAL=$(python3 - "$FILE" <<'PY'
          import hashlib
          import pathlib
          import sys

          content = pathlib.Path(sys.argv[1]).read_bytes()
          normalized = content.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          print(hashlib.sha256(normalized).hexdigest())
          PY
            )
            if [ ! -f "$FILE" ] \
              || [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] \
              || [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Exact LF-normalized migration identity mismatch: $FILE"
              exit 1
            fi
          }
          verify_file "$MIGRATION_PROVIDER_ADMISSION" "$MIGRATION_PROVIDER_ADMISSION_SHA256"
          verify_file "$MIGRATION_TRANSACTIONAL_NOTICES" "$MIGRATION_TRANSACTIONAL_NOTICES_SHA256"
          verify_file "$MIGRATION_AUTOPAY_AUTHORIZATION" "$MIGRATION_AUTOPAY_AUTHORIZATION_SHA256"
          verify_file "$MIGRATION_CLAIM_ADMISSION" "$MIGRATION_CLAIM_ADMISSION_SHA256"
          verify_file "$MIGRATION_SPECIALIST_PLANNING" "$MIGRATION_SPECIALIST_PLANNING_SHA256"

      - name: Verify exact ordered ledger catalog and stopped database state
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          PREFIX=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000100')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000200')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000300')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000400')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000500')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000600')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000700')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000800');")
          if [ "$PREFIX" != "1|1|1|1|1|1|1|1" ]; then
            echo "::error::The accepted 00100..00800 hosted ledger prefix is not exact (${PREFIX})."
            exit 1
          fi

          TAIL=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000900')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831001000');")
          case "$SCOPE:$TAIL" in
            probe:0\|0|probe:1\|0|probe:1\|1) ;;
            claim-admission-fence:0\|0) ;;
            specialist-admission-planning:1\|0) ;;
            verify:1\|1) ;;
            *) echo "::error::Completion ledger is not scope-exact (${SCOPE}:${TAIL})."; exit 1 ;;
          esac

          PROVIDER_READY=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            with functions as (
              select routine.*,language_row.lanname,
                     md5(replace(replace(routine.prosrc,E'\\r\\n',E'\\n'),E'\\r',E'\\n')) source_md5
                from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                join pg_language language_row on language_row.oid=routine.prolang
               where space.nspname='public'
            )
            select
              exists (
                select 1 from pg_class relation join pg_namespace space on space.oid=relation.relnamespace
                 where space.nspname='public' and relation.relname='grok_execution_admissions'
                   and relation.relkind='r' and pg_get_userbyid(relation.relowner)='postgres'
                   and relation.relrowsecurity and relation.relforcerowsecurity
                   and not has_table_privilege('anon',relation.oid,'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                   and not has_table_privilege('authenticated',relation.oid,'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
                   and not has_table_privilege('service_role',relation.oid,'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER')
              )
              and exists (
                select 1 from functions routine
                 where routine.oid=to_regprocedure('public.grok_execution_admission_hash(public.grok_execution_admissions)')
                   and pg_get_userbyid(routine.proowner)='postgres' and routine.lanname='sql'
                   and not routine.prosecdef and routine.proconfig=array['search_path=pg_catalog']::text[]
                   and routine.provolatile='i' and routine.proisstrict and routine.proparallel='s'
                   and routine.source_md5='3c2b855b41873447c738b2b220d10544'
                   and routine.proacl is not null and (select count(*) from aclexplode(routine.proacl))=1
                   and not has_function_privilege('anon',routine.oid,'EXECUTE')
                   and not has_function_privilege('authenticated',routine.oid,'EXECUTE')
                   and not has_function_privilege('service_role',routine.oid,'EXECUTE')
              )
              and exists (
                select 1 from functions routine
                 where routine.oid=to_regprocedure('public.launch_grok_full_lifecycle_v2_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb,jsonb)')
                   and pg_get_userbyid(routine.proowner)='postgres' and routine.lanname='plpgsql'
                   and routine.prosecdef and routine.proconfig=array['search_path=pg_catalog']::text[]
                   and routine.source_md5='78055b8bc6d6d44dbb1cbd6e94657a8d'
                   and routine.proacl is not null
                   and not has_function_privilege('anon',routine.oid,'EXECUTE')
                   and not has_function_privilege('authenticated',routine.oid,'EXECUTE')
                   and has_function_privilege('service_role',routine.oid,'EXECUTE')=(split_part('${TAIL}','|',2)='0')
              )
              and exists (
                select 1 from functions routine
                 where routine.oid=to_regprocedure('public.launch_grok_full_lifecycle_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb)')
                   and pg_get_userbyid(routine.proowner)='postgres' and routine.prosecdef
                   and routine.proconfig=array['search_path=pg_catalog']::text[]
                   and routine.source_md5='49438e7ef00cf0d7034e0016e75f74f8'
                   and routine.proacl is not null and (select count(*) from aclexplode(routine.proacl))=1
                   and not has_function_privilege('anon',routine.oid,'EXECUTE')
                   and not has_function_privilege('authenticated',routine.oid,'EXECUTE')
                   and not has_function_privilege('service_role',routine.oid,'EXECUTE')
              )
              and exists (select 1 from pg_constraint where conrelid='public.grok_graph_launches'::regclass and conname='grok_graph_launches_admission_scope_unique' and convalidated)
              and exists (select 1 from pg_constraint where conrelid='public.graph_nodes'::regclass and conname='graph_nodes_admission_scope_unique' and convalidated)
              and (select count(*)=2 and bool_and(tgfoid='public.reject_grok_evidence_mutation()'::regprocedure)
                     from pg_trigger where tgrelid='public.grok_execution_admissions'::regclass and not tgisinternal)
              and (select count(*)=1 from functions where proname='grok_execution_admission_hash')
              and (select count(*)=1 from functions where proname='launch_grok_full_lifecycle_v2_as_server');")
          if [ "$PROVIDER_READY" != "t" ]; then
            echo "::error::Accepted provider-admission ledger and exact catalog/ACL identity disagree."
            exit 1
          fi

          CLAIM_OBJECTS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (to_regclass('public.grok_phase1c_submission_guards') is not null)::integer||'|'||
              (select count(*) from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                where space.nspname='public' and routine.proname in (
                  'grok_current_execution_admission_hash','assert_current_grok_execution_admissions','grok_execution_admission_projection',
                  'attach_current_grok_admissions_to_claim','claim_planned_graph_v3',
                  'claim_planned_graph_by_id_v3','attach_current_grok_admission_to_phase1c_claim',
                  'is_current_grok_phase1c_submission_authorized','validate_current_grok_phase1c_command_route',
                  'current_grok_phase1c_claim_route',
                  'claim_phase1c_run_v3','claim_phase1c_run_by_command_v3',
                  'read_grok_execution_credential_as_worker','apply_grok_graph_control_v2_as_owner',
                  'set_graph_pause_as_member_v2','assert_grok_graph_admission_as_member'));")
          SPECIALIST_OBJECTS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (to_regclass('public.grok_specialist_admissions') is not null)::integer||'|'||
              (select count(*) from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                where space.nspname='public' and routine.proname in (
                  'grok_specialist_admission_hash','normalize_grok_role_capabilities','record_grok_specialist_roster_v1_as_server',
                  'grok_execution_admission_hash_v2','launch_grok_full_lifecycle_v3_as_server'));")
          case "$TAIL:$CLAIM_OBJECTS:$SPECIALIST_OBJECTS" in
            0\|0:0\|0:0\|0) ;;
            1\|0:1\|16:0\|0) ;;
            1\|1:1\|16:1\|5) ;;
            *) echo "::error::Completion ledger and catalog presence disagree (${TAIL}:${CLAIM_OBJECTS}:${SPECIALIST_OBJECTS})."; exit 1 ;;
          esac

          SAFE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              not exists (
                select 1 from public.organizations
                 where coalesce(autonomous_mode,false)
                    or autonomy_kill_switch_active is distinct from true
                    or coalesce(auto_plan,false) or coalesce(auto_code,false)
                    or coalesce(auto_test,false) or coalesce(auto_repair,false)
                    or coalesce(auto_review,false) or coalesce(auto_approve,false)
                    or coalesce(auto_merge,false) or coalesce(auto_deploy,false)
                    or coalesce(auto_rollback,false)
              )
              and not exists (
                select 1 from public.projects
                 where coalesce(autonomous_mode,false)
                    or coalesce(auto_plan,false) or coalesce(auto_code,false)
                    or coalesce(auto_test,false) or coalesce(auto_repair,false)
                    or coalesce(auto_review,false) or coalesce(auto_approve,false)
                    or coalesce(auto_merge,false) or coalesce(auto_deploy,false)
                    or coalesce(auto_rollback,false)
              )
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at > now()-interval '10 minutes')
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at > now()+interval '1 minute')
              and not exists (select 1 from public.phase1c_workers where current_run_id is not null)
              and not exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
              and not exists (select 1 from public.agent_runs where status='running'::public.run_status);")
          if [ "$SAFE" != "t" ]; then
            echo "::error::Autonomy, automatic actions, kill switch, worker, or runtime state is outside stopped containment."
            exit 1
          fi
          echo "::notice::Completion ledger ${TAIL}, prerequisite catalog, and stopped containment are exact."

      - name: Apply exactly one ordered forward completion migration
        if: ${{ inputs.scope == 'claim-admission-fence' || inputs.scope == 'specialist-admission-planning' }}
        env:
          SCOPE: ${{ inputs.scope }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          if [ "$RELEASE_SHA" != "$SHA" ] || [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::Current repository main changed before the protected database mutation."
            exit 1
          fi

          case "$SCOPE" in
            claim-admission-fence)
              FILE=$MIGRATION_CLAIM_ADMISSION
              EXPECTED=$MIGRATION_CLAIM_ADMISSION_SHA256
              VERSION=20260831000900
              E009=0
              E010=0
              SCOPE_LOCKS="
                lock table public.graphs,public.graph_nodes,public.grok_graph_launches,
                  public.grok_execution_admissions,public.graph_phase1c_bridges,
                  public.bot_assignments,public.bots,public.bot_roles,
                  public.ai_accounts,public.provider_credentials in share mode;"
              CATALOG_GUARD="do \$guard\$ begin
