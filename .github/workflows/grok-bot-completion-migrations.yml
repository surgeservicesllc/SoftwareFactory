              CATALOG_GUARD="do \$guard\$ begin
                if to_regclass('public.grok_specialist_admissions') is not null
                  or exists (select 1 from pg_attribute where attrelid='public.grok_execution_admissions'::regclass and attname='specialist_admission_id' and not attisdropped)
                  or exists (select 1 from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                    where space.nspname='public' and routine.proname in (
