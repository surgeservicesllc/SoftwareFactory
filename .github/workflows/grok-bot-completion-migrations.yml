                    ('public.claim_planned_graph_by_id_v2(text,text[],text,jsonb,uuid,integer)','5cecdf559c1a11871099a7e2bf4cd886','service_role'),
                    ('public.claim_phase1c_run_v2(text,text,text,integer,integer)','0345216c9a2eaa720e3517b3b0fa288c','service_role'),
                    ('public.claim_phase1c_run_by_command_v2(text,text,text,integer,uuid,integer)','ce46fadd9962d960d8e885be0e2d7b4c','service_role'),
                    ('public.apply_grok_graph_control_as_owner(uuid,uuid,uuid,text,text,text)','2b0ea737ac99b22570ddbfdd4c583eeb','authenticated'),
