              end \$guard\$;"
              ;;
          esac

          STAGE_DIR=$(mktemp -d)
          trap 'rm -rf -- "$STAGE_DIR"' EXIT
          STAGED_FILE="$STAGE_DIR/$(basename "$FILE")"
          python3 - "$FILE" "$STAGED_FILE" <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          pathlib.Path(sys.argv[2]).write_bytes(
              source.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          )
          PY
          if [ "$(sha256sum "$STAGED_FILE" | cut -d' ' -f1)" != "$EXPECTED" ] \
            || [ "$(find "$STAGE_DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')" != "1" ]; then
            echo "::error::Exact one-file LF-normalized staging failed."
            exit 1
          fi

          EXTENSION_BASELINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_BASELINE" != "0|0" ]; then
            echo "::error::plpgsql_check residue existed before linked-database rehearsal."
            exit 1
          fi

          LINT_FINDINGS=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -c "begin; set local statement_timeout='10min';" \
            -c "$CATALOG_GUARD" \
            -f "$STAGED_FILE" \
            -c "create extension if not exists plpgsql_check with schema extensions;" \
            -c "with expected(signature) as (values
                    ('public.grok_current_execution_admission_hash(public.grok_execution_admissions)'),
                    ('public.assert_current_grok_execution_admissions(uuid)'),
                    ('public.grok_execution_admission_projection(public.grok_execution_admissions)'),
                    ('public.attach_current_grok_admissions_to_claim(jsonb)'),
                    ('public.claim_planned_graph_v3(text,text[],text,jsonb,integer)'),
                    ('public.claim_planned_graph_by_id_v3(text,text[],text,jsonb,uuid,integer)'),
                    ('public.attach_current_grok_admission_to_phase1c_claim(jsonb)'),
                    ('public.claim_phase1c_run_v3(text,text,text,integer,integer)'),
                    ('public.claim_phase1c_run_by_command_v3(text,text,text,integer,uuid,integer)'),
                    ('public.read_grok_execution_credential_as_worker(uuid,uuid,text)'),
                    ('public.apply_grok_graph_control_v2_as_owner(uuid,uuid,uuid,text,text,text)'),
                    ('public.set_graph_pause_as_member_v2(uuid,uuid,boolean)'),
                    ('public.assert_grok_graph_admission_as_member(uuid,uuid)'),
                    ('public.grok_specialist_admission_hash(public.grok_specialist_admissions)'),
                    ('public.normalize_grok_role_capabilities(jsonb)'),
                    ('public.record_grok_specialist_roster_v1_as_server(uuid,uuid,uuid,uuid,uuid,text,bigint)'),
                    ('public.grok_execution_admission_hash_v2(public.grok_execution_admissions)'),
                    ('public.launch_grok_full_lifecycle_v3_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb,text,jsonb)')
                  ), available as (
                    select expected.signature,routine.oid routine_oid
                      from expected
                      join pg_proc routine on routine.oid=to_regprocedure(expected.signature)
                      join pg_language language_row on language_row.oid=routine.prolang
                     where language_row.lanname='plpgsql'
                  )
                  select 'LINTROW|'||available.signature||'|'||coalesce(finding.lineno::text,'')||'|'||coalesce(finding.level,'')||'|'||coalesce(finding.sqlstate,'')||'|'||coalesce(finding.message,'')
                    from available
                    cross join lateral extensions.plpgsql_check_function_tb(
                      available.routine_oid::regprocedure,0::oid::regclass,
                      false,true,true,false,false,false
                    ) finding
                   where finding.level in ('error','warning','extra')
                   order by available.signature,finding.lineno,finding.position;" \
            -c "rollback;")
          if printf '%s\n' "$LINT_FINDINGS" | grep -q '^LINTROW|'; then
            echo "::error::Transactional linked-database lint found completion-function findings."
            printf '%s\n' "$LINT_FINDINGS" | grep '^LINTROW|'
            exit 1
          fi
          EXTENSION_RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_RESIDUE" != "0|0" ]; then
            echo "::error::Transactional linked-database lint left extension residue."
            exit 1
          fi

          psql "$DB_URL" -v ON_ERROR_STOP=1 -X --single-transaction -q \
            -c "set local lock_timeout='15s';
                set local statement_timeout='10min';
                lock table supabase_migrations.schema_migrations in share row exclusive mode;
                lock table public.organizations,public.projects,public.phase1c_workers,
                  public.graph_runs,public.agent_runs in share mode;
                do \$locked\$
                begin
                  if (select count(*) from supabase_migrations.schema_migrations where version='20260831000100')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000200')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000300')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000400')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000500')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000600')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000700')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000800')<>1
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831000900')<>${E009}
                    or (select count(*) from supabase_migrations.schema_migrations where version='20260831001000')<>${E010}
                  then raise exception 'locked Grok completion ledger changed'; end if;
                  if exists (select 1 from public.organizations where coalesce(autonomous_mode,false)
                      or autonomy_kill_switch_active is distinct from true
                      or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                      or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                      or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
                    or exists (select 1 from public.projects where coalesce(autonomous_mode,false)
                      or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                      or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                      or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
                    or exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()-interval '10 minutes')
                    or exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()+interval '1 minute')
                    or exists (select 1 from public.phase1c_workers where current_run_id is not null)
                    or exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
                    or exists (select 1 from public.agent_runs where status='running'::public.run_status)
                  then raise exception 'locked Grok completion safety state changed'; end if;
                end \$locked\$;" \
            -c "$SCOPE_LOCKS" \
            -c "$CATALOG_GUARD" \
            -f "$STAGED_FILE" \
            -c "insert into supabase_migrations.schema_migrations(version) values ('${VERSION}');"

      - name: Reload the PostgREST schema cache
        if: ${{ inputs.scope == 'claim-admission-fence' || inputs.scope == 'specialist-admission-planning' }}
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -X -c "NOTIFY pgrst, 'reload schema';"

      - name: Verify exact completion catalog ACL runtime lint and stopped safety
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          PREFIX=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000100')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000200')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000300')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000400')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000500')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000600')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000700')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000800');")
          if [ "$PREFIX" != "1|1|1|1|1|1|1|1" ]; then
            echo "::error::Postflight accepted 00100..00800 ledger prefix changed (${PREFIX})."
            exit 1
          fi
          TAIL=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              (select count(*) from supabase_migrations.schema_migrations where version='20260831000900')||'|'||
              (select count(*) from supabase_migrations.schema_migrations where version='20260831001000');")
          case "$SCOPE:$TAIL" in
            probe:0\|0|probe:1\|0|probe:1\|1) ;;
            claim-admission-fence:1\|0) ;;
            specialist-admission-planning:1\|1) ;;
            verify:1\|1) ;;
            *) echo "::error::Completion postflight ledger is not scope-exact (${SCOPE}:${TAIL})."; exit 1 ;;
          esac

          if [ "$TAIL" = "0|0" ]; then
            PRISTINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
              select
                not exists (select 1 from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                  where space.nspname='public' and routine.proname in (
                    'grok_current_execution_admission_hash','assert_current_grok_execution_admissions',
                    'grok_execution_admission_projection','attach_current_grok_admissions_to_claim',
