                    ('public.grok_current_execution_admission_hash(public.grok_execution_admissions)','5d3611423811e3609dd9f2fc3f2f981a','sql',false,'i','none',null),
                    ('public.assert_current_grok_execution_admissions(uuid)','b5dc9166e99634eaa409801055a27d4b','plpgsql',true,'v','none',null),
                    ('public.grok_execution_admission_projection(public.grok_execution_admissions)','a85f407323a331e54d8d16123c46281f','sql',false,'i','none',null),
                    ('public.attach_current_grok_admissions_to_claim(jsonb)','427294dac55a06b5ca1f9a1c89b0cdfa','plpgsql',true,'v','none',null),
                    ('public.claim_planned_graph_v3(text,text[],text,jsonb,integer)','4a6da8bed8d1fdda17f11df00d549817','plpgsql',true,'v','service_role',null),
                    ('public.claim_planned_graph_by_id_v3(text,text[],text,jsonb,uuid,integer)','f83873aa19703d2c61553026d4141a4c','plpgsql',true,'v','service_role',null),
                    ('public.attach_current_grok_admission_to_phase1c_claim(jsonb)','48f84aba274b2e6316331de8e3fca796','plpgsql',true,'v','none',null),
                    ('public.is_current_grok_phase1c_submission_authorized(uuid,uuid,text,jsonb)','9878cd04b1d77710cdea3a346e03978f','plpgsql',true,'v','none',null),
                    ('public.normalize_phase1c_command()','c788b5e2a450a2f061dba63697c10651','plpgsql',true,'v','none',null),
                    ('public.plan_phase1c_task_and_run()','4ace11525e1e5dacf07f97ed638fffe9','plpgsql',true,'v','none',null),
                    ('public.submit_command(uuid,text,public.risk_level,jsonb,text)','dda8c6c952852557e13009d0c0e6d26d','plpgsql',true,'v','authenticated','Persists legacy fixed manual Codex commands and exact current Grok Phase 1C OpenAI commands only through a private one-use bridge admission. Reserved capability fields never persist.'),
                    ('public.validate_current_grok_phase1c_command_route(uuid,uuid,uuid,uuid,text,jsonb)','db18ecc80459735c05ceea87eae233dc','plpgsql',true,'v','none',null),
                    ('public.attach_graph_phase1c_command_for_approved_gate(uuid,uuid,uuid)','3c4b38576896b0867336771a0bab23d2','plpgsql',true,'v','none','Privately attaches an owner-approved command/task pair. Grok bridges revalidate the exact current implementation admission and provider/model; legacy bridges retain the fixed Codex contract.'),
                    ('public.queue_phase1c_run_for_task()','92238f58e7abbab0ec3c883293394e6b','plpgsql',true,'v','none','Queues a run only for legacy fixed Codex execution or an exact current Grok Phase 1C OpenAI admission. Record-only work never creates a run, and delayed Grok queueing revalidates admission.'),
                    ('public.submit_and_attach_graph_phase1c_command(uuid,jsonb)','eabe7aea908e4475fe4f89d0480e4826','plpgsql',true,'v','authenticated','Atomically derives approved architecture identity, revalidates current Grok admissions, canonicalizes the exact admitted Phase 1C OpenAI model, records and queues without dispatching a worker, consumes its private guard, and attaches the command. Non-Grok bridges retain the reviewed fixed model.'),
                    ('public.claim_phase1c_run_target_budget_internal(text,text,text,integer,uuid)','2e25eefc2d119d54449a3bbe6a9e413f','plpgsql',true,'v','none',null),
                    ('public.current_grok_phase1c_claim_route(uuid)','b0b70d6a53f60006c104ba46a1043f92','plpgsql',true,'v','none',null),
                    ('public.claim_phase1c_run_target_internal(text,text,text,integer,uuid)','77d940d7d9be73dadd06d7f12fe0528c','plpgsql',true,'v','none',null),
                    ('public.claim_phase1c_run_budget_internal(text,text,text,integer)','00cf400d3eba41e5d5b0ca74586a9234','plpgsql',true,'v','none',null),
                    ('public.claim_phase1c_run_v3(text,text,text,integer,integer)','ef8803cb5ec809266b8fdf6f048b1a2f','plpgsql',true,'v','service_role',null),
                    ('public.claim_phase1c_run_by_command_v3(text,text,text,integer,uuid,integer)','14c204c6c9d8da1ed6038d0f56942be8','plpgsql',true,'v','service_role',null),
                    ('public.read_grok_execution_credential_as_worker(uuid,uuid,text)','28124a10dd724bbc09bae2e2d37e9069','plpgsql',true,'v','service_role',null),
                    ('public.apply_grok_graph_control_v2_as_owner(uuid,uuid,uuid,text,text,text)','33742a47dbacb81f9d18d5381b78287d','plpgsql',true,'v','authenticated',null),
                    ('public.set_graph_pause_as_member_v2(uuid,uuid,boolean)','fc9d4fbf5474a296e368cb7e3aba0755','plpgsql',true,'v','authenticated',null),
                    ('public.assert_grok_graph_admission_as_member(uuid,uuid)','93b62aff4f3f1cf0721861058cd20f52','plpgsql',true,'v','authenticated',null)
                  ), state as (
                    select expected.*,routine.oid,routine.proowner,routine.prosecdef,routine.proconfig,routine.proacl,routine.provolatile,
                           language_row.lanname,
                           md5(replace(replace(routine.prosrc,E'\\r\\n',E'\\n'),E'\\r',E'\\n')) actual_source_md5
                      from expected left join pg_proc routine on routine.oid=to_regprocedure(expected.signature)
                      left join pg_language language_row on language_row.oid=routine.prolang
                  )
                  select count(oid)=25 and count(distinct oid)=25 and bool_and(
                    pg_get_userbyid(proowner)='postgres' and prosecdef=security_definer
                    and lanname=language_name and provolatile=volatility
                    and proconfig=array['search_path=pg_catalog']::text[]
                    and actual_source_md5=source_md5 and proacl is not null
                    and (object_comment is null or obj_description(oid,'pg_proc')=object_comment)
                    and (select count(*) from aclexplode(proacl))=case when execute_role='none' then 1 else 2 end
                    and not exists (select 1 from aclexplode(proacl) acl
                      where acl.grantor<>proowner or acl.privilege_type<>'EXECUTE' or acl.is_grantable
                         or acl.grantee not in (proowner,case execute_role
                           when 'service_role' then to_regrole('service_role')::oid
                           when 'authenticated' then to_regrole('authenticated')::oid else proowner end))
                    and not has_function_privilege('anon',oid,'EXECUTE')
