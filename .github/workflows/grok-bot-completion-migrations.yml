                and not exists (select conname from pg_constraint where conrelid='public.grok_specialist_admissions'::regclass and contype<>'n' except
                  select name from expected_constraint)
                and (select count(*)=24 and bool_and(convalidated) from pg_constraint
                  where conrelid='public.grok_specialist_admissions'::regclass and contype<>'n')
                and not exists (select name from expected_index except
                  select index_relation.relname from pg_index index_row join pg_class index_relation on index_relation.oid=index_row.indexrelid
                   where index_row.indrelid='public.grok_specialist_admissions'::regclass)
                and not exists (select index_relation.relname from pg_index index_row join pg_class index_relation on index_relation.oid=index_row.indexrelid
                   where index_row.indrelid='public.grok_specialist_admissions'::regclass except select name from expected_index)
                and (select count(*)=6 and bool_and(indisvalid and indisready and indislive) from pg_index where indrelid='public.grok_specialist_admissions'::regclass)
                and exists (select 1 from pg_attribute where attrelid='public.grok_execution_admissions'::regclass
                  and attname='specialist_admission_id' and atttypid='uuid'::regtype and not attnotnull and not atthasdef and not attisdropped)
                and exists (select 1 from pg_constraint where conrelid='public.grok_execution_admissions'::regclass
                  and conname='grok_execution_admissions_specialist_fk' and contype='f' and convalidated
                  and confrelid='public.grok_specialist_admissions'::regclass)
                and exists (select 1 from pg_index index_row join pg_class index_relation on index_relation.oid=index_row.indexrelid
                  where index_row.indrelid='public.grok_execution_admissions'::regclass
                    and index_relation.relname='grok_execution_admissions_specialist_idx'
                    and index_row.indisvalid and index_row.indisready and index_row.indislive
                    and pg_get_expr(index_row.indpred,index_row.indrelid)='(specialist_admission_id IS NOT NULL)')
                and (select count(oid)=5 and count(distinct oid)=5 and bool_and(
                  pg_get_userbyid(proowner)='postgres' and lanname=language_name
                  and prosecdef=(execute_role='service_role') and provolatile=volatility
                  and proisstrict=is_strict and proparallel=parallel_mode
                  and proconfig=array['search_path=pg_catalog']::text[] and actual_source_md5=source_md5
                  and proacl is not null and (select count(*) from aclexplode(proacl))=case when execute_role='none' then 1 else 2 end
                  and not exists (select 1 from aclexplode(proacl) acl
                    where acl.grantor<>proowner or acl.privilege_type<>'EXECUTE' or acl.is_grantable
                       or acl.grantee not in (proowner,case execute_role when 'service_role' then to_regrole('service_role')::oid else proowner end))
                  and not has_function_privilege('anon',oid,'EXECUTE')
                  and not has_function_privilege('authenticated',oid,'EXECUTE')
                  and has_function_privilege('service_role',oid,'EXECUTE')=(execute_role='service_role')
                ) from function_state)
                and (select count(*)=5 from pg_proc routine join pg_namespace space on space.oid=routine.pronamespace
                  where space.nspname='public' and routine.proname in (
                    'grok_specialist_admission_hash','normalize_grok_role_capabilities',
                    'record_grok_specialist_roster_v1_as_server','grok_execution_admission_hash_v2',
                    'launch_grok_full_lifecycle_v3_as_server'))
                and not has_function_privilege('service_role','public.launch_grok_full_lifecycle_v2_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb,jsonb)','EXECUTE')
                and has_function_privilege('service_role','public.launch_grok_full_lifecycle_v3_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb,text,jsonb)','EXECUTE');")
            if [ "$SPECIALIST_READY" != "t" ]; then
              echo "::error::Specialist table, constraint, index, trigger, function, source, or ACL postflight failed."
              exit 1
            fi
          fi

          if [ "$TAIL" != "0|0" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q \
              -c "begin;" \
              -c "do \$runtime\$
                  declare v_json jsonb;
                  begin
                    begin perform public.assert_current_grok_execution_admissions(gen_random_uuid());
                      raise exception 'missing-graph assertion did not refuse';
                    exception when sqlstate 'P0002' then
                      if sqlerrm<>'grok admission graph not found' then raise; end if;
                    end;
                    begin perform public.claim_planned_graph_v3('grok-release-probe',array['MODEL'],'surgeservicesllc/SoftwareFactory','[]'::jsonb,2);
                      raise exception 'graph v3 protocol fence did not refuse';
                    exception when sqlstate '0A000' then null; end;
                    begin perform public.claim_planned_graph_by_id_v3('grok-release-probe',array['MODEL'],'surgeservicesllc/SoftwareFactory','[]'::jsonb,gen_random_uuid(),2);
                      raise exception 'target graph v3 protocol fence did not refuse';
                    exception when sqlstate '0A000' then null; end;
                    begin perform public.claim_phase1c_run_v3('grok-release-probe','openai','gpt-release-probe',60,2);
                      raise exception 'Phase 1C v3 protocol fence did not refuse';
                    exception when sqlstate '0A000' then null; end;
                    begin perform public.claim_phase1c_run_by_command_v3('grok-release-probe','openai','gpt-release-probe',60,gen_random_uuid(),2);
                      raise exception 'target Phase 1C v3 protocol fence did not refuse';
                    exception when sqlstate '0A000' then null; end;
                    begin perform public.read_grok_execution_credential_as_worker(gen_random_uuid(),gen_random_uuid(),repeat('0',64));
                      raise exception 'credential admission identity did not refuse';
                    exception when sqlstate '42501' then null; end;
                    if '${TAIL}'='1|1' then
                      v_json:=public.normalize_grok_role_capabilities('[\"*\"]'::jsonb);
                      if jsonb_array_length(v_json)<>12 or v_json @> '[\"*\"]'::jsonb then
                        raise exception 'wildcard normalization drifted';
                      end if;
                      if public.normalize_grok_role_capabilities('[\"unknown\"]'::jsonb)<>'[]'::jsonb then
                        raise exception 'unknown capability normalization drifted';
                      end if;
                      begin perform public.record_grok_specialist_roster_v1_as_server(null,null,null,null,null,null,null);
                        raise exception 'invalid specialist roster did not refuse';
                      exception when sqlstate '22023' then null; end;
                      begin perform public.launch_grok_full_lifecycle_v3_as_server(
                        null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null);
                        raise exception 'invalid v3 launch did not refuse';
                      exception when sqlstate '22023' then null; end;
                    end if;
                  end \$runtime\$;" \
              -c "rollback;"
          fi

          EXTENSION_BASELINE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_BASELINE" != "0|0" ]; then
            echo "::error::plpgsql_check residue existed before postflight lint."
            exit 1
          fi
          POST_LINT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq \
            -c "begin; create extension if not exists plpgsql_check with schema extensions;" \
            -c "with expected(signature) as (values
                    ('public.grok_current_execution_admission_hash(public.grok_execution_admissions)'),
                    ('public.assert_current_grok_execution_admissions(uuid)'),
                    ('public.grok_execution_admission_projection(public.grok_execution_admissions)'),
                    ('public.attach_current_grok_admissions_to_claim(jsonb)'),
                    ('public.claim_planned_graph_v3(text,text[],text,jsonb,integer)'),
                    ('public.claim_planned_graph_by_id_v3(text,text[],text,jsonb,uuid,integer)'),
                    ('public.attach_current_grok_admission_to_phase1c_claim(jsonb)'),
                    ('public.claim_phase1c_run_v3(text,text,text,integer,integer)'),
                    ('public.claim_phase1c_run_by_command_v3(text,text,text,integer,uuid,integer)'),
                    ('public.read_grok_execution_credential_as_worker(uuid,uuid,text)'),
                    ('public.apply_grok_graph_control_v2_as_owner(uuid,uuid,uuid,text,text,text)'),
                    ('public.set_graph_pause_as_member_v2(uuid,uuid,boolean)'),
                    ('public.assert_grok_graph_admission_as_member(uuid,uuid)'),
                    ('public.grok_specialist_admission_hash(public.grok_specialist_admissions)'),
                    ('public.normalize_grok_role_capabilities(jsonb)'),
                    ('public.record_grok_specialist_roster_v1_as_server(uuid,uuid,uuid,uuid,uuid,text,bigint)'),
                    ('public.grok_execution_admission_hash_v2(public.grok_execution_admissions)'),
                    ('public.launch_grok_full_lifecycle_v3_as_server(uuid,uuid,uuid,uuid,uuid,text,text,public.graph_topology,jsonb,public.risk_level,boolean,jsonb,jsonb,jsonb,uuid,text,text,jsonb,text,jsonb)')
                  ), available as (
                    select expected.signature,routine.oid routine_oid
                      from expected
                      join pg_proc routine on routine.oid=to_regprocedure(expected.signature)
                      join pg_language language_row on language_row.oid=routine.prolang
                     where language_row.lanname='plpgsql'
                  )
                  select 'LINTROW|'||available.signature||'|'||coalesce(finding.lineno::text,'')||'|'||coalesce(finding.level,'')||'|'||coalesce(finding.sqlstate,'')||'|'||coalesce(finding.message,'')
                    from available
                    cross join lateral extensions.plpgsql_check_function_tb(
                      available.routine_oid::regprocedure,0::oid::regclass,
                      false,true,true,false,false,false
                    ) finding
                   where finding.level in ('error','warning','extra')
                   order by available.signature,finding.lineno,finding.position;" \
            -c "rollback;")
          if printf '%s\n' "$POST_LINT" | grep -q '^LINTROW|'; then
            echo "::error::Postflight linked-database lint found completion-function findings."
            printf '%s\n' "$POST_LINT" | grep '^LINTROW|'
            exit 1
          fi
          EXTENSION_RESIDUE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atq -F '|' -c "
            select count(*) filter (where extension_row.oid is not null),
                   count(*) filter (where routine.oid is not null)
              from (values (1)) seed(value)
              left join pg_extension extension_row on extension_row.extname='plpgsql_check'
              left join pg_proc routine on routine.proname like 'plpgsql_check_function%';")
          if [ "$EXTENSION_RESIDUE" != "0|0" ]; then
            echo "::error::Postflight lint left extension residue."
            exit 1
          fi

          SAFE=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -Atqc "
            select
              not exists (select 1 from public.organizations where coalesce(autonomous_mode,false)
                or autonomy_kill_switch_active is distinct from true
                or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
              and not exists (select 1 from public.projects where coalesce(autonomous_mode,false)
                or coalesce(auto_plan,false) or coalesce(auto_code,false) or coalesce(auto_test,false)
                or coalesce(auto_repair,false) or coalesce(auto_review,false) or coalesce(auto_approve,false)
                or coalesce(auto_merge,false) or coalesce(auto_deploy,false) or coalesce(auto_rollback,false))
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()-interval '10 minutes')
              and not exists (select 1 from public.phase1c_workers where last_heartbeat_at>now()+interval '1 minute')
              and not exists (select 1 from public.phase1c_workers where current_run_id is not null)
              and not exists (select 1 from public.graph_runs where state='RUNNING'::public.graph_run_state)
              and not exists (select 1 from public.agent_runs where status='running'::public.run_status);")
          if [ "$SAFE" != "t" ]; then
            echo "::error::Completion postflight left the database outside stopped containment."
            exit 1
          fi
          echo "::notice::Scope ${SCOPE} passed exact ledger, catalog, ACL, rollback runtime, lint, and stopped-safety postflight."

      - name: Reverify exact production health and stopped execution workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHASE1C_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_PHASE1C_WORKER_ENABLED }}
          GRAPH_WORKER_ENABLED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_ENABLED }}
          GRAPH_WORKER_SCHEDULED: ${{ vars.SOFTWAREFACTORY_GRAPH_WORKER_SCHEDULED }}
          AUTH_BROKER_DISABLED: ${{ vars.SOFTWAREFACTORY_AUTH_BROKER_DISABLED }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          CURRENT_MAIN_SHA=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -r '.object.sha // empty')
          if [ "$RELEASE_SHA" != "$SHA" ] || [ "$CURRENT_MAIN_SHA" != "$SHA" ]; then
            echo "::error::SoftwareFactory main identity changed during completion postflight."
            exit 1
          fi

          CHECKS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")
          for NAME in \
            "Lint, typecheck, test, and build" \
            "Browser and accessibility tests 1/3" \
            "Browser and accessibility tests 2/3" \
            "Browser and accessibility tests 3/3"; do
            STATE=$(jq -r --arg name "$NAME" --arg sha "$SHA" '
              [.check_runs[] | select(.name==$name and .head_sha==$sha and .app.slug=="github-actions")]
              | sort_by(.completed_at // .started_at // "") | last
              | if .==null then "missing|missing" else "\(.status)|\(.conclusion // "null")" end
            ' <<<"$CHECKS")
            if [ "$STATE" != "completed|success" ]; then
              echo "::error::Exact-head check '$NAME' changed during postflight ($STATE)."
              exit 1
            fi
          done

          DEPLOYMENT=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/deployments?environment=Production&per_page=100" \
            | jq -c '[.[] | select(.environment=="Production" and .task=="deploy" and .creator.login=="vercel[bot]")][0] // empty')
          if [ -z "$DEPLOYMENT" ] \
            || ! jq -e --arg sha "$SHA" '.sha==$sha and (.ref==$sha or .ref=="main")' <<<"$DEPLOYMENT" >/dev/null; then
            echo "::error::Latest Vercel Production identity changed during postflight."
            exit 1
          fi
          STATUS_URL=$(jq -r '.statuses_url' <<<"$DEPLOYMENT")
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${STATUS_URL}?per_page=1")
          if ! jq -e --arg expected "$EXPECTED_VERCEL_DEPLOYMENT_URL" '
            length==1 and .[0].state=="success" and .[0].creator.login=="vercel[bot]"
            and (.[0].environment_url | rtrimstr("/"))==$expected
          ' <<<"$STATUS" >/dev/null; then
            echo "::error::Exact READY Vercel deployment changed during postflight."
            exit 1
          fi

          HEALTH=$(curl --fail --silent --show-error --max-time 20 --retry 2 "$PRODUCTION_HEALTH_URL")
          if ! jq -e \
            --arg sha "$SHA" \
            --arg project "$PROJECT_REF" \
            --arg deployment_url "$EXPECTED_VERCEL_DEPLOYMENT_URL" \
            --arg deployment_id "$EXPECTED_VERCEL_DEPLOYMENT_ID" \
            --arg vercel_project "$VERCEL_PROJECT_ID" '
            .status=="ok"
            and .service=="SoftwareFactory"
            and .database=="reachable"
            and .databaseProject=="matched"
            and .databaseProjectRef==$project
            and .deployment=="matched"
            and .deploymentUrl==$deployment_url
            and .vercelDeploymentId==$deployment_id
            and .vercelProjectId==$vercel_project
            and .release=="matched"
            and .releaseSha==$sha
            and .releaseRef=="main"
          ' <<<"$HEALTH" >/dev/null; then
            echo "::error::Exact production health identity changed during completion postflight."
            exit 1
          fi

          for WORKFLOW in graph-worker.yml codex-worker.yml claude-worker.yml auth-broker.yml graph-live-canary.yml handoff-canary.yml graph-artifact-containment.yml e2e-test-data.yml journey-prod-user.yml; do
            ACTIVE=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=100" \
              | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$ACTIVE" != "0" ]; then
              echo "::error::${WORKFLOW} changed to ${ACTIVE} active run(s) during postflight."
              exit 1
            fi
          done
          if [ "${PHASE1C_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_ENABLED,,}" = "true" ] \
            || [ "${GRAPH_WORKER_SCHEDULED,,}" = "true" ] \
            || [ "${AUTH_BROKER_DISABLED,,}" != "true" ]; then
            echo "::error::A worker switch, schedule, or the auth broker changed during postflight."
            exit 1
          fi
          echo "::notice::Exact release, READY deployment, health, CI, and stopped execution state survived completion postflight."
