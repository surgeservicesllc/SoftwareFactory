name: AI Factory live journey

# The nine-step guided journey at /solutions/ai-factory, driven in a real
# browser against a real Supabase stack (supabase start: real Postgres carrying
# the full migration chain, real PostgREST, real GoTrue) with the production
# Next build in front — tests/e2e/ai-factory-journey.spec.ts.
#
# The ordinary suite runs this page against the component harness, whose fixture
# server stands in for Supabase. That is what makes the width sweep possible and
# what makes it blind to whether the page is wired to anything. This lane closes
# that gap on a cadence.
#
# Step 1 (Connect Repository) is seeded rather than performed: installing a
# GitHub App is a real account action against github.com. The seed records what
# that installation would have recorded and nothing further.
#
# No deployment, no production credentials, no provider usage: everything is
# local to the runner, and the only keys involved are the Supabase CLI's public
# local-development defaults.
#
# Remote mode (owner-directed): dispatching with base_url set skips the local
# stack entirely and drives the deployed site with the named fake account —
# the same pattern the Job Seeker lane uses. By default it runs the signed-in
# read half only: step 1 cannot be seeded on a deployed target, because
# nothing here has write access to a hosted database and nothing should. What
# that proves is the half a deployment can regress on its own — a real session
# against the real edge, and nine live reads rendering the journey rather
# than a gate or an unreadable snapshot.
#
# Once somebody installs the GitHub App on that fake account's workspace,
# step 1 is genuinely done and the rest of the walk can run there too: tick
# walk_all_steps. That writes real rows — a project, a pipeline selection, a
# bot, a command — into that account's own workspace, with fake data. It is
# owner-directed for exactly that reason, and it is the only path by which
# anything in this repository writes to production.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Remote target (e.g. https://www.theagoras.com). Empty = provision a local stack."
        required: false
        type: string
        default: ""
      email:
        description: "Fake journey account email (remote mode)"
        required: false
        type: string
        default: "jordan.seeker.prod1@example.org"
      password:
        description: "Fake journey account password (remote mode; throwaway test identity)"
        required: false
        type: string
        default: "fake-data-journey-2026x"
      walk_all_steps:
        description: >-
          Remote mode only. Tick this once the GitHub App is installed on the
          fake account's workspace, so step 1 is genuinely done and the
          nine-step walk can run against the deployed site. It writes real
          rows to that account's own workspace with fake data. Leave unticked
          and only the signed-in read runs.
        required: false
        type: boolean
        default: false
  schedule:
    # Daily, clear of the other scheduled lanes.
    - cron: "53 8 * * *"

permissions:
  contents: read

concurrency:
  group: ai-factory-journey
  cancel-in-progress: false

jobs:
  journey:
    name: Fake-data journey (local stack, or a deployed target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        # Bounded and retried; same failure modes as ci.yml's install step
        # (stalled apt mirrors, orphaned dpkg locks between attempts).
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Install attempt ${attempt} failed or hung; clearing stale apt state and retrying."
            sudo killall -q apt-get apt dpkg 2>/dev/null || true
            for i in $(seq 1 30); do
              if ! sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            sudo dpkg --configure -a 2>/dev/null || true
          done
          echo "Chromium could not be installed after 3 bounded attempts."
          exit 1

      - name: Start the local Supabase stack
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        # Only db, auth, rest and kong; the rest is excluded so the stack boots
        # lean. config.toml reads SMTP through env(), so dummies must exist for
        # auth to start — no mail is ever sent, because the journey's user is
        # minted pre-confirmed through the admin API.
        env:
          SUPABASE_AUTH_SMTP_HOST: localhost
          SUPABASE_AUTH_SMTP_USER: journey
          SUPABASE_AUTH_SMTP_PASS: journey
          SUPABASE_AUTH_SMTP_SENDER_NAME: journey
          SUPABASE_AUTH_SMTP_ADMIN_EMAIL: journey@example.com
        run: |
          npx --yes supabase@2 start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Mint the owner and point the app at the stack
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        # The local stack's keys are the Supabase CLI's public development
        # defaults, not secrets.
        run: |
          STATUS=$(npx supabase status -o json)
          SUPA_URL=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin)['API_URL'])")
          ANON=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ANON_KEY') or d.get('PUBLISHABLE_KEY',''))")
          SERVICE=$(echo "$STATUS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('SERVICE_ROLE_KEY') or d.get('SECRET_KEY',''))")
          USER_ID=$(curl -sf -X POST "$SUPA_URL/auth/v1/admin/users" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            -H "Content-Type: application/json" \
            -d '{"email":"factory.owner@example.com","password":"fake-data-journey-2026!","email_confirm":true,"user_metadata":{"full_name":"Factory Owner"}}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "JOURNEY_USER_ID=$USER_ID" >> "$GITHUB_ENV"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPA_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON"
            # Creating a bot checks, server-side, that the account's credential
            # slot resolves — the check that caught the catalogue/allowlist
            # mismatch. This is a fake placeholder so that check has something
            # to find; it is not a credential and authenticates nothing, and
            # the journey never calls a provider with it.
            echo "SOFTWAREFACTORY_CLAUDE_CODE_OAUTH_TOKEN=fake-journey-placeholder-not-a-credential"
          } > .env.local

      - name: Seed the workspace and the GitHub installation
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        # Step 1 of the journey only: the rows a real App installation records.
        # Everything after this is performed in the browser by the spec.
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 \
            -v user_id="'${JOURNEY_USER_ID}'" <<'SEED'
          insert into public.profiles (id, display_name)
          values (:user_id, 'Factory Owner')
          on conflict (id) do nothing;

          insert into public.organizations (id, name, slug, created_by)
          values ('10000000-0000-4000-8000-0000000fa001', 'Fake Factory', 'fake-factory', :user_id);

          insert into public.organization_members (organization_id, user_id, role, created_by)
          values ('10000000-0000-4000-8000-0000000fa001', :user_id, 'owner', :user_id)
          on conflict do nothing;

          insert into public.connections (
            id, organization_id, name, provider, status, external_account_label,
            secret_reference, created_by
          ) values (
            '20000000-0000-4000-8000-0000000fa001', '10000000-0000-4000-8000-0000000fa001',
            'GitHub', 'github', 'connected', 'fake-owner', 'env://GITHUB_APP', :user_id
          );

          insert into public.github_installations (
            id, organization_id, connection_id, external_installation_id, app_id, app_slug,
            account_id, account_login, account_type, target_type, repository_selection,
            status, installed_at, created_by
          ) values (
            '30000000-0000-4000-8000-0000000fa001', '10000000-0000-4000-8000-0000000fa001',
            '20000000-0000-4000-8000-0000000fa001', 700123, 4582606, 'fake-factory-app',
            900001, 'fake-owner', 'User', 'User', 'selected', 'active', now(), :user_id
          );

          -- Signing into Claude is an external account action like the App
          -- install, so the row that sign-in would have recorded is seeded
          -- and nothing further. The credential itself is never here: the row
          -- names the vault slot -- 'claude' is the broker's slot 1, exactly
          -- what a real sign-in records -- and the journey's bot creation is
          -- what exercises the server-side reference check.
          insert into public.ai_accounts (
            id, organization_id, provider, auth_method, display_name, status,
            credential_purpose, last_verified_at, created_by
          ) values (
            '40000000-0000-4000-8000-0000000fa001', '10000000-0000-4000-8000-0000000fa001',
            'anthropic', 'subscription', 'Fake Claude Account', 'connected',
            'claude', now(), :user_id
          );

          -- A completed broker sign-in also leaves a sealed credential row.
          -- This inert envelope is shape-valid but cannot authenticate or be
          -- opened; the fake environment placeholder above is what makes the
          -- local readiness check resolve without any provider call.
          insert into public.provider_credentials (
            organization_id, purpose, sealed_envelope, source, created_by
          ) values (
            '10000000-0000-4000-8000-0000000fa001', 'claude',
            'v1.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',
            'connect_session', :user_id
          );

          insert into public.github_repositories (
            id, organization_id, installation_id, external_repository_id, owner_login, name,
            full_name, default_branch, html_url, private, visibility, selected, github_updated_at
          ) values (
            '50000000-0000-4000-8000-0000000fa001', '10000000-0000-4000-8000-0000000fa001',
            '30000000-0000-4000-8000-0000000fa001', 900123, 'fake-owner', 'storefront',
            'fake-owner/storefront', 'main', 'https://github.com/fake-owner/storefront',
            true, 'private', true, now()
          );
          SEED

      - name: Build and serve the production app
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        run: |
          npm run build
          # Readiness evidence is deliberately service-only: the recorder RPC
          # is granted to service_role alone, and readiness-sync builds its own
          # client from this variable. Without it every readiness sync throws,
          # Connect Bots never reports a ready bot, and steps 5 to 9 cannot be
          # reached — which is exactly what this lane did, silently, until the
          # walk was run by hand.
          SUPABASE_SERVICE_ROLE_KEY=$(npx supabase status -o json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('SERVICE_ROLE_KEY') or d.get('SECRET_KEY',''))")
          export SUPABASE_SERVICE_ROLE_KEY
          nohup npx next start > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "The app never answered on :3000."
          tail -50 next-start.log
          exit 1

      - name: Run the journey (local stack)
        if: ${{ inputs.base_url == '' || inputs.base_url == null }}
        env:
          AI_FACTORY_E2E: 1
          AI_FACTORY_E2E_SEEDED: 1
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test tests/e2e/ai-factory-journey.spec.ts --project=desktop-chromium --reporter=line

      - name: Run the journey (remote target)
        # AI_FACTORY_E2E_SEEDED is never set here: no runner may write to a
        # hosted database. AI_FACTORY_E2E_INSTALLED carries the owner's tick
        # instead -- the claim that a person really installed the App on that
        # workspace, which is the only honest way step 1 is done on a deployed
        # site. Unticked, the nine-step walk skips itself and what runs is the
        # signed-in read.
        if: ${{ inputs.base_url != '' && inputs.base_url != null }}
        env:
          AI_FACTORY_E2E: 1
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          AI_FACTORY_E2E_EMAIL: ${{ inputs.email }}
          AI_FACTORY_E2E_PASSWORD: ${{ inputs.password }}
          AI_FACTORY_E2E_INSTALLED: ${{ inputs.walk_all_steps && '1' || '' }}
        run: npx playwright test tests/e2e/ai-factory-journey.spec.ts --project=desktop-chromium --reporter=line

      - name: Report what the app logged if the journey failed
        if: failure() && (inputs.base_url == '' || inputs.base_url == null)
        run: tail -80 next-start.log || true
